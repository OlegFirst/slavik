version: '3.8'

services:
  bcm-admin:
    build:
      context: .
      target: development  # Use 'production' for production build
    container_name: bcm-admin-control-center
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - VITE_BCM_API_URL=http://localhost:8069
      - VITE_AI_ORCHESTRATOR_URL=http://localhost:8000
      - VITE_PROMETHEUS_URL=http://localhost:9090
      - VITE_GRAFANA_URL=http://localhost:3000
    volumes:
      # Mount source code for hot reload in development
      - ./src:/app/src:ro
      - ./index.html:/app/index.html:ro
      - ./vite.config.ts:/app/vite.config.ts:ro
    networks:
      - bcm-network
    depends_on:
      - bcm-core
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  bcm-admin-prod:
    build:
      context: .
      target: production
    container_name: bcm-admin-control-center-prod
    ports:
      - "3001:80"
    environment:
      - NODE_ENV=production
    networks:
      - bcm-network
    restart: unless-stopped
    profiles:
      - production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Mock BCM services for development
  bcm-core:
    image: nginx:alpine
    container_name: bcm-core-mock
    ports:
      - "8069:80"
    volumes:
      - ./mock-api:/usr/share/nginx/html
    networks:
      - bcm-network
    profiles:
      - mock

networks:
  bcm-network:
    driver: bridge
    name: bcm-platform-network
    external: true

volumes:
  node_modules:
