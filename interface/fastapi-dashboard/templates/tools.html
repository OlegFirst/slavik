<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tools Management - AI Platform ISO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        /* Navigation */
        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar-brand {
            font-size: 24px;
            font-weight: 700;
            color: #1e3c72;
            text-decoration: none;
        }

        .navbar-menu {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .navbar-menu a {
            text-decoration: none;
            color: #4a5568;
            font-weight: 500;
            transition: color 0.2s;
        }

        .navbar-menu a:hover {
            color: #1e3c72;
        }

        .navbar-menu a.active {
            color: #1e3c72;
            border-bottom: 2px solid #1e3c72;
            padding-bottom: 2px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .header h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .stat-card h3 {
            color: #666;
            font-size: 14px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .stat-card .value {
            color: #667eea;
            font-size: 36px;
            font-weight: bold;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .tool-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .tool-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .tool-card.junior { border-left: 4px solid #48bb78; }
        .tool-card.middle { border-left: 4px solid #ed8936; }
        .tool-card.senior { border-left: 4px solid #e53e3e; }

        .tool-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .tool-name {
            font-size: 20px;
            font-weight: 600;
            color: #333;
        }

        .tool-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .tool-badge.junior { background: #c6f6d5; color: #22543d; }
        .tool-badge.middle { background: #feebc8; color: #7c2d12; }
        .tool-badge.senior { background: #fed7d7; color: #742a2a; }

        .tool-description {
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .tool-status {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            padding: 10px;
            background: #f7fafc;
            border-radius: 8px;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .status-indicator.available { background: #48bb78; }
        .status-indicator.unavailable { background: #e53e3e; }

        .tool-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a67d8;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 700px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 24px;
            font-weight: 600;
            color: #333;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-section {
            background: #f7fafc;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }

        .result-section h3 {
            margin-bottom: 10px;
            color: #333;
        }

        pre {
            background: #2d3748;
            color: #e2e8f0;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <a href="/" class="navbar-brand">🤖 AI Platform ISO</a>
        <ul class="navbar-menu">
            <li><a href="/">Dashboard</a></li>
            <li><a href="/tools" class="active">Tools</a></li>
            <li><a href="/monitoring">Monitoring</a></li>
            <li><a href="http://localhost:3000" target="_blank">Grafana</a></li>
            <li><a href="http://localhost:9090" target="_blank">Prometheus</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="header">
            <h1>🔧 Analysis Tools</h1>
            <p>Manage and execute platform analysis tools</p>
        </div>

        <div class="stats" id="stats">
            <div class="stat-card">
                <h3>Total Tools</h3>
                <div class="value" id="total-tools">-</div>
            </div>
            <div class="stat-card">
                <h3>Available</h3>
                <div class="value" id="available-tools">-</div>
            </div>
            <div class="stat-card">
                <h3>Competency Level</h3>
                <div class="value" id="competency-level">-</div>
            </div>
        </div>

        <div class="tools-grid" id="tools-grid"></div>
    </div>

    <!-- Execution Modal -->
    <div class="modal" id="execution-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modal-title">Running Tool...</div>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="modal-body">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Executing tool, please wait...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let toolsData = {};

        window.addEventListener('DOMContentLoaded', loadTools);

        async function loadTools() {
            try {
                const response = await fetch('/api/tools/list');
                const data = await response.json();

                toolsData = data.tools || {};

                document.getElementById('total-tools').textContent = Object.keys(toolsData).length;
                document.getElementById('available-tools').textContent =
                    Object.values(toolsData).filter(t => t.available).length;
                document.getElementById('competency-level').textContent =
                    (data.competency_level || 'Unknown').toUpperCase();

                renderTools();
            } catch (error) {
                console.error('Failed to load tools:', error);
                document.getElementById('tools-grid').innerHTML =
                    '<p style="color: white;">Failed to load tools. Is Analytics Specialist running?</p>';
            }
        }

        function renderTools() {
            const grid = document.getElementById('tools-grid');
            grid.innerHTML = '';

            const toolDescriptions = {
                'metrics_discovery': 'Discovers and analyzes metrics from all services',
                'module_scanner': 'Scans and catalogs all Python modules',
                'ast_analyzer': 'Analyzes Python code structure using AST',
                'dependency_mapper': 'Maps dependencies between services',
                'api_mapper': 'Maps all API endpoints across services',
                'dependency_validator': 'Validates dependencies and checks for issues',
                'security_scanner': 'Scans code for security vulnerabilities'
            };

            for (const [name, tool] of Object.entries(toolsData)) {
                const card = document.createElement('div');
                card.className = `tool-card ${tool.competency_required}`;

                card.innerHTML = `
                    <div class="tool-header">
                        <div class="tool-name">${name.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase())}</div>
                        <div class="tool-badge ${tool.competency_required}">${tool.competency_required}</div>
                    </div>
                    <div class="tool-description">${toolDescriptions[name] || tool.description}</div>
                    <div class="tool-status">
                        <div class="status-indicator ${tool.available ? 'available' : 'unavailable'}"></div>
                        <span>${tool.available ? 'Available' : 'Unavailable'}</span>
                    </div>
                    <div class="tool-actions">
                        <button class="btn btn-primary" onclick="runTool('${name}')" ${!tool.available ? 'disabled' : ''}>
                            ▶ Run Now
                        </button>
                    </div>
                `;

                grid.appendChild(card);
            }
        }

        async function runTool(toolName) {
            const modal = document.getElementById('execution-modal');
            const title = document.getElementById('modal-title');
            const body = document.getElementById('modal-body');

            title.textContent = `Running ${toolName}...`;
            body.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Executing tool, please wait...</p>
                </div>
            `;
            modal.classList.add('active');

            try {
                const response = await fetch(`/api/tools/${toolName}/execute`, { method: 'POST' });
                const result = await response.json();

                title.textContent = `${toolName} - Results`;
                body.innerHTML = `
                    <div class="result-section">
                        <h3>Execution Complete ✅</h3>
                        <pre>${JSON.stringify(result, null, 2)}</pre>
                    </div>
                `;
            } catch (error) {
                title.textContent = `${toolName} - Error`;
                body.innerHTML = `
                    <div class="result-section">
                        <h3>Execution Failed ❌</h3>
                        <pre>${error.message}</pre>
                    </div>
                `;
            }
        }

        function closeModal() {
            document.getElementById('execution-modal').classList.remove('active');
        }
    </script>
</body>
</html>
