[pytest]
minversion = 7.0
asyncio_mode = auto
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    --strict-markers
    -v
    -s
    --tb=short
    --maxfail=5
    --durations=10

markers =
    integration: Integration tests requiring all services
    slow: Slow-running tests (> 5s)
    requires_docker: Tests requiring Docker
    workflow: End-to-end workflow tests
    api: API integration tests
    eventbus: EventBus integration tests
    auth: Authentication/authorization tests
    resilience: Resilience and error handling tests
    performance: Performance tests
    cache: Cache integration tests
    data_consistency: Data consistency tests
    monitoring: Monitoring and observability tests

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
