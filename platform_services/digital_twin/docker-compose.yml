version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: digital-twin-postgres
    environment:
      POSTGRES_DB: digital_twin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - digital-twin-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: digital-twin-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - digital-twin-network

  # Digital Twin API
  api:
    build: .
    container_name: digital-twin-api
    ports:
      - "8090:8090"
    environment:
      # Database
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: digital_twin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # Environment
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      PORT: 8090

      # Optional external services (if needed)
      ODOO_URL: ${ODOO_URL:-}
      SALESFORCE_USERNAME: ${SALESFORCE_USERNAME:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - digital-twin-network
    restart: unless-stopped
    volumes:
      # Mount logs directory
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # NOTE: BIA Engine and Scenario AI are now INTEGRATED into Digital Twin API
  # No need for separate microservices:
  # - Queue Theory BIA is in core/engine/queue_theory_engine.py
  # - Advanced AI Generator is in core/ai/advanced_scenario_generator.py

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  digital-twin-network:
    driver: bridge
