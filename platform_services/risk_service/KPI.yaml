module_name: risk-service
version: 1.0.0
description: '**Type**: Platform Service'
module_type: service
owner: platform-team
kpis:
- name: request_count
  description: Total number of requests processed by risk-service
  type: counter
  target: '> 1000/day'
  measurement: Count of API requests
  prometheus_metric: risk_service_requests_total
- name: response_time_p95
  description: 95th percentile response time
  type: histogram
  target: < 500ms
  measurement: Response time in milliseconds
  prometheus_metric: risk_service_response_time_ms
- name: error_rate
  description: Percentage of failed requests
  type: gauge
  target: < 1%
  measurement: errors / total_requests * 100
  prometheus_metric: risk_service_error_rate
- name: availability
  description: Service uptime percentage
  type: gauge
  target: '> 99.5%'
  measurement: uptime / total_time * 100
  prometheus_metric: risk_service_availability
- name: risks_identified
  description: Number of risks identified and tracked
  type: counter
  target: '> 100 active risks'
  measurement: Count of active risks in system
  prometheus_metric: risks_identified_total
- name: mitigation_rate
  description: Percentage of risks with mitigation plans
  type: gauge
  target: '> 90%'
  measurement: risks_with_mitigation / total_risks * 100
  prometheus_metric: risk_mitigation_rate
monitoring:
  prometheus_enabled: true
  grafana_dashboard: dashboards/risk-service.json
  alert_rules: alerts/risk-service.yaml
targets:
  daily: Track daily metrics
  weekly: Review weekly trends
  monthly: Monthly performance review
