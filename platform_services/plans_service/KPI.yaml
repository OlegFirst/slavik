module_name: plans_service
version: 1.0.0
description: '**Service:** `plans_service`'
module_type: service
owner: platform-team
kpis:
- name: request_count
  description: Total number of requests processed by plans_service
  type: counter
  target: '> 1000/day'
  measurement: Count of API requests
  prometheus_metric: plans_service_requests_total
- name: response_time_p95
  description: 95th percentile response time
  type: histogram
  target: < 500ms
  measurement: Response time in milliseconds
  prometheus_metric: plans_service_response_time_ms
- name: error_rate
  description: Percentage of failed requests
  type: gauge
  target: < 1%
  measurement: errors / total_requests * 100
  prometheus_metric: plans_service_error_rate
- name: availability
  description: Service uptime percentage
  type: gauge
  target: '> 99.5%'
  measurement: uptime / total_time * 100
  prometheus_metric: plans_service_availability
monitoring:
  prometheus_enabled: true
  grafana_dashboard: dashboards/plans_service.json
  alert_rules: alerts/plans_service.yaml
targets:
  daily: Track daily metrics
  weekly: Review weekly trends
  monthly: Monthly performance review
