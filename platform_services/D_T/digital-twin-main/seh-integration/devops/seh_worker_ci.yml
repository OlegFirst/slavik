name: seh-worker-ci
on:
  push:
    paths:
      - worker/**
      - worker_runner.ts
      - supabase_edge_mcp_intake.ts
      - SEH_OpenAPI_v1.yaml
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || true
      - run: npx tsc --version || true
      - run: echo "Lint/schema tests could go here"
  deploy-edge:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Supabase Edge Function
        run: |
          echo "supabase functions deploy mcp-intake" 
          echo "(hook your Supabase CLI here)"
