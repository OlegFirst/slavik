[pytest]
# Test paths - where pytest should look for tests
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support
asyncio_mode = auto

# Test discovery patterns
# -k: filter by test name pattern
# -m: filter by marker
# Example: pytest -m "unit and not slow"

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (multiple components)
    e2e: End-to-end tests (full workflows)
    slow: Slow tests (deselect with '-m "not slow"')
    security: Security tests (SQL injection, XSS, etc.)
    performance: Performance and load tests
    vcr: Tests using VCR for HTTP recording

    # Service-specific markers
    platform_services: Platform services tests
    intelligent_core: Intelligent core tests
    infrastructure: Infrastructure tests

    # Feature markers
    requires_db: Tests requiring database
    requires_redis: Tests requiring Redis
    requires_temporal: Tests requiring Temporal
    requires_llm: Tests requiring LLM API

# Minimum Python version
minversion = 3.9

# Output options
addopts =
    -ra
    --strict-markers
    --strict-config
    --showlocals
    --tb=short

# Coverage options
# To run with coverage: pytest tests/ --cov
# Coverage configuration below applies when --cov flag is used

# Timeout for tests (seconds)
timeout = 300

# Disable warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Coverage configuration
[coverage:run]
source =
    platform-services
    intelligent-core
    infrastructure
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */.venv/*
    */migrations/*
    */alembic/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

[coverage:html]
directory = htmlcov
