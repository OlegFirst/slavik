version: '3.8'

services:
  system-bcm:
    build: .
    container_name: system-bcm-service
    ports:
      - "8050:8050"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOG_LEVEL=INFO
      - CYCLE_INTERVAL_HOURS=24
    volumes:
      - ./logs:/var/log
      - ./scenarios:/app/scenarios
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - platform_network

  redis:
    image: redis:7-alpine
    container_name: system-bcm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - platform_network

  prometheus:
    image: prom/prometheus:latest
    container_name: system-bcm-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    networks:
      - platform_network

  grafana:
    image: grafana/grafana:latest
    container_name: system-bcm-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - platform_network

volumes:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  platform_network:
    external: true
