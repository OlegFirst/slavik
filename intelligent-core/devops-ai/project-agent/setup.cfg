[metadata]
name = project-agent
version = 1.0.0
description = Universal CLI for project analysis with automatic domain detection (ISO 22301, Security, Fintech, Healthcare)
long_description = file: README.md
long_description_content_type = text/markdown
author = SEH Foundation
license = MIT
keywords = security, testing, quality, compliance, iso22301, analysis, code-review
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Topic :: Software Development :: Quality Assurance
    Topic :: Security

[options]
packages = find:
python_requires = >=3.8
install_requires =
    click>=8.1.7
    rich>=13.7.1
    markdown-it-py>=3.0.0
    GitPython>=3.1.43
    pyyaml>=6.0.2
    javalang>=0.13.0

[options.entry_points]
console_scripts =
    project-agent = agent.cli:main
