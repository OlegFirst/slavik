version: '3.8'

services:
  coordination-center:
    build: .
    container_name: coordination-center
    ports:
      - "8004:8004"
    environment:
      - COORDINATION_PORT=8004
      - PLATFORM_GATEWAY_URL=http://host.docker.internal:8000
      - INTELLIGENCE_GATEWAY_URL=http://host.docker.internal:8035
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - MAX_REQUESTS_PER_MINUTE=100
    volumes:
      - ./:/app
    networks:
      - coordination-network
    restart: unless-stopped

networks:
  coordination-network:
    driver: bridge
