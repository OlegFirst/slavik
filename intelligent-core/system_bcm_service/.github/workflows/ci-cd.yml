# System BCM - CI/CD Pipeline
# Automated testing, building, and deployment

name: System BCM CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'intelligent-core/system-bcm-service/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'intelligent-core/system-bcm-service/**'
  workflow_dispatch:

env:
  DOCKER_IMAGE: system-bcm-service
  DOCKER_TAG: latest
  SERVICE_PORT: 8050

jobs:
  # Job 1: Code Quality & Linting
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: intelligent-core/system-bcm-service
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black mypy pylint
          pip install -r requirements.txt

      - name: Run Black (code formatting)
        working-directory: intelligent-core/system-bcm-service
        run: black --check --line-length 100 .

      - name: Run Flake8 (linting)
        working-directory: intelligent-core/system-bcm-service
        run: flake8 --max-line-length=100 --ignore=E501,W503 .

      - name: Run MyPy (type checking)
        working-directory: intelligent-core/system-bcm-service
        run: mypy --ignore-missing-imports .

      - name: Run Pylint
        working-directory: intelligent-core/system-bcm-service
        run: pylint --max-line-length=100 --disable=C0111,R0903 system_bcm/ learning/

  # Job 2: Unit Tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: intelligent-core/system-bcm-service
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio
          pip install -r requirements.txt

      - name: Run unit tests with coverage
        working-directory: intelligent-core/system-bcm-service
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./intelligent-core/system-bcm-service/coverage.xml
          flags: unittests
          name: system-bcm-coverage

  # Job 3: Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: intelligent-core/system-bcm-service
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio redis
          pip install -r requirements.txt

      - name: Run integration tests
        working-directory: intelligent-core/system-bcm-service
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          pytest tests/test_integration.py -v

  # Job 4: Performance Tests
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: integration-tests
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: intelligent-core/system-bcm-service
        run: |
          python -m pip install --upgrade pip
          pip install pytest psutil requests
          pip install -r requirements.txt

      - name: Start System BCM service
        working-directory: intelligent-core/system-bcm-service
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          python main.py &
          sleep 10  # Wait for service to start

      - name: Run performance tests
        working-directory: intelligent-core/system-bcm-service
        run: |
          pytest tests/test_performance.py -v -s

      - name: Upload performance report
        uses: actions/upload-artifact@v3
        with:
          name: performance-report
          path: intelligent-core/system-bcm-service/performance-report.html

  # Job 5: Security Scan
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: intelligent-core/system-bcm-service
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit

      - name: Run Safety (dependency vulnerabilities)
        working-directory: intelligent-core/system-bcm-service
        run: |
          pip install -r requirements.txt
          safety check --json

      - name: Run Bandit (code security)
        working-directory: intelligent-core/system-bcm-service
        run: |
          bandit -r . -f json -o bandit-report.json

      - name: Upload security reports
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: intelligent-core/system-bcm-service/*-report.json

  # Job 6: Docker Build
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, performance-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        working-directory: intelligent-core/system-bcm-service
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }} .
          docker build -t ${{ env.DOCKER_IMAGE }}:${{ github.sha }} .

      - name: Test Docker image
        run: |
          docker run -d -p ${{ env.SERVICE_PORT }}:${{ env.SERVICE_PORT }} \
            --name system-bcm-test \
            ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}

          # Wait for service to start
          sleep 10

          # Health check
          curl -f http://localhost:${{ env.SERVICE_PORT }}/health || exit 1

      - name: Save Docker image
        run: |
          docker save ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }} | \
            gzip > system-bcm-image.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v3
        with:
          name: docker-image
          path: system-bcm-image.tar.gz

  # Job 7: Deployment Validation
  deployment-validation:
    name: Validate Deployment
    runs-on: ubuntu-latest
    needs: docker-build
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download Docker image
        uses: actions/download-artifact@v3
        with:
          name: docker-image

      - name: Load Docker image
        run: |
          docker load < system-bcm-image.tar.gz

      - name: Create platform network
        run: |
          docker network create platform_network || true

      - name: Run System BCM container
        run: |
          docker run -d \
            --name system-bcm-service \
            --network platform_network \
            -p ${{ env.SERVICE_PORT }}:${{ env.SERVICE_PORT }} \
            -e REDIS_HOST=redis \
            -e REDIS_PORT=6379 \
            ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}

      - name: Wait for service
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:${{ env.SERVICE_PORT }}/health; then
              echo "Service is healthy"
              exit 0
            fi
            echo "Waiting for service... ($i/30)"
            sleep 2
          done
          echo "Service failed to start"
          exit 1

      - name: Run validation script
        working-directory: intelligent-core/system-bcm-service
        run: |
          chmod +x validate-deployment.sh
          ./validate-deployment.sh

  # Job 8: Deploy to Staging (on push to develop)
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: deployment-validation
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: staging
      url: http://staging.ai-platform-iso.local:8050
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download Docker image
        uses: actions/download-artifact@v3
        with:
          name: docker-image

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add your staging deployment commands here
          # Example: docker-compose -f docker-compose.staging.yml up -d

  # Job 9: Deploy to Production (on push to main)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deployment-validation
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: http://ai-platform-iso.local:8050
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download Docker image
        uses: actions/download-artifact@v3
        with:
          name: docker-image

      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Add your production deployment commands here
          # Example: docker-compose -f docker-compose.production.yml up -d

      - name: Verify production deployment
        run: |
          # Wait for service
          sleep 30

          # Health check
          curl -f http://ai-platform-iso.local:${{ env.SERVICE_PORT }}/health || exit 1

          # Trigger first BCM cycle
          curl -X POST http://ai-platform-iso.local:${{ env.SERVICE_PORT }}/cycle/trigger

      - name: Notify deployment
        run: |
          echo "System BCM successfully deployed to production!"
          # Add notification logic (Slack, email, etc.)
