deployment:
  environment: production
  build_command: npm run build
  start_command: npm run start
  health_check: /health
  readiness_check: /ready
  environment_variables:
  - NEXT_PUBLIC_API_URL
  - NEXT_PUBLIC_WS_URL
  - NEXT_PUBLIC_AUTH_URL
  resources:
    cpu: 1 core
    memory: 512MB
    storage: 1GB
metadata:
  template_version: 1.0.0
  created_by: scenario_manager
  created_at: '2025-10-12'
  applicable_to:
    main_applications:
    - bcm_portal
    - simulation_platform
    - expert_marketplace
    - digital_twin
    bcm_modules:
    - bia
    - risk
    - plans
    - response
    - validation
    - compliance
    - governance
    - learning
    - documents
    - planning
    - analytics
