  estimated_generation_time: 2 minutes per scenario
  total_scenarios_to_generate: 16
  notes: 'This template is designed for user-facing applications and BCM modules.

    It focuses on:

    - User authentication and authorization

    - UI/UX validation

    - Business functionality testing

    - Data integration

    - Security and data protection

    - Performance under load


    Different from L1 Service template which focuses on:

    - Infrastructure health

    - Service dependencies

    - Technical resilience

    '
