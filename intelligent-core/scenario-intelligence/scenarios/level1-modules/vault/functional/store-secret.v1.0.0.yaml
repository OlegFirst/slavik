scenario:
  # ========== METADATA ==========
  meta:
    id: "vault-store-secret-encrypted"
    version: "1.0.0"
    level: 1  # Module level
    type: "functional"
    pillar: "security"
    domain: "secrets_management"

    created_at: "2025-01-15T10:00:00Z"
    updated_at: "2025-01-15T10:00:00Z"
    created_by: "security-team"

  # ========== OWNERSHIP ==========
  ownership:
    module: "vault"
    subsystem: "security"
    team: "security-team"

  # ========== DESCRIPTION ==========
  description:
    title: "Store encrypted secret in Vault"
    summary: "Securely store API keys and secrets with AES-256 encryption"
    business_value: "Protect sensitive credentials from unauthorized access"

  # ========== BEHAVIOR (Gherkin) ==========
  behavior:
    feature: "Vault Secret Management"

    scenario: "Store secret with encryption"

    given:
      - "Vault service is running"
      - "User has permission 'secrets:write'"
      - "Encryption key is available"

    when:
      - "User stores secret 'api-key' with value 'xyz123'"

    then:
      - "Secret is encrypted with AES-256-GCM"
      - "Secret is stored in Vault database"
      - "Audit log entry is created"
      - "Response status is 200"

  # ========== EXECUTION ==========
  execution:
    steps:
      - id: "validate_permissions"
        action: "vault.check_permission"
        params:
          user_id: "{{user_id}}"
          permission: "secrets:write"
        expect:
          status: 200
          has_permission: true

      - id: "encrypt_secret"
        action: "vault.encrypt"
        params:
          data: "{{secret_value}}"
          algorithm: "AES-256-GCM"
        expect:
          encrypted: true

      - id: "store_secret"
        action: "vault.store"
        params:
          name: "{{secret_name}}"
          encrypted_value: "{{steps.encrypt_secret.result}}"
        expect:
          status: 200

  # ========== INTEGRATION ==========
  integration:
    calls:
      - scenario_id: "audit-log-create-entry"
        level: 1
        when: "after_store"
        params:
          event: "secret_stored"

    events:
      emits:
        - event_type: "vault.secret.stored"
          aggregate: "VaultSecret"
          aggregate_id: "{{secret_name}}"
          payload:
            secret_name: "{{secret_name}}"
            user_id: "{{user_id}}"

  # ========== COMPLIANCE ==========
  compliance:
    iso_22301:
      clauses:
        - id: "7.5.3"
          name: "Control of documented information"
          requirement: "Retain audit logs for 7 years"

      evidence_generated:
        - type: "audit_log"
          format: "JSON"
          storage: "compliance_archive"
          retention: "7 years"
          includes:
            - "user_id"
            - "timestamp"
            - "action"

  # ========== OBSERVABILITY ==========
  observability:
    metrics:
      - name: "vault_secret_store_duration_seconds"
        type: "histogram"

      - name: "vault_secret_store_total"
        type: "counter"

  # ========== CHANGELOG ==========
  changelog:
    - version: "1.0.0"
      date: "2025-01-15"
      author: "security-team"
      changes:
        - "Initial version"
