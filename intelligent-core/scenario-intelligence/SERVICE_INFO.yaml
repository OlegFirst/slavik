  integration_tests: /intelligent-core/scenario-intelligence/tests/integration/
  e2e_tests: /intelligent-core/scenario-intelligence/tests/e2e/
  main_test: /intelligent-core/scenario-intelligence/test_scenario_system.py
  coverage_target: 80

examples:
