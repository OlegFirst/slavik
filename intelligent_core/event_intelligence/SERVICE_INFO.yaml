# ============================================
# SERVICE INFORMATION - Event Intelligence
# ============================================
# Auto-generated: false
# Last updated: 2025-10-11
# Schema version: 1.0.0

# ============================================
# 1. BASIC INFORMATION
# ============================================
name: event_intelligence
display_name: "Event Intelligence & Self-Healing"
version: "2.0.0"
description: "Intelligent event analysis, pattern detection, domain detection, error analysis, and automated code healing for platform stability and resilience."

# ============================================
# 2. CLASSIFICATION
# ============================================
type: "intelligent-core/event-intelligence"
business_process: "Event Analysis & Automated Healing"
status: "active"

# ============================================
# 3. TECHNICAL PARAMETERS
# ============================================
runtime:
  language: "python"
  framework: "FastAPI"
  version: "3.11+"
  port: 8032

endpoints:
  base_url: "http://localhost:8032"
  health: "/health"
  metrics: "/metrics"
  api_docs: "/docs"
  api_base: "/api/events"

# ============================================
# 4. FUNCTIONALITY
# ============================================
capabilities:
  - "Real-time event stream analysis"
  - "Pattern detection and anomaly identification"
  - "Domain detection (auto-classify events by business domain)"
  - "Error analysis and root cause identification"
  - "Automated code healing and self-repair"
  - "Event correlation and clustering"
  - "Predictive error forecasting"
  - "Event-driven alerts and notifications"
  - "Historical event analytics"

features:
  - name: "Event Analysis"
    description: "Real-time analysis of platform events"
    endpoints: 5

  - name: "Pattern Detection"
    description: "Identify patterns and anomalies in event streams"
    endpoints: 3

  - name: "Domain Detection"
    description: "Auto-classify events by business domain"
    endpoints: 3

  - name: "Error Analysis"
    description: "Root cause analysis for errors and failures"
    endpoints: 3

  - name: "Self-Healing"
    description: "Automated code healing and repair mechanisms"
    endpoints: 3

# ============================================
# 5. KPIS & METRICS
# ============================================
kpis:
  - name: "request_count"
    type: "counter"
    description: "Total number of events processed"
    target: "> 5000/day"
    prometheus_metric: "event_intelligence_requests_total"

  - name: "response_time_p95"
    type: "histogram"
    description: "95th percentile event processing time"
    target: "< 200ms"
    prometheus_metric: "event_intelligence_response_time_ms"

  - name: "error_rate"
    type: "gauge"
    description: "Percentage of failed event processing"
    target: "< 0.5%"
    prometheus_metric: "event_intelligence_error_rate"

  - name: "availability"
    type: "gauge"
    description: "Service uptime percentage"
    target: "> 99.9%"
    prometheus_metric: "event_intelligence_availability"

  - name: "pattern_detection_accuracy"
    type: "gauge"
    description: "Accuracy of pattern detection"
    target: "> 85%"
    prometheus_metric: "event_intelligence_pattern_accuracy"

  - name: "self_healing_success_rate"
    type: "gauge"
    description: "Percentage of successfully healed errors"
    target: "> 70%"
    prometheus_metric: "event_intelligence_healing_success_rate"

  - name: "domain_classification_accuracy"
    type: "gauge"
    description: "Accuracy of domain detection"
    target: "> 90%"
    prometheus_metric: "event_intelligence_domain_accuracy"

  - name: "events_processed_total"
    type: "counter"
    description: "Total events processed"
    target: "Track trends"
    prometheus_metric: "event_intelligence_events_processed_total"

# ============================================
# 6. DEPENDENCIES
# ============================================
dependencies:
  packages:
    - "fastapi>=0.104.0"
    - "uvicorn[standard]>=0.24.0"
    - "sqlalchemy[asyncio]>=2.0.0"
    - "asyncpg>=0.29.0"
    - "pydantic>=2.4.0"
    - "redis>=5.0.0"
    - "aio-pika>=9.3.0"
    - "scikit-learn>=1.3.0"
    - "prometheus-client>=0.19.0"

  services:
    - name: "postgresql"
      version: "14+"
      purpose: "Event storage and analytics"
      required: true

    - name: "redis"
      version: "7+"
      purpose: "Real-time event stream processing"
      required: true

    - name: "rabbitmq"
      version: "3.12+"
      purpose: "Event ingestion"
      required: true

# ============================================
# 7. INTEGRATIONS
# ============================================
integrations:
  eventbus:
    subscribes:
      - event: "*"
        source: "all_services"
        action: "Analyze all platform events"

    publishes:
      - event: "pattern.detected"
        target: "orchestrator,monitoring"
        data: "pattern_type, confidence, affected_services"

      - event: "error.healed"
        target: "all_services"
        data: "error_type, healing_action, success"

      - event: "anomaly.detected"
        target: "orchestrator,response_service"
        data: "anomaly_type, severity, context"

  rest_api:
    provides:
      - endpoint: "/api/events/analyze"
        methods: ["POST"]
        consumers: ["orchestrator", "monitoring"]

      - endpoint: "/api/events/patterns"
        methods: ["GET"]
        consumers: ["admin_panel"]

# ============================================
# 8. DEPLOYMENT
# ============================================
deployment:
  docker:
    image: "event-intelligence:latest"
    ports:
      - "8032:8032"

  environment_variables:
    required:
      - name: "DATABASE_URL"
        example: "postgresql+asyncpg://user:pass@localhost:5432/bcm"
      - name: "REDIS_URL"
        example: "redis://localhost:6379/0"
      - name: "EVENTBUS_URL"
        example: "amqp://guest:guest@localhost:5672/"

  startup_command: "python -m event_intelligence.main"

  requirements:
    cpu: "1.0 cores"
    memory: "1GB"
    disk: "5GB"

# ============================================
# 9. OWNERSHIP
# ============================================
ownership:
  team: "Intelligent Core Team"
  tech_lead: "AI Platform Architect"
  slack_channel: "#intelligent-core"

# ============================================
# 10. COMPLIANCE
# ============================================
compliance:
  standards:
    - name: "ISO/IEC/IEEE 26514:2022"
      status: "compliant"
