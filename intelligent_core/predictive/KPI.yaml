module_name: predictive
version: 1.0.0
description: '**Type**: Core Module'
module_type: intelligence
owner: platform-team
kpis:
- name: predictions_made
  description: Number of predictions/recommendations made by predictive
  type: counter
  target: '> 100/day'
  measurement: Count of AI predictions
  prometheus_metric: predictive_predictions_total
- name: prediction_accuracy
  description: Accuracy of AI predictions
  type: gauge
  target: '> 85%'
  measurement: correct_predictions / total_predictions * 100
  prometheus_metric: predictive_accuracy
- name: processing_time
  description: Time to generate prediction
  type: histogram
  target: < 2s
  measurement: Time in seconds
  prometheus_metric: predictive_processing_time_seconds
- name: model_confidence
  description: Average confidence score of predictions
  type: gauge
  target: '> 0.8'
  measurement: avg(confidence_scores)
  prometheus_metric: predictive_confidence
- name: forecast_accuracy
  description: Accuracy of timeline forecasts
  type: gauge
  target: '> 80%'
  measurement: accurate_forecasts / total_forecasts * 100
  prometheus_metric: predictive_forecast_accuracy
monitoring:
  prometheus_enabled: true
  grafana_dashboard: dashboards/predictive.json
  alert_rules: alerts/predictive.yaml
targets:
  daily: Track daily metrics
  weekly: Review weekly trends
  monthly: Monthly performance review
