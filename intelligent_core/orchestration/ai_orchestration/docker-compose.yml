version: '3.8'

services:
  orchestrator:
    build: .
    container_name: bcm_orchestrator
    ports:
      - "8000:8000"
    environment:
      # Redis
      - REDIS_URL=redis://redis:6379

      # PostgreSQL
      - POSTGRES_URL=postgresql://bcm_user:bcm_password@postgres:5432/bcm_platform

      # EventBus
      - EVENTBUS_URL=http://eventbus:8001

      # AI Services
      - AI_ORCHESTRATOR_URL=http://ai_orchestrator:8000

      # Odoo
      - ODOO_URL=http://odoo:8069

      # Anthropic (optional)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}

      # Supabase (optional)
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_KEY=${SUPABASE_KEY:-}

      # GitHub
      - GITHUB_REPO=SEH-foundation/ISO-22301

      # Logging
      - LOG_LEVEL=INFO

    volumes:
      # Mount Docker socket for container management
      - /var/run/docker.sock:/var/run/docker.sock:ro

      # Mount code for development (comment out for production)
      - .:/app

    depends_on:
      - redis
      - postgres

    networks:
      - bcm_network

    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: bcm_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bcm_network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: bcm_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=bcm_user
      - POSTGRES_PASSWORD=bcm_password
      - POSTGRES_DB=bcm_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bcm_network
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:

networks:
  bcm_network:
    driver: bridge