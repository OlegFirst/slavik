global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Coordination Center metrics
  - job_name: 'coordination-center'
    static_configs:
      - targets: ['host.docker.internal:8004']
        labels:
          service: 'coordination-center'
          environment: 'development'

  # PLATFORM Gateway (if needed)
  - job_name: 'platform-gateway'
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels:
          service: 'platform-gateway'
          environment: 'development'

  # Intelligence Gateway
  - job_name: 'intelligence-gateway'
    static_configs:
      - targets: ['host.docker.internal:8035']
        labels:
          service: 'intelligence-gateway'
          environment: 'development'

  # Digital Twin
  - job_name: 'digital-twin'
    static_configs:
      - targets: ['host.docker.internal:8030']
        labels:
          service: 'digital-twin'
          environment: 'development'

  # Simulation
  - job_name: 'simulation'
    static_configs:
      - targets: ['host.docker.internal:8031']
        labels:
          service: 'simulation'
          environment: 'development'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
