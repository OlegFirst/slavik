scenario:
  # ========== METADATA ==========
  meta:
    id: "security-subsystem-test"
    version: "1.0.0"
    level: 2  # Subsystem level
    type: "security"
    pillar: "security"
    domain: "security_integration"

    created_at: "2025-10-12T10:00:00Z"
    updated_at: "2025-10-12T10:00:00Z"
    created_by: "security-team"

  # ========== OWNERSHIP ==========
  ownership:
    subsystem: "security"
    modules:
      - "auth-service"
      - "vault"
      - "secrets-manager"
      - "audit-service"
    team: "security-team"

  # ========== DESCRIPTION ==========
  description:
    title: "Security Subsystem Integration Test"
    summary: "Verify security subsystem: authentication, secrets management, and audit logging"
    business_value: "Ensure security controls are properly integrated and functional"

  # ========== BEHAVIOR (Gherkin) ==========
  behavior:
    feature: "Security Subsystem Integration"

    scenario: "End-to-end security flow"

    given:
      - "Auth Service is running"
      - "Vault is running"
      - "Secrets Manager is running"
      - "Audit Service is running"

    when:
      - "User authenticates with Auth Service"
      - "User retrieves secret from Vault"
      - "Secrets Manager validates access"
      - "Audit Service logs all operations"

    then:
      - "Authentication succeeds with valid token"
      - "Secret is retrieved successfully"
      - "Access is properly authorized"
      - "All operations are audited"
      - "Security subsystem status is healthy"

  # ========== EXECUTION ==========
  execution:
    timeout: 90
    retry_policy:
      max_retries: 2
      backoff: linear

    steps:
      - id: "check_auth_service"
        action: "http.get"
        params:
          url: "http://auth-service:8010/health"
        expect:
          status: 200
          response.status: "healthy"
        on_failure: "abort"

      - id: "check_vault"
        action: "http.get"
        params:
          url: "http://vault:8200/v1/sys/health"
        expect:
          status: 200
        on_failure: "abort"

      - id: "check_audit_service"
        action: "http.get"
        params:
          url: "http://audit-service:8012/health"
        expect:
          status: 200
          response.status: "healthy"
        on_failure: "abort"

      - id: "authenticate_user"
        action: "http.post"
        params:
          url: "http://auth-service:8010/api/v1/auth/login"
          body:
            username: "{{test_user}}"
            password: "{{test_password}}"
        expect:
          status: 200
          response.token: "{{exists}}"

      - id: "store_secret_in_vault"
        action: "http.post"
        params:
          url: "http://vault:8200/v1/secret/data/test-secret"
          headers:
            Authorization: "Bearer {{steps.authenticate_user.result.token}}"
          body:
            data:
              api_key: "test-value-12345"
        expect:
          status: 200

      - id: "retrieve_secret_from_vault"
        action: "http.get"
        params:
          url: "http://vault:8200/v1/secret/data/test-secret"
          headers:
            Authorization: "Bearer {{steps.authenticate_user.result.token}}"
        expect:
          status: 200
          response.data.data.api_key: "test-value-12345"

      - id: "verify_audit_logs"
        action: "http.get"
        params:
          url: "http://audit-service:8012/api/v1/logs"
          query:
            actor_id: "{{test_user}}"
            event_type: "vault.secret.stored"
        expect:
          status: 200
          response.logs_count: ">0"

      - id: "test_unauthorized_access"
        action: "http.get"
        params:
          url: "http://vault:8200/v1/secret/data/test-secret"
          headers:
            Authorization: "Bearer invalid-token"
        expect:
          status: 401

      - id: "verify_failed_access_audited"
        action: "http.get"
        params:
          url: "http://audit-service:8012/api/v1/logs"
          query:
            event_type: "vault.access.denied"
        expect:
          status: 200
          response.logs_count: ">0"

      - id: "cleanup_test_secret"
        action: "http.delete"
        params:
          url: "http://vault:8200/v1/secret/metadata/test-secret"
          headers:
            Authorization: "Bearer {{steps.authenticate_user.result.token}}"
        expect:
          status: 204

  # ========== INTEGRATION ==========
  integration:
    calls:
      - scenario_id: "vault-store-secret-encrypted"
        level: 1
        when: "security_test"

      - scenario_id: "audit-service-create-audit-log"
        level: 1
        when: "security_test"

    events:
      emits:
        - event_type: "security.subsystem.tested"
          aggregate: "SecuritySubsystem"
          aggregate_id: "security-subsystem"
          payload:
            subsystem: "security"
            tests_passed: true
            components_tested:
              - "auth-service"
              - "vault"
              - "audit-service"

  # ========== SECURITY ==========
  security:
    authentication_required: true
    authorization_required: true
    audit_all_operations: true
    secrets_encrypted_at_rest: true
    token_expiry_minutes: 60

  # ========== COMPLIANCE ==========
  compliance:
    iso_22301:
      clauses:
        - id: "7.5.3"
          name: "Control of documented information"
          requirement: "Protect sensitive information"

    security_controls:
      - control_id: "AC-1"
        name: "Access Control Policy"
        implemented: true

      - control_id: "AU-1"
        name: "Audit and Accountability Policy"
        implemented: true

      - control_id: "IA-1"
        name: "Identification and Authentication Policy"
        implemented: true

  # ========== OBSERVABILITY ==========
  observability:
    metrics:
      - name: "security_subsystem_test_duration_seconds"
        type: "histogram"

      - name: "security_auth_success_rate"
        type: "gauge"

      - name: "security_unauthorized_access_attempts_total"
        type: "counter"

    logs:
      level: "INFO"
      include:
        - "subsystem"
        - "test_result"
        - "components_tested"

  # ========== SLA ==========
  sla:
    target_availability: 0.9999  # 99.99% (security critical)
    max_authentication_time_ms: 200
    audit_log_retention_years: 7

  # ========== CHANGELOG ==========
  changelog:
    - version: "1.0.0"
      date: "2025-10-12"
      author: "security-team"
      changes:
        - "Initial version"
        - "Security subsystem integration test with auth flow"
