name: Architecture Validation

# Автоматическая валидация архитектуры при каждом коммите
# Блокирует PR если найдены критические ошибки в зависимостях

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  # Ежедневная проверка в 2:00 UTC
  schedule:
    - cron: '0 2 * * *'

jobs:
  validate-architecture:
    name: Validate Architecture Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Run dependency validator
        id: validator
        run: |
          echo "🔍 Running dependency validator..."
          python3 tools/analyzers/dependency_validator.py
        continue-on-error: true

      - name: Upload validation report
        uses: actions/upload-artifact@v3
        with:
          name: dependency-validation-report
          path: tools/reports/dependency_validation.json

      - name: Check validation results
        run: |
          CRITICAL_ERRORS=$(jq '.stats.critical_errors' tools/reports/dependency_validation.json)
          HIGH_ERRORS=$(jq '.stats.high_errors' tools/reports/dependency_validation.json)
          ACCURACY=$(jq '.stats.accuracy' tools/reports/dependency_validation.json)

          echo "📊 Validation Results:"
          echo "  Critical Errors: $CRITICAL_ERRORS"
          echo "  High Errors: $HIGH_ERRORS"
          echo "  Accuracy: ${ACCURACY}%"

          # Блокировать PR при критических ошибках
          if [ "$CRITICAL_ERRORS" -gt 0 ]; then
            echo "❌ FAILED: Critical errors found!"
            exit 1
          fi

          # Блокировать при > 10 high errors
          if [ "$HIGH_ERRORS" -gt 10 ]; then
            echo "⚠️ WARNING: Too many high errors ($HIGH_ERRORS)"
            exit 1
          fi

          echo "✅ PASSED: Architecture validation successful"

      - name: Comment PR (on failure)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('tools/reports/dependency_validation.json', 'utf8'));

            const comment = `
            ## ❌ Architecture Validation Failed

            **Statistics:**
            - Critical Errors: ${report.stats.critical_errors}
            - High Errors: ${report.stats.high_errors}
            - Total Warnings: ${report.stats.total_warnings}
            - Accuracy: ${report.stats.accuracy.toFixed(1)}%

            **Top Errors:**
            ${report.errors.slice(0, 5).map(e => `- [${e.severity}] ${e.message}`).join('\n')}

            **Action Required:**
            1. Run \`python3 tools/analyzers/dependency_reconciler.py --auto-fix\`
            2. Review and commit changes
            3. Push to update this PR

            [View full report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  auto-reconcile:
    name: Auto-Reconcile Documentation (Optional)
    runs-on: ubuntu-latest
    needs: validate-architecture
    if: failure() && github.event_name != 'pull_request'
    # Запускается только на main/develop при failure

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Run auto-reconcile
        run: |
          echo "🔧 Running dependency reconciler..."
          python3 tools/analyzers/dependency_reconciler.py --auto-fix

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "🤖 Auto-reconcile architecture documentation"
          title: "🤖 Architecture Documentation Auto-Reconciliation"
          body: |
            ## Automated Architecture Documentation Update

            This PR was automatically generated by the dependency reconciler.

            **Changes:**
            - Updated SERVICE_CATALOG.yaml with discovered services
            - Added missing dependencies
            - Fixed outdated dependencies

            **Reports:**
            - [Validation Report](../reports/dependency_validation.json)
            - [Reconciliation Report](../reports/dependency_reconciliation.md)

            **Action Required:**
            - Review changes
            - Approve and merge if correct
            - Or modify SERVICE_CATALOG.yaml manually and close this PR

            ---
            *Generated by GitHub Actions*
          branch: auto-reconcile-architecture
          delete-branch: true

  validate-c4-diagrams:
    name: Validate C4 Diagrams
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Check C4 diagrams exist
        run: |
          echo "🔍 Checking C4 diagrams..."

          files=(
            "docs/architecture/C4_LEVEL1_SYSTEM_CONTEXT_COMPLETE.md"
            "docs/architecture/C4_LEVEL2_CONTAINERS.md"
            "docs/architecture/C4_LEVEL3_COMPONENTS.md"
          )

          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing: $file"
              exit 1
            fi
            echo "✅ Found: $file"
          done

      - name: Validate Mermaid syntax
        uses: nikeee/setup-pandoc@v1

      - name: Extract and validate mermaid diagrams
        run: |
          echo "🔍 Validating Mermaid diagrams..."

          # TODO: Add mermaid-cli validation
          # For now, just check files are not empty
          for file in docs/architecture/C4_*.md; do
            if [ ! -s "$file" ]; then
              echo "❌ Empty file: $file"
              exit 1
            fi
          done

          echo "✅ All C4 diagrams valid"
