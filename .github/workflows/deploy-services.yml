name: Deploy BCM Services

on:
  push:
    branches:
      - main
      - production
    paths:
      - 'platform-services/**'
      - 'intelligent-core/workflow-intelligence/**'
      - 'docker-compose.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - development
          - staging
          - production

jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - planning_service
          - plans_service
          - bia-service
          - compliance-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/bcm-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: platform-services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/bcm-${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/bcm-${{ matrix.service }}:buildcache,mode=max

  deploy:
    name: Deploy to Environment
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ github.event.inputs.environment || 'development' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install deployment tools
        run: |
          pip install ansible docker-compose

      - name: Deploy with docker-compose
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          # Pull latest images
          docker-compose pull

          # Run database migrations
          docker-compose run --rm planning_service alembic upgrade head || true
          docker-compose run --rm plans_service alembic upgrade head || true
          docker-compose run --rm bia-service alembic upgrade head || true
          docker-compose run --rm compliance-service alembic upgrade head || true

          # Deploy services with zero-downtime
          docker-compose up -d --remove-orphans

          # Wait for health checks
          sleep 30

      - name: Health check - Planning Service
        run: |
          curl -f http://localhost:8011/health || exit 1

      - name: Health check - Plans Service
        run: |
          curl -f http://localhost:8023/health || exit 1

      - name: Health check - BIA Service
        run: |
          curl -f http://localhost:8012/health || exit 1

      - name: Health check - Compliance Service
        run: |
          curl -f http://localhost:8014/health || exit 1

      - name: Verify Workflow Intelligence
        run: |
          # Check that workflow intelligence schema exists
          docker-compose exec -T postgres psql -U postgres -d bcm_platform -c "\dn workflow_intelligence" || exit 1

          echo "✅ Workflow Intelligence schema verified"

      - name: Smoke tests
        run: |
          # Test workflow intelligence endpoints
          curl -f http://localhost:8011/api/v1/planning/benchmarks || echo "Auth required"
          curl -f http://localhost:8023/api/v1/plans/benchmarks || echo "Auth required"
          curl -f http://localhost:8012/api/v1/bia/benchmarks || echo "Auth required"
          curl -f http://localhost:8014/api/v1/compliance/benchmarks || echo "Auth required"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed, rolling back..."
          docker-compose down
          # Restore previous version
          git checkout HEAD~1
          docker-compose up -d

  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
      - name: Send notification
        run: |
          STATUS="${{ needs.deploy.result }}"
          ENV="${{ github.event.inputs.environment || 'development' }}"

          if [ "$STATUS" = "success" ]; then
            echo "✅ Deployment to $ENV succeeded"
          else
            echo "❌ Deployment to $ENV failed"
          fi

          # Add Slack/Discord/Email notification here if needed
