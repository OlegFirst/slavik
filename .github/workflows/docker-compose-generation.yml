name: Docker Compose - Auto Generation

on:
  push:
    branches: [main, develop]
    paths:
      - 'infrastructure/**/*.py'
      - 'infrastructure/**/Dockerfile'
      - 'intelligent-core/**/Dockerfile'
      - 'platform-services/**/Dockerfile'
  pull_request:
    branches: [main, develop]
    paths:
      - 'infrastructure/**/Dockerfile'
  schedule:
    # Weekly regeneration on Wednesdays at 4 AM UTC
    - cron: '0 4 * * 3'
  workflow_dispatch:
    inputs:
      layer:
        description: 'Layer to generate (gateway/runtime/observability/integration/all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - gateway
          - runtime
          - observability
          - integration

env:
  PYTHON_VERSION: '3.11'
  GENERATOR_PATH: infrastructure/AI-office-infrastructure/orchestrator

jobs:
  generate-docker-compose:
    name: Generate Docker Compose Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Run Docker Compose Generator
        run: |
          echo "🏗️ Generating Docker Compose configurations..."

          cd ${{ env.GENERATOR_PATH }}

          # Run generator
          python3 docker_compose_generator.py \
            --output ../../deployment/generated \
            --layer ${{ github.event.inputs.layer || 'all' }}

      - name: Validate generated files
        run: |
          echo "✅ Validating generated docker-compose files..."

          # Check if files were generated
          if [ ! -d "infrastructure/deployment/generated" ]; then
            echo "❌ No files generated!"
            exit 1
          fi

          # Validate YAML syntax
          for file in infrastructure/deployment/generated/docker-compose*.yml; do
            if [ -f "$file" ]; then
              echo "Validating: $file"
              python3 -c "import yaml; yaml.safe_load(open('$file'))" || exit 1
              echo "  ✅ Valid YAML"
            fi
          done

      - name: Generate summary
        if: always()
        run: |
          echo "## 🐳 Docker Compose Generation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -d "infrastructure/deployment/generated" ]; then
            echo "### Generated Files:" >> $GITHUB_STEP_SUMMARY

            for file in infrastructure/deployment/generated/docker-compose*.yml; do
              if [ -f "$file" ]; then
                filename=$(basename "$file")
                services=$(grep -c "container_name:" "$file" || echo "0")
                echo "- **$filename**: $services services" >> $GITHUB_STEP_SUMMARY
              fi
            done

            # Count total services
            total_services=$(grep -h "container_name:" infrastructure/deployment/generated/docker-compose*.yml 2>/dev/null | wc -l || echo "0")
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Total services configured:** $total_services" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **No files generated**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload generated files
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: docker-compose-configs
          path: infrastructure/deployment/generated/
          retention-days: 90

      - name: Commit generated files
        if: github.event_name != 'pull_request'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add infrastructure/deployment/generated/

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🐳 Auto-generated Docker Compose configurations

            Generated by: ${{ github.workflow }}
            Trigger: ${{ github.event_name }}
            Layer: ${{ github.event.inputs.layer || 'all' }}
            Commit: ${{ github.sha }}"

            git push
          fi

  test-docker-compose:
    name: Test Docker Compose Configuration
    runs-on: ubuntu-latest
    needs: generate-docker-compose

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download generated files
        uses: actions/download-artifact@v3
        with:
          name: docker-compose-configs
          path: infrastructure/deployment/generated/

      - name: Test docker-compose syntax
        run: |
          echo "🧪 Testing docker-compose configurations..."

          for file in infrastructure/deployment/generated/docker-compose*.yml; do
            if [ -f "$file" ]; then
              echo "Testing: $file"
              docker-compose -f "$file" config > /dev/null || exit 1
              echo "  ✅ Valid docker-compose config"
            fi
          done

      - name: Check for port conflicts
        run: |
          echo "🔍 Checking for port conflicts..."

          # Extract all ports
          all_ports=$(grep -h "ports:" -A 1 infrastructure/deployment/generated/docker-compose*.yml | grep -o "[0-9]\+:[0-9]\+" | cut -d: -f1 | sort)

          # Check for duplicates
          duplicates=$(echo "$all_ports" | uniq -d)

          if [ -n "$duplicates" ]; then
            echo "⚠️ Port conflicts detected:"
            echo "$duplicates"
            echo "::warning::Port conflicts found in generated docker-compose files"
          else
            echo "✅ No port conflicts"
          fi

      - name: Generate test summary
        if: always()
        run: |
          echo "## 🧪 Docker Compose Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Count files tested
          files_tested=$(find infrastructure/deployment/generated -name "docker-compose*.yml" | wc -l)
          echo "- **Files tested:** $files_tested" >> $GITHUB_STEP_SUMMARY

          # Check for issues
          if [ -z "$duplicates" ]; then
            echo "- **Port conflicts:** None ✅" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Port conflicts:** Found ⚠️" >> $GITHUB_STEP_SUMMARY
          fi

          echo "- **Syntax validation:** ✅ Passed" >> $GITHUB_STEP_SUMMARY
