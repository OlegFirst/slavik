name: AI Agent Router CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'infrastructure/AI-office-infrastructure/agent-router/**'
      - '.github/workflows/agent-router-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infrastructure/AI-office-infrastructure/agent-router/**'

env:
  PYTHON_VERSION: '3.11'
  AGENT_ROUTER_PATH: 'infrastructure/AI-office-infrastructure/agent-router'

jobs:
  # ============================================================================
  # Lint & Format Check
  # ============================================================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy

      - name: Run flake8
        run: |
          cd ${{ env.AGENT_ROUTER_PATH }}
          flake8 *.py --max-line-length=120 --exclude=venv,__pycache__

      - name: Check code formatting (black)
        run: |
          cd ${{ env.AGENT_ROUTER_PATH }}
          black --check *.py

      - name: Check import sorting (isort)
        run: |
          cd ${{ env.AGENT_ROUTER_PATH }}
          isort --check-only *.py

  # ============================================================================
  # Unit Tests
  # ============================================================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd ${{ env.AGENT_ROUTER_PATH }}
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run tests
        env:
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd ${{ env.AGENT_ROUTER_PATH }}
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ${{ env.AGENT_ROUTER_PATH }}/coverage.xml
          flags: agent-router
          name: agent-router-coverage

  # ============================================================================
  # Integration Tests
  # ============================================================================
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd ${{ env.AGENT_ROUTER_PATH }}
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run integration tests
        env:
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd ${{ env.AGENT_ROUTER_PATH }}
          pytest tests/integration/ -v --tb=short

  # ============================================================================
  # Security Scan
  # ============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install safety bandit

      - name: Run safety check
        run: |
          cd ${{ env.AGENT_ROUTER_PATH }}
          safety check --file requirements.txt || true

      - name: Run bandit security scan
        run: |
          cd ${{ env.AGENT_ROUTER_PATH }}
          bandit -r *.py -f json -o bandit-report.json || true

      - name: Upload security reports
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: ${{ env.AGENT_ROUTER_PATH }}/bandit-report.json

  # ============================================================================
  # Build Docker Image
  # ============================================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, integration-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build metrics server image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.AGENT_ROUTER_PATH }}
          file: ${{ env.AGENT_ROUTER_PATH }}/Dockerfile.metrics
          push: false
          tags: ai-agent-router-metrics:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run --rm -d --name test-router \
            -p 9090:9090 \
            ai-agent-router-metrics:${{ github.sha }}
          sleep 5
          curl -f http://localhost:9090/health || exit 1
          docker stop test-router

  # ============================================================================
  # Deploy to Development
  # ============================================================================
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to dev environment
        run: |
          echo "Deploying to development..."
          # Add your deployment logic here
          # Example: kubectl apply -f k8s/dev/

  # ============================================================================
  # Deploy to Production
  # ============================================================================
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.AGENT_ROUTER_PATH }}
          file: ${{ env.AGENT_ROUTER_PATH }}/Dockerfile.metrics
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/ai-agent-router:latest
            ${{ secrets.REGISTRY_URL }}/ai-agent-router:${{ github.sha }}

      - name: Deploy to production
        run: |
          echo "Deploying to production..."
          # Add your deployment logic here
          # Example: kubectl set image deployment/agent-router ...

  # ============================================================================
  # Notify on Failure
  # ============================================================================
  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [lint, test, integration-test, security, build]
    if: failure()

    steps:
      - name: Send notification
        run: |
          echo "CI/CD pipeline failed!"
          # Add notification logic (Slack, email, etc.)
