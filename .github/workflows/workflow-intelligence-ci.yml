name: Workflow Intelligence CI

on:
  push:
    paths:
      - 'intelligent-core/workflow-intelligence/**'
      - '.github/workflows/workflow-intelligence-ci.yml'
  pull_request:
    paths:
      - 'intelligent-core/workflow-intelligence/**'

jobs:
  test:
    name: Test Workflow Intelligence Library
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: test_bcm
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd intelligent-core/workflow-intelligence
          pip install -e ".[dev]"
          pip install pytest pytest-asyncio pytest-cov

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_bcm
        run: |
          cd intelligent-core/workflow-intelligence
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./intelligent-core/workflow-intelligence/coverage.xml
          flags: workflow-intelligence
          name: workflow-intelligence-coverage

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: |
          pip install ruff black isort mypy

      - name: Run ruff
        run: |
          cd intelligent-core/workflow-intelligence
          ruff check .

      - name: Check formatting with black
        run: |
          cd intelligent-core/workflow-intelligence
          black --check .

      - name: Check import sorting
        run: |
          cd intelligent-core/workflow-intelligence
          isort --check-only .

      - name: Type checking with mypy
        run: |
          cd intelligent-core/workflow-intelligence
          mypy . --ignore-missing-imports || true

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          pip install build twine

      - name: Build package
        run: |
          cd intelligent-core/workflow-intelligence
          python -m build

      - name: Check package
        run: |
          cd intelligent-core/workflow-intelligence
          twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: workflow-intelligence-package
          path: intelligent-core/workflow-intelligence/dist/
