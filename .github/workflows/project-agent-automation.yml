name: Project Agent - Automated Testing & Analysis

on:
  push:
    branches: [main, develop]
    paths:
      - 'intelligent-core/**/*.py'
      - 'platform-services/**/*.py'
      - 'infrastructure/**/*.py'

  pull_request:
    branches: [main, develop]
    paths:
      - 'intelligent-core/**/*.py'
      - 'platform-services/**/*.py'
      - 'infrastructure/**/*.py'

  schedule:
    # Daily comprehensive scan at midnight UTC
    - cron: '0 0 * * *'
    # Weekly deep analysis every Sunday at 2 AM UTC
    - cron: '0 2 * * 0'

  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Type of scan to perform'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - tests-only
          - security-only
          - quality-only
          - architecture-only

env:
  PYTHON_VERSION: '3.11'
  PROJECT_AGENT_PATH: infrastructure/AI-office-infrastructure/project-agent

jobs:
  detect-changes:
    name: Detect Code Changes
    runs-on: ubuntu-latest
    outputs:
      changed_files: ${{ steps.changed-files.outputs.all_changed_files }}
      has_changes: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed Python files
        id: changed-files
        uses: tj-actions/changed-files@v40
        with:
          files: |
            intelligent-core/**/*.py
            platform-services/**/*.py
            infrastructure/**/*.py
          files_ignore: |
            **/__pycache__/**
            **/tests/**
            **/*.pyc

  auto-test-generation:
    name: Auto Generate Tests for New Code
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install project-agent
        run: |
          cd ${{ env.PROJECT_AGENT_PATH }}
          pip install -e .
          pip install -r requirements.txt

      - name: Generate tests for changed files
        if: github.event_name != 'schedule'
        run: |
          echo "🧪 Generating tests for changed files..."
          for file in ${{ needs.detect-changes.outputs.changed_files }}; do
            if [[ -f "$file" ]]; then
              echo "Generating tests for: $file"
              python -m agent.test_generator --file "$file" --output tests/generated/ || true
            fi
          done

      - name: Generate tests for all code (scheduled)
        if: github.event_name == 'schedule'
        run: |
          echo "🧪 Running comprehensive test generation..."
          python -m agent.test_generator --scan-all --output tests/generated/

      - name: Commit generated tests
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add tests/generated/
          if git diff --staged --quiet; then
            echo "No new tests generated"
          else
            git commit -m "🤖 Auto-generated tests by Project Agent

            Generated by: ${{ github.workflow }}
            Trigger: ${{ github.event_name }}
            Commit: ${{ github.sha }}"
            git push
          fi

  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install project-agent
        run: |
          cd ${{ env.PROJECT_AGENT_PATH }}
          pip install -e .
          pip install -r requirements.txt

      - name: Run security scan
        run: |
          echo "🔒 Running security analysis..."
          python -m agent.security --report security-report.json

      - name: Upload security report
        uses: actions/upload-artifact@v3
        with:
          name: security-report
          path: security-report.json
          retention-days: 30

      - name: Check for critical vulnerabilities
        run: |
          if python -c "import json; report=json.load(open('security-report.json')); exit(1 if any(v['severity']=='critical' for v in report.get('vulnerabilities', [])) else 0)"; then
            echo "✅ No critical vulnerabilities found"
          else
            echo "❌ Critical vulnerabilities detected!"
            exit 1
          fi

  quality-analysis:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install project-agent
        run: |
          cd ${{ env.PROJECT_AGENT_PATH }}
          pip install -e .
          pip install -r requirements.txt

      - name: Run quality analysis
        run: |
          echo "📊 Running quality analysis..."
          python -m agent.quality --report quality-report.json

      - name: Upload quality report
        uses: actions/upload-artifact@v3
        with:
          name: quality-report
          path: quality-report.json
          retention-days: 30

      - name: Check quality gates
        run: |
          python << 'EOF'
          import json

          with open('quality-report.json') as f:
              report = json.load(f)

          metrics = report.get('metrics', {})

          # Quality gates
          min_maintainability = 7.0
          max_complexity = 15
          min_coverage = 70

          failed = []

          if metrics.get('maintainability_index', 10) < min_maintainability:
              failed.append(f"Maintainability index too low: {metrics.get('maintainability_index')}")

          if metrics.get('avg_complexity', 0) > max_complexity:
              failed.append(f"Average complexity too high: {metrics.get('avg_complexity')}")

          if metrics.get('coverage', 100) < min_coverage:
              failed.append(f"Coverage too low: {metrics.get('coverage')}%")

          if failed:
              print("❌ Quality gates failed:")
              for issue in failed:
                  print(f"  - {issue}")
              exit(1)
          else:
              print("✅ All quality gates passed")
          EOF

  architecture-validation:
    name: Architecture Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[arch]')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install project-agent
        run: |
          cd ${{ env.PROJECT_AGENT_PATH }}
          pip install -e .
          pip install -r requirements.txt

      - name: Run architecture analysis
        run: |
          echo "🏗️ Running architecture validation..."
          python -m agent.architecture --report architecture-report.json

      - name: Upload architecture report
        uses: actions/upload-artifact@v3
        with:
          name: architecture-report
          path: architecture-report.json
          retention-days: 30

      - name: Check architecture compliance
        run: |
          python << 'EOF'
          import json

          with open('architecture-report.json') as f:
              report = json.load(f)

          violations = report.get('violations', [])
          warnings = report.get('warnings', [])

          if violations:
              print("❌ Architecture violations detected:")
              for v in violations:
                  print(f"  - {v}")
              exit(1)
          elif warnings:
              print("⚠️  Architecture warnings:")
              for w in warnings:
                  print(f"  - {w}")
              print("✅ No critical violations")
          else:
              print("✅ Architecture is compliant")
          EOF

  test-coverage:
    name: Test Coverage Analysis
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install project-agent
        run: |
          cd ${{ env.PROJECT_AGENT_PATH }}
          pip install -e .
          pip install -r requirements.txt

      - name: Run coverage analysis
        run: |
          echo "📈 Analyzing test coverage..."
          python -m agent.testing --coverage --report coverage-report.json

      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage-report.json
          retention-days: 30

      - name: Generate coverage badge
        run: |
          python << 'EOF'
          import json

          with open('coverage-report.json') as f:
              report = json.load(f)

          coverage = report.get('total_coverage', 0)
          color = 'green' if coverage >= 80 else 'yellow' if coverage >= 60 else 'red'

          badge = f"![Coverage](https://img.shields.io/badge/coverage-{coverage}%25-{color})"
          print(f"Coverage badge: {badge}")
          EOF

  comprehensive-report:
    name: Generate Comprehensive Report
    runs-on: ubuntu-latest
    needs: [auto-test-generation, security-scan, quality-analysis, test-coverage]
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all reports
        uses: actions/download-artifact@v3
        with:
          path: reports/

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Generate comprehensive report
        run: |
          python << 'EOF'
          import json
          from pathlib import Path
          from datetime import datetime

          reports_dir = Path('reports')

          # Collect all reports
          security = {}
          quality = {}
          coverage = {}

          if (reports_dir / 'security-report' / 'security-report.json').exists():
              with open(reports_dir / 'security-report' / 'security-report.json') as f:
                  security = json.load(f)

          if (reports_dir / 'quality-report' / 'quality-report.json').exists():
              with open(reports_dir / 'quality-report' / 'quality-report.json') as f:
                  quality = json.load(f)

          if (reports_dir / 'coverage-report' / 'coverage-report.json').exists():
              with open(reports_dir / 'coverage-report' / 'coverage-report.json') as f:
                  coverage = json.load(f)

          # Generate markdown report
          report = f"""# Project Agent - Comprehensive Analysis Report

          **Generated:** {datetime.utcnow().isoformat()}
          **Workflow:** {github.workflow}
          **Trigger:** {github.event_name}

          ## 🔒 Security Analysis

          - **Vulnerabilities Found:** {len(security.get('vulnerabilities', []))}
          - **Critical:** {sum(1 for v in security.get('vulnerabilities', []) if v.get('severity') == 'critical')}
          - **High:** {sum(1 for v in security.get('vulnerabilities', []) if v.get('severity') == 'high')}
          - **Medium:** {sum(1 for v in security.get('vulnerabilities', []) if v.get('severity') == 'medium')}

          ## 📊 Quality Metrics

          - **Maintainability Index:** {quality.get('metrics', {}).get('maintainability_index', 'N/A')}
          - **Average Complexity:** {quality.get('metrics', {}).get('avg_complexity', 'N/A')}
          - **Code Smells:** {quality.get('metrics', {}).get('code_smells', 'N/A')}

          ## 📈 Test Coverage

          - **Total Coverage:** {coverage.get('total_coverage', 'N/A')}%
          - **Lines Covered:** {coverage.get('lines_covered', 'N/A')}
          - **Lines Total:** {coverage.get('lines_total', 'N/A')}
          - **Branches Covered:** {coverage.get('branches_covered', 'N/A')}%

          ## 🎯 Recommendations

          {chr(10).join(f"- {r}" for r in quality.get('recommendations', []))}
          """

          with open('COMPREHENSIVE_REPORT.md', 'w') as f:
              f.write(report)

          print("✅ Comprehensive report generated")
          EOF

      - name: Upload comprehensive report
        uses: actions/upload-artifact@v3
        with:
          name: comprehensive-report
          path: COMPREHENSIVE_REPORT.md
          retention-days: 90

      - name: Post summary to PR (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('COMPREHENSIVE_REPORT.md', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [security-scan, quality-analysis, architecture-validation, test-coverage]
    if: failure()
    steps:
      - name: Send notification
        run: |
          echo "❌ Project Agent automation workflow failed!"
          echo "Workflow: ${{ github.workflow }}"
          echo "Trigger: ${{ github.event_name }}"
          echo "Commit: ${{ github.sha }}"
          # TODO: Add Slack/Discord/Email notification integration
