version: '3.8'

services:
  # ============================================
  # INFRASTRUCTURE
  # ============================================

  postgres:
    image: postgres:15-alpine
    container_name: bcm-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bcm_platform}
      POSTGRES_USER: ${POSTGRES_USER:-bcm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bcm"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bcm-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ============================================
  # INTELLIGENT CORE
  # ============================================

  intelligent-core:
    build:
      context: ./intelligent-core
      dockerfile: Dockerfile
    container_name: bcm-intelligent-core
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bcm}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-bcm_platform}
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "9000:9000"
    volumes:
      - ./intelligent-core:/app
    restart: unless-stopped

  # ============================================
  # EXECUTION ENGINE
  # ============================================

  execution-engine:
    build:
      context: ./execution-engine
      dockerfile: Dockerfile
    container_name: bcm-execution-engine
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bcm}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-bcm_platform}
      REDIS_URL: redis://redis:6379
      INTELLIGENT_CORE_URL: http://intelligent-core:9000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      intelligent-core:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./execution-engine:/app
    restart: unless-stopped

  # ============================================
  # PLATFORM SERVICES
  # ============================================

  auth-service:
    build:
      context: ./platform-services/auth-service
      dockerfile: Dockerfile
    container_name: bcm-auth-service
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bcm}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-bcm_platform}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8001"
    restart: unless-stopped

  notification-service:
    build:
      context: ./platform-services/notification-service
      dockerfile: Dockerfile
    container_name: bcm-notification-service
    environment:
      REDIS_URL: redis://redis:6379
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      FROM_EMAIL: ${FROM_EMAIL:-noreply@bcm-platform.com}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8002:8002"
    restart: unless-stopped

  # ============================================
  # HUMAN INTERFACE
  # ============================================

  api-gateway:
    build:
      context: ./human-interface/api-gateway
      dockerfile: Dockerfile
    container_name: bcm-api-gateway
    environment:
      EXECUTION_ENGINE_URL: http://execution-engine:8000
      INTELLIGENT_CORE_URL: http://intelligent-core:9000
      AUTH_SERVICE_URL: http://auth-service:8001
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key}
    depends_on:
      - execution-engine
      - intelligent-core
      - auth-service
    ports:
      - "3001:3001"
    restart: unless-stopped

  web-app:
    build:
      context: ./human-interface/web-app
      dockerfile: Dockerfile
      target: development
    container_name: bcm-web-app
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: ws://localhost:3001
    depends_on:
      - api-gateway
    ports:
      - "3000:3000"
    volumes:
      - ./human-interface/web-app:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped

  # ============================================
  # OBSERVABILITY (Optional - comment out if not needed)
  # ============================================

  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: bcm-prometheus
  #   volumes:
  #     - ./infrastructure/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
  #     - prometheus_data:/prometheus
  #   ports:
  #     - "9090:9090"
  #   restart: unless-stopped

  # grafana:
  #   image: grafana/grafana:latest
  #   container_name: bcm-grafana
  #   environment:
  #     GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
  #   volumes:
  #     - ./infrastructure/observability/grafana/dashboards:/etc/grafana/provisioning/dashboards
  #     - grafana_data:/var/lib/grafana
  #   ports:
  #     - "3002:3000"
  #   depends_on:
  #     - prometheus
  #   restart: unless-stopped

volumes:
  postgres_data:
  # prometheus_data:
  # grafana_data:

networks:
  default:
    name: bcm-network
