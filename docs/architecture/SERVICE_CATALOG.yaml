version: '2.0'
maintainer: AI-Platform-ISO Team
ai_foundation:
  workflow_intelligence:
    type: core-brain
    location: intelligent-core/workflow_intelligence
    port: 8001
    technology:
    - Temporal Cloud
    - Python 3.11
    - FastAPI
    - PostgreSQL
    - Qdrant
    dependencies:
      infrastructure:
      - database/postgresql
      - runtime/eventbus
      external:
      - temporal-cloud
      internal:
      - shared/database
      - ai_foundation/workflow_engine
      - ai_foundation/workflow_intelligence
    provides:
    - workflow.orchestration
    - workflow.ai_recommendations
    - workflow.case_library
    - workflow.temporal_workflows
    endpoints:
    - POST /api/v1/workflows/create
    - GET /api/v1/workflows/{workflow_id}
    - POST /api/v1/ai/recommend
    metrics:
      loc: 1360
      files: 37
      complexity: high
    status: production
  ai_workflow_optimizer:
    type: ml-service
    location: intelligent-core/ai_workflow_optimizer
    port: 8006
    technology:
    - FastAPI
    - scikit-learn
    - pandas
    - numpy
    - PostgreSQL
    dependencies:
      infrastructure:
      - database/postgresql
    provides:
    - ml.performance_prediction
    - ml.bottleneck_detection
    - ml.resource_optimization
    - ml.anomaly_detection
    endpoints:
    - POST /api/v1/optimize/performance
    - GET /api/v1/analyze/bottlenecks/{process_id}
    - GET /api/v1/optimize/resources/{process_id}
    - GET /api/v1/detect/anomalies/{process_id}
