<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - AI-Platform-ISO</title>
  <meta name="description" content="Page not found - AI-Platform-ISO Documentation">
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    .error-container {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
    }
    .error-code {
      font-size: 6rem;
      font-weight: bold;
      color: var(--primary-color);
      margin-bottom: 1rem;
    }
    .error-message {
      font-size: 1.5rem;
      margin-bottom: 2rem;
      color: var(--medium-text);
    }
    .error-buttons {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      padding: 0.75rem 1.5rem;
      text-decoration: none;
      border-radius: 0.5rem;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-primary {
      background: var(--primary-color);
      color: white;
    }
    .btn-primary:hover {
      background: #1d4ed8;
    }
    .btn-outline {
      border: 2px solid var(--primary-color);
      color: var(--primary-color);
    }
    .btn-outline:hover {
      background: var(--primary-color);
      color: white;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-code">404</div>
    <h1>Page Not Found</h1>
    <p class="error-message">
      The page you're looking for doesn't exist or has been moved.
    </p>
    <div class="error-buttons">
      <a href="index.html" class="btn btn-primary">Go Home</a>
      <a href="documentation.html" class="btn btn-outline">Browse Documentation</a>
      <a href="contact.html" class="btn btn-outline">Contact Us</a>
    </div>
  </div>
</body>
</html>
