# ============================================
# SERVICE INFORMATION - Governance Service
# ============================================
# Auto-generated: false
# Last updated: 2025-10-11
# Schema version: 1.0.0

# ============================================
# 1. BASIC INFORMATION
# ============================================
name: governance-service
display_name: "Governance Service"
version: "2.0.0"
description: "Organizational governance framework implementation for BCM. Manages stakeholder engagement, decision-making processes, organizational context analysis, governance structures, and accountability tracking."

# ============================================
# 2. CLASSIFICATION
# ============================================
type: "platform-services"
business_process: "Business Continuity Governance & Leadership (ISO 22301 Clause 5)"
status: "active"

# ============================================
# 3. TECHNICAL PARAMETERS
# ============================================
runtime:
  language: "python"
  framework: "FastAPI"
  version: "3.11+"
  port: 8025

endpoints:
  base_url: "http://localhost:8025"
  health: "/health"
  metrics: "/metrics"
  api_docs: "/docs"
  api_base: "/api/governance"

# ============================================
# 4. FUNCTIONALITY
# ============================================
capabilities:
  - "Stakeholder management and engagement tracking"
  - "Governance structure definition (roles, committees)"
  - "Decision-making process management"
  - "Organizational context analysis (PESTLE, SWOT)"
  - "BCM policy framework management"
  - "Accountability and responsibility tracking"
  - "Leadership commitment monitoring"
  - "Governance reporting and dashboards"

features:
  - name: "Stakeholder Management"
    description: "Identify, classify, and track stakeholder engagement"
    endpoints: 10

  - name: "Governance Structures"
    description: "Define roles, committees, and organizational hierarchy"
    endpoints: 8

  - name: "Policy Management"
    description: "BCM policy framework creation and approval"
    endpoints: 6

  - name: "Context Analysis"
    description: "Environmental scanning (PESTLE, SWOT, risk landscape)"
    endpoints: 8

  - name: "Decision Tracking"
    description: "Track governance decisions and accountability"
    endpoints: 8

  - name: "Reporting & Analytics"
    description: "Governance dashboards and compliance reporting"
    endpoints: 6

# ============================================
# 5. KPIS & METRICS
# ============================================
kpis:
  - name: "request_count"
    type: "counter"
    description: "Total number of API requests processed"
    target: "> 500/day"
    prometheus_metric: "governance_service_requests_total"

  - name: "response_time_p95"
    type: "histogram"
    description: "95th percentile response time"
    target: "< 600ms"
    prometheus_metric: "governance_service_response_time_ms"

  - name: "error_rate"
    type: "gauge"
    description: "Percentage of failed requests"
    target: "< 1%"
    prometheus_metric: "governance_service_error_rate"

  - name: "availability"
    type: "gauge"
    description: "Service uptime percentage"
    target: "> 99.5%"
    prometheus_metric: "governance_service_availability"

  - name: "active_stakeholders"
    type: "gauge"
    description: "Number of active stakeholders"
    target: "> 20"
    prometheus_metric: "governance_service_active_stakeholders"

  - name: "stakeholder_engagement_rate"
    type: "gauge"
    description: "Percentage of stakeholders engaged in last 90 days"
    target: "> 80%"
    prometheus_metric: "governance_service_engagement_rate"

  - name: "policy_review_compliance"
    type: "gauge"
    description: "Percentage of policies reviewed on schedule"
    target: "100%"
    prometheus_metric: "governance_service_policy_compliance"

  - name: "governance_meeting_frequency"
    type: "counter"
    description: "Number of governance meetings per month"
    target: "> 4/month"
    prometheus_metric: "governance_service_meetings_total"

  - name: "decision_implementation_rate"
    type: "gauge"
    description: "Percentage of decisions implemented on time"
    target: "> 85%"
    prometheus_metric: "governance_service_decision_implementation"

# ============================================
# 6. DEPENDENCIES
# ============================================
dependencies:
  packages:
    - "fastapi>=0.104.0"
    - "uvicorn[standard]>=0.24.0"
    - "sqlalchemy[asyncio]>=2.0.0"
    - "asyncpg>=0.29.0"
    - "pydantic>=2.4.0"
    - "pydantic-settings>=2.0.0"
    - "aio-pika>=9.3.0"
    - "httpx>=0.25.0"
    - "prometheus-client>=0.19.0"
    - "redis>=5.0.0"

  services:
    - name: "postgresql"
      version: "14+"
      purpose: "Primary database for governance data"
      required: true

    - name: "redis"
      version: "7+"
      port: 6379
      purpose: "Caching and session management"
      required: true

    - name: "rabbitmq"
      version: "3.12+"
      port: 5672
      purpose: "EventBus for event-driven integration"
      required: false

  infrastructure:
    - "PostgreSQL database (governance schema)"
    - "Redis (caching)"
    - "RabbitMQ (EventBus)"

# ============================================
# 7. INTEGRATIONS
# ============================================
integrations:
  eventbus:
    subscribes:
      - event: "compliance.gap.identified"
        source: "compliance_service"
        action: "Create governance action item"

      - event: "risk.critical.identified"
        source: "risk_service"
        action: "Escalate to governance committee"

      - event: "incident.major.declared"
        source: "response_service"
        action: "Notify governance stakeholders"

    publishes:
      - event: "governance.policy.created"
        target: "all_services"
        data: "policy_id, policy_type, approval_status"

      - event: "governance.policy.approved"
        target: "compliance_service,documents_service"
        data: "policy_id, approved_by, approval_date"

      - event: "governance.stakeholder.added"
        target: "all_services"
        data: "stakeholder_id, role, influence_level"

      - event: "governance.decision.made"
        target: "all_services"
        data: "decision_id, decision_type, responsible_party"

  rest_api:
    provides:
      - endpoint: "/api/governance/stakeholders"
        methods: ["GET", "POST", "PUT", "DELETE"]
        consumers: ["admin_panel", "compliance_service"]

      - endpoint: "/api/governance/policies"
        methods: ["GET", "POST", "PUT"]
        consumers: ["documents_service", "compliance_service"]

      - endpoint: "/api/governance/context-analysis"
        methods: ["GET", "POST"]
        consumers: ["risk_service", "planning_service"]

    consumes:
      - service: "documents_service"
        endpoint: "/api/documents/documents"
        purpose: "Create and manage policy documents"

      - service: "compliance_service"
        endpoint: "/api/compliance/assessments"
        purpose: "Get compliance status for governance reporting"

# ============================================
# 8. KNOWN ISSUES & LIMITATIONS
# ============================================
known_issues:
  - issue: "Stakeholder import from external systems manual"
    severity: "medium"
    workaround: "Manual CSV import"
    tracking: "GOV-001"

  - issue: "No automated PESTLE data gathering"
    severity: "low"
    workaround: "Manual environmental scanning"
    tracking: "GOV-002"

limitations:
  - "Maximum 500 stakeholders per tenant"
  - "Policy templates limited to predefined types"
  - "No multi-language support for governance documents"
  - "Decision tracking limited to text (no attachments)"

# ============================================
# 9. DEPLOYMENT
# ============================================
deployment:
  docker:
    image: "governance-service:latest"
    dockerfile: "./Dockerfile"
    ports:
      - "8025:8025"

  environment_variables:
    required:
      - name: "DATABASE_URL"
        description: "PostgreSQL connection string"
        example: "postgresql+asyncpg://user:pass@localhost:5432/bcm"

      - name: "REDIS_URL"
        description: "Redis connection string"
        example: "redis://localhost:6379/0"

    optional:
      - name: "EVENTBUS_URL"
        description: "RabbitMQ connection URL"
        default: "amqp://guest:guest@localhost:5672/"

      - name: "LOG_LEVEL"
        description: "Logging level"
        default: "INFO"

  health_checks:
    liveness: "/health"
    readiness: "/health"
    startup: "/health"

  startup_command: "python -m governance.main"

  requirements:
    cpu: "0.5 cores"
    memory: "512MB"
    disk: "1GB"

# ============================================
# 10. DOCUMENTATION
# ============================================
documentation:
  readme: "./README.md"
  api_docs: "http://localhost:8025/docs"
  external_links:
    - name: "ISO 22301 Clause 5 - Leadership"
      url: "https://www.iso.org/standard/75106.html"

# ============================================
# 11. OWNERSHIP
# ============================================
ownership:
  team: "Platform Services Team"
  tech_lead: "Platform Architect"
  product_owner: "BCM Product Owner"
  on_call: "platform-team@company.com"
  slack_channel: "#platform-services"

support:
  incidents: "Create ticket in JIRA Platform project"
  questions: "#platform-services Slack channel"
  documentation: "See README.md and /docs endpoint"

# ============================================
# 12. COMPLIANCE
# ============================================
compliance:
  iso_22301:
    - clause: "5.1"
      description: "Leadership and commitment"
      status: "compliant"

    - clause: "5.2"
      description: "BC policy"
      status: "compliant"

    - clause: "5.3"
      description: "Organizational roles, responsibilities, and authorities"
      status: "compliant"

    - clause: "4.1"
      description: "Understanding the organization and its context"
      status: "compliant"

    - clause: "4.2"
      description: "Understanding the needs and expectations of interested parties"
      status: "compliant"
