module_name: validation-service
version: 1.0.0
description: ISO 22301 Clauses 8.5, 9.1, 9.2, 9.3, 10 - Validation & Continuous Improvement
module_type: service
owner: platform-team
kpis:
- name: request_count
  description: Total number of requests processed by validation-service
  type: counter
  target: '> 1000/day'
  measurement: Count of API requests
  prometheus_metric: validation_service_requests_total
- name: response_time_p95
  description: 95th percentile response time
  type: histogram
  target: < 500ms
  measurement: Response time in milliseconds
  prometheus_metric: validation_service_response_time_ms
- name: error_rate
  description: Percentage of failed requests
  type: gauge
  target: < 1%
  measurement: errors / total_requests * 100
  prometheus_metric: validation_service_error_rate
- name: availability
  description: Service uptime percentage
  type: gauge
  target: '> 99.5%'
  measurement: uptime / total_time * 100
  prometheus_metric: validation_service_availability
monitoring:
  prometheus_enabled: true
  grafana_dashboard: dashboards/validation-service.json
  alert_rules: alerts/validation-service.yaml
targets:
  daily: Track daily metrics
  weekly: Review weekly trends
  monthly: Monthly performance review
