module_name: documents-service
version: 1.0.0
description: '**ISO 22301 Clause 7.5 - Documented Information Management**'
module_type: service
owner: platform-team
kpis:
- name: request_count
  description: Total number of requests processed by documents-service
  type: counter
  target: '> 1000/day'
  measurement: Count of API requests
  prometheus_metric: documents_service_requests_total
- name: response_time_p95
  description: 95th percentile response time
  type: histogram
  target: < 500ms
  measurement: Response time in milliseconds
  prometheus_metric: documents_service_response_time_ms
- name: error_rate
  description: Percentage of failed requests
  type: gauge
  target: < 1%
  measurement: errors / total_requests * 100
  prometheus_metric: documents_service_error_rate
- name: availability
  description: Service uptime percentage
  type: gauge
  target: '> 99.5%'
  measurement: uptime / total_time * 100
  prometheus_metric: documents_service_availability
- name: documents_managed
  description: Total documents under management
  type: gauge
  target: '> 500'
  measurement: Count of active documents
  prometheus_metric: documents_total
- name: document_compliance
  description: Percentage of documents up-to-date
  type: gauge
  target: '> 95%'
  measurement: updated_documents / total_documents * 100
  prometheus_metric: documents_compliance_rate
monitoring:
  prometheus_enabled: true
  grafana_dashboard: dashboards/documents-service.json
  alert_rules: alerts/documents-service.yaml
targets:
  daily: Track daily metrics
  weekly: Review weekly trends
  monthly: Monthly performance review
