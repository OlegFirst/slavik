global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Monitoring Backend metrics
  - job_name: 'monitoring_backend'
    static_configs:
      - targets: ['localhost:8050']
    metrics_path: '/metrics'

  # AI Orchestrator
  - job_name: 'ai_orchestrator'
    static_configs:
      - targets: ['localhost:8000']
    metrics_path: '/metrics'

  # Workflow Intelligence
  - job_name: 'workflow_intelligence'
    static_configs:
      - targets: ['localhost:8003']
    metrics_path: '/metrics'

  # Community Intelligence
  - job_name: 'community_intelligence'
    static_configs:
      - targets: ['localhost:8004']
    metrics_path: '/metrics'

  # Admin Control Center (if it exposes metrics)
  - job_name: 'admin_control_center'
    static_configs:
      - targets: ['localhost:3008']
    metrics_path: '/metrics'

  # Infrastructure Services
  - job_name: 'auth_service'
    static_configs:
      - targets: ['localhost:8081']
    metrics_path: '/metrics'

  - job_name: 'realtime_websocket'
    static_configs:
      - targets: ['localhost:8082']
    metrics_path: '/metrics'

  - job_name: 'notification_service'
    static_configs:
      - targets: ['localhost:8083']
    metrics_path: '/metrics'
