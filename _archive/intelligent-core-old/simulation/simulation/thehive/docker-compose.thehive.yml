version: '3.8'

services:
  # TheHive 5.x with Cassandra backend
  thehive:
    image: strangebee/thehive:5.2
    container_name: bcm_thehive
    restart: unless-stopped
    depends_on:
      - cassandra
      - elasticsearch
      - cortex
    ports:
      - "9000:9000"
    environment:
      - JVM_OPTS=-Xms1024M -Xmx1024M
    volumes:
      - thehive_data:/opt/thp/thehive/data
      - thehive_index:/opt/thp/thehive/index
      - ./config/thehive.conf:/etc/thehive/application.conf:ro
    networks:
      - bcm_thehive_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Cassandra database for TheHive
  cassandra:
    image: cassandra:4.1
    container_name: bcm_cassandra
    restart: unless-stopped
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=thehive
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=1024M
      - HEAP_NEWSIZE=256M
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - bcm_thehive_network
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Elasticsearch for TheHive indexing
  elasticsearch:
    image: elasticsearch:7.17.9
    container_name: bcm_elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - cluster.name=thehive
      - thread_pool.search.queue_size=100000
      - thread_pool.write.queue_size=10000
      - gateway.recover_after_nodes=1
      - xpack.security.enabled=false
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - bcm_thehive_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Cortex for observable analysis
  cortex:
    image: thehiveproject/cortex:3.1.7
    container_name: bcm_cortex
    restart: unless-stopped
    depends_on:
      - elasticsearch
    ports:
      - "9001:9001"
    environment:
      - JVM_OPTS=-Xms512M -Xmx512M
    volumes:
      - cortex_data:/opt/cortex/data
      - ./config/cortex.conf:/etc/cortex/application.conf:ro
    networks:
      - bcm_thehive_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # TheHive-BCM Integration Service
  thehive-bcm-bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    container_name: bcm_thehive_bridge
    restart: unless-stopped
    depends_on:
      - thehive
    ports:
      - "8090:8090"
    environment:
      - THEHIVE_URL=http://thehive:9000
      - THEHIVE_API_KEY=${THEHIVE_API_KEY}
      - ODOO_URL=${ODOO_URL:-http://odoo:8069}
      - ODOO_API_KEY=${ODOO_API_KEY}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - LOG_LEVEL=INFO
    volumes:
      - ./config/bridge_config.json:/app/config.json:ro
    networks:
      - bcm_thehive_network
      - bcm_platform_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # TheHive webhook receiver
  thehive-webhook-receiver:
    build:
      context: .
      dockerfile: Dockerfile.webhooks
    container_name: bcm_thehive_webhooks
    restart: unless-stopped
    ports:
      - "8091:8091"
    environment:
      - ODOO_URL=${ODOO_URL:-http://odoo:8069}
      - ODOO_API_KEY=${ODOO_API_KEY}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - LOG_LEVEL=INFO
    networks:
      - bcm_thehive_network
      - bcm_platform_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  thehive_data:
    driver: local
  thehive_index:
    driver: local
  cassandra_data:
    driver: local
  elasticsearch_data:
    driver: local
  cortex_data:
    driver: local

networks:
  bcm_thehive_network:
    driver: bridge
    name: bcm_thehive_network
  bcm_platform_network:
    external: true
    name: bcm_platform_network
