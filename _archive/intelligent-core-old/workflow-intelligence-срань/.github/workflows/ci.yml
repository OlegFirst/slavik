name: Workflow Intelligence CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Security scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Run Bandit (Security Linter)
        run: |
          bandit -r workflow_intelligence/ -f json -o bandit-report.json || true
          bandit -r workflow_intelligence/ -ll

      - name: Check Dependencies with Safety
        run: |
          pip install -r requirements.txt
          safety check --json || true

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json

  # Code quality
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 workflow_intelligence/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 workflow_intelligence/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check formatting with Black
        run: |
          black --check workflow_intelligence/

      - name: Check import sorting with isort
        run: |
          isort --check-only workflow_intelligence/

      - name: Type checking with mypy
        run: |
          mypy workflow_intelligence/ --ignore-missing-imports || true

  # Unit tests
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workflow_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run SQL injection tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workflow_test
        run: |
          pytest tests/test_sql_injection.py -v --tb=short

      - name: Run RLS tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workflow_test
        run: |
          pytest tests/test_rls.py -v --tb=short

      - name: Run Pydantic validation tests
        run: |
          pytest tests/test_pydantic_validation.py -v --tb=short

      - name: Run all tests with coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workflow_test
        run: |
          pytest tests/ -v --cov=workflow_intelligence --cov-report=xml --cov-report=html --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: coverage-report
          path: htmlcov/

  # ISO 22301 compliance check
  compliance-check:
    name: ISO 22301 Compliance Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check BIA compliance
        run: |
          python -c "
          import asyncio
          from workflow_intelligence.compliance import ISO22301Checker

          async def check():
              checker = ISO22301Checker()
              context = {'data': {
                  'critical_activities_list': True,
                  'resource_inventory': True,
                  'impact_analysis': True,
                  'rto_rpo_defined': True,
                  'priority_matrix': True,
                  'mtpd_defined': True
              }}
              result = await checker.check_compliance(context, '8.2.2')
              print(f\"BIA Compliance: {result['compliance_percentage']:.1f}%\")
              assert result['compliant'], f\"BIA compliance failed: {result['gaps']}\"

          asyncio.run(check())
          "

      - name: Check Planning compliance
        run: |
          python -c "
          import asyncio
          from workflow_intelligence.compliance import ISO22301Checker

          async def check():
              checker = ISO22301Checker()
              context = {'data': {
                  'objectives_documented': True,
                  'measurable_targets': True,
                  'action_plan': True,
                  'responsibilities_assigned': True
              }}
              result = await checker.check_compliance(context, '8.3')
              print(f\"Planning Compliance: {result['compliance_percentage']:.1f}%\")
              assert result['compliant'], f\"Planning compliance failed: {result['gaps']}\"

          asyncio.run(check())
          "

  # Build and validate
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [security-scan, code-quality, test, compliance-check]
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build wheel setuptools

      - name: Build package
        run: |
          python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: dist-package
          path: dist/

  # Integration tests (optional - requires full stack)
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workflow_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Apply RLS migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workflow_test
        run: |
          python apply_rls_migration.py

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workflow_test
        run: |
          # Add integration tests here when available
          echo "Integration tests placeholder"

  # Notify on success/failure
  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [security-scan, code-quality, test, compliance-check, build]
    if: always()
    steps:
      - name: Check job status
        run: |
          if [ "${{ needs.security-scan.result }}" == "success" ] && \
             [ "${{ needs.code-quality.result }}" == "success" ] && \
             [ "${{ needs.test.result }}" == "success" ] && \
             [ "${{ needs.compliance-check.result }}" == "success" ] && \
             [ "${{ needs.build.result }}" == "success" ]; then
            echo "✅ All checks passed!"
            exit 0
          else
            echo "❌ Some checks failed"
            exit 1
          fi
