      endpoints: 5
    - name: Risk Monitoring
      description: Monitor risk status and effectiveness of controls
      endpoints: 5
    - name: Risk Reporting
      description: Generate risk reports, heat maps, and dashboards
      endpoints: 8
    kpis:
    - name: request_count
      type: counter
      description: Total number of API requests processed
      target: '> 800/day'
