    dependencies:
      packages:
      - fastapi>=0.104.0
      - uvicorn[standard]>=0.24.0
      - sqlalchemy[asyncio]>=2.0.0
      - asyncpg>=0.29.0
      - pydantic>=2.4.0
      - pydantic-settings>=2.0.0
      - aio-pika>=9.3.0
      - httpx>=0.25.0
      - prometheus-client>=0.19.0
      - redis>=5.0.0
      services:
