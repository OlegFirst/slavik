        memory: 512MB
        disk: 2GB
    documentation:
      readme: ./README.md
      api_docs: http://localhost:8027/docs
      external_links:
      - name: ISO 22301 Clause 8.4 - Incident Response
        url: https://www.iso.org/standard/75106.html
    ownership:
