        status: compliant
      - clause: 7.5.3
        description: Control of documented information
        status: compliant
      - clause: 7.5.3a
        description: Availability and suitability for use
        status: compliant
      - clause: 7.5.3b
        description: Adequate protection
        status: compliant
      - clause: 7.5.3c
        description: Distribution, access, retrieval
        status: compliant
      - clause: 7.5.3d
        description: Storage and preservation
        status: compliant
      - clause: 7.5.3e
