  - name: collective
    display_name: Collective Intelligence Agent Networks
    version: 1.0.0
    description: Privacy-preserving knowledge sharing across organizations through
      temporary AI agents synthesized from anonymized collective wisdom. Enables organizations
      to benefit from proven solutions without compromising confidentiality using
      k-anonymity principles (minimum k=5).
    type: intelligent-core/collective-intelligence
    business_process: Privacy-Preserving Collective Learning & Knowledge Sharing
    status: active
    runtime:
      language: python
      framework: FastAPI
      version: 3.11+
      port: 8034
    endpoints:
      base_url: http://localhost:8034
      health: /health
      metrics: /metrics
      api_docs: /docs
      api_base: /api/v1
    capabilities:
    - Automatic stuck organization detection (7-day progress monitoring)
    - Privacy-preserving collective agent creation (k-anonymity k≥5)
    - 'Multi-layer anonymization (4 layers: org, journey, pattern, metrics)'
    - Temporary agent lifecycle management (7-day expiration)
    - Aggregate statistical framing without source attribution
    - Conversational chat interface with source protection
    - Re-identification risk scoring and validation
    - Success-driven case selection (≥80% success rate)
    - Case library integration for solver identification
    features:
    - name: Stuck Detection
      description: Multi-signal detection of organizations requiring assistance
      endpoints: 3
      signals:
      - Days no progress (7+ days) = +3 points
      - Validation failures (5+) = +2 points
      - Low AI confidence (<0.6) = +2 points
      - Repeated questions (3+) = +1 point
      - Document review cycles (5+) = +1 point
      - Frustration score (>0.7) = +2 points
      scoring:
      - 'Score 0-3: On track'
      - 'Score 4-6: Stuck, help recommended'
      - 'Score 7+: Seriously stuck, immediate intervention'
    - name: Collective Agent Creation
      description: Synthesize anonymous collective wisdom agents
      endpoints: 5
      workflow:
      - Query case library (min 5 cases, ≥80% success)
      - Apply 4-layer anonymization
      - Calculate re-identification risk (must be ≤0.3)
      - Configure LLM agent with collective knowledge
      - Activate with 7-day auto-expiration
    - name: Privacy System
      description: Multi-layer privacy protection
      endpoints: 3
      layers:
      - 'Layer 1: Organization anonymization (names, locations, dept terms)'
      - 'Layer 2: Journey anonymization (dates, durations, tool names)'
      - 'Layer 3: Pattern anonymization (person names, products, org terms)'
      - 'Layer 4: Metric anonymization (rounding, ranges, relative comparisons)'
    - name: Chat Interface
      description: Conversational interface with collective agents
      endpoints: 2
      features:
      - Statistical framing (e.g., '5 out of 7 organizations...')
      - Source attribution prevention
      - Session management (Redis-backed)
      - Conversation audit logging
    kpis:
    - name: agents_created_total
      type: counter
      description: Total collective agents created
      target: '> 50/month'
      prometheus_metric: collective_agents_created_total
    - name: agents_active
      type: gauge
      description: Currently active agents
      target: 10-50 concurrent
      prometheus_metric: collective_agents_active
    - name: stuck_detections_total
      type: counter
      description: Stuck organizations detected
      target: '> 30/month'
      prometheus_metric: collective_stuck_detections_total
    - name: chat_messages_total
      type: counter
      description: Total chat messages processed
      target: '> 500/month'
      prometheus_metric: collective_chat_messages_total
    - name: privacy_violations_total
      type: counter
      description: Privacy violations detected (should be 0)
      target: '0'
      prometheus_metric: collective_privacy_violations_total
    - name: stuck_detection_latency
      type: histogram
      description: Stuck detection response time
      target: < 100ms (P95)
      prometheus_metric: collective_stuck_detection_seconds
    - name: agent_creation_time
      type: histogram
      description: Time to create collective agent
      target: < 5s
      prometheus_metric: collective_agent_creation_seconds
    - name: chat_response_time
      type: histogram
      description: Chat response latency (includes LLM)
      target: < 2s
      prometheus_metric: collective_chat_response_seconds
    - name: risk_score_p95
      type: gauge
      description: 95th percentile re-identification risk score
      target: < 0.3 (safe threshold)
      prometheus_metric: collective_risk_score_p95
