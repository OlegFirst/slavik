      - name: ResponseAction
        table: response_actions
        description: Response actions and assignments
      - name: ResponseTeam
        table: response_teams
        description: Incident response team members
      - name: Communication
        table: communications
        description: Incident communications log
      - name: Timeline
        table: timeline
        description: Chronological incident events
      - name: RecoveryMetrics
