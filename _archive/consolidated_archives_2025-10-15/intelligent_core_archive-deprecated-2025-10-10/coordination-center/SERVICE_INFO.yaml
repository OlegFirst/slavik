        consumers: ["orchestrator", "admin_panel"]

      - endpoint: "/api/coordination/tasks"
        methods: ["GET", "POST"]
        consumers: ["orchestrator"]

    consumes:
      - service: "orchestrator"
        endpoint: "/api/v1/decision"
        purpose: "Request AI assistance for coordination decisions"

