# ===================================================================
# SYSTEM RELATIONSHIPS (FUNCTIONAL DEPENDENCIES)
# ===================================================================
system_relationships:
  # Foundation systems (all depend on these)
  - system: data_storage_system
    depends_on: []
    used_by: [all_systems]
    relationship_type: "foundation"

  - system: event_driven_system
    depends_on: [data_storage_system]
    used_by: [most_systems]
    relationship_type: "foundation"

  # Startup depends on nothing (it starts everything)
  - system: startup_orchestration_system
    depends_on: [data_storage_system]
    used_by: []
    relationship_type: "initialization"

  # Security protects everything
  - system: security_system
    depends_on: [data_storage_system]
    protects: [all_systems]
    relationship_type: "cross_cutting"

  # Monitoring observes everything
  - system: monitoring_system
    depends_on: [data_storage_system]
    monitors: [all_systems]
    relationship_type: "cross_cutting"

  # AI systems enhance business systems
  - system: ai_orchestration_system
    depends_on: [data_storage_system, event_driven_system, ai_foundation_system]
    enhances: [bcm_business_system, workflow_system]
    relationship_type: "enhancement"

  # Business logic uses workflows
  - system: bcm_business_system
    depends_on: [data_storage_system, workflow_system, security_system]
    enhanced_by: [ai_orchestration_system, predictive_system]
    relationship_type: "business_operation"

