# ===================================================================
# ARCHITECTURE PHILOSOPHY
# ===================================================================
# Systems organized by PURPOSE (what they do) not TECHNOLOGY (what they use)
# Each system represents a functional capability of the platform
# Examples: Startup System, Resilience System, Security System, etc.

functional_systems:
  # =================================================================
  # 1. 🚀 СИСТЕМА ЗАПУСКА И ОРКЕСТРАЦИИ (STARTUP & ORCHESTRATION)
  # =================================================================
  - id: startup_orchestration_system
    name: "Система запуска и оркестрации"
    name_en: "Startup & Orchestration System"
    icon: "🚀"
    category: "infrastructure_management"
    status: production
    criticality: critical

    description:
      purpose: "Manages service lifecycle, coordinates startup, monitors system state"
      business_value: "Ensures platform starts reliably and all services coordinate properly"

    key_services:
      - service_discovery    # Service registry and coordination
      - mio_manager         # Platform observatory & coordinator
      - ai_orchestration    # AI decision-making and coordination

    capabilities:
      - "Service registration and discovery"
      - "Startup sequence coordination"
      - "Health monitoring of all services"
      - "Platform state tracking"
      - "Service dependency management"
      - "Graceful shutdown coordination"

  # =================================================================
  # 2. 🛡️ СИСТЕМА ОТКАЗОУСТОЙЧИВОСТИ (RESILIENCE & FAILOVER)
  # =================================================================
  - id: resilience_system
    name: "Система отказоустойчивости"
    name_en: "Resilience & Failover System"
    icon: "🛡️"
    category: "reliability"
    status: production
    criticality: critical

    description:
      purpose: "Ensures continuous operation, recovery after failures, self-healing"
      business_value: "Platform remains operational even when components fail"

    key_services:
      - event_intelligence      # Self-healing and error analysis
      - system_bcm_service     # Platform self-application of BCM
      - api_gateway            # Circuit breaker pattern

    capabilities:
      - "Automatic failure detection"
      - "Self-healing code repairs"
      - "Circuit breaker pattern"
      - "Automatic recovery procedures (7 procedures)"
      - "Platform health monitoring (29 services)"
      - "RTO monitoring and enforcement"

  # =================================================================
  # 3. 🔒 СИСТЕМА БЕЗОПАСНОСТИ (SECURITY & ACCESS CONTROL)
  # =================================================================
  - id: security_system
    name: "Система безопасности"
    name_en: "Security & Access Control System"
    icon: "🔒"
    category: "security"
    status: production
    criticality: critical

    description:
      purpose: "Authentication, authorization, secrets management, security audit"
      business_value: "Protects platform and data from unauthorized access"

    key_services:
      - auth_service       # JWT authentication & RBAC
      - vault             # HashiCorp Vault secrets
      - api_gateway       # Auth validation

    capabilities:
      - "JWT authentication"
      - "Role-Based Access Control (RBAC)"
      - "Secrets management and rotation"
      - "Audit logging (100% request logging)"
      - "Multi-factor authentication (MFA)"
      - "Token validation (<100ms)"

