# Subsystems Catalog - AI Platform ISO 22301
# Last Updated: 2025-10-12
# Source: Functional Systems Analysis by Agent
# Total Subsystems: 11 (technical categories)
# Total Services: 46

version: 1.0.0
created_date: '2025-10-12'
total_subsystems: 11
active_subsystems: 11

subsystems:
  # ===================================================================
  # 1. DATABASE INFRASTRUCTURE (💾)
  # ===================================================================
  - id: database_infrastructure
    name: "Database Infrastructure"
    category: infrastructure
    description: "Relational, cache, vector, and time-series data storage"
    services:
      - postgresql  # Primary database (Supabase)
      - redis       # Cache and session storage
      - qdrant      # Vector database for RAG
      - db_managers # Database connection pools
    status: production
    critical: true
    port_range: "5432, 6379, 6333"
    dependencies: []
    capabilities:
      - "Persistent data storage (PostgreSQL)"
      - "Fast caching (Redis)"
      - "Semantic search (Qdrant)"
      - "29 database schemas"
      - "Row-Level Security (RLS)"
      - "Real-time subscriptions"

  # ===================================================================
  # 2. RUNTIME SERVICES (⚡)
  # ===================================================================
  - id: runtime_services
    name: "Runtime Services"
    category: infrastructure
    description: "Service discovery, WebSocket, message queues"
    services:
      - service_discovery    # Consul-based service registry
      - realtime_websocket   # Real-time communications
      - message_queue        # RabbitMQ (planned)
    status: production
    critical: true
    port_range: "8500, 8071, 5672"
    dependencies:
      - database_infrastructure  # Redis for registry
    capabilities:
      - "Service registration and discovery"
      - "Real-time WebSocket updates"
      - "Async task queuing (planned)"
      - "Health monitoring"

  # ===================================================================
  # 3. GATEWAY LAYER (🚪)
  # ===================================================================
  - id: gateway_layer
    name: "Gateway Layer"
    category: infrastructure
    description: "Unified API gateway with routing and load balancing"
    services:
      - api_gateway  # FastAPI gateway with auth, rate limiting
    status: production
    critical: true
    port_range: "8000"
    dependencies:
      - runtime_services  # Service discovery
      - security          # Auth service
    capabilities:
      - "Unified API entry point (single endpoint)"
      - "JWT authentication & authorization"
      - "Rate limiting (token bucket, sliding window)"
      - "Load balancing (round-robin, least-connections)"
      - "Circuit breaker pattern"

  # ===================================================================
  # 4. OBSERVABILITY (📊)
  # ===================================================================
  - id: observability
    name: "Observability"
    category: infrastructure
    description: "Metrics, monitoring, visualization, alerting"
    services:
      - prometheus  # Time-series metrics database
      - grafana     # Visualization dashboards
    status: production
    critical: true
    port_range: "9090, 3000"
    dependencies:
      - database_infrastructure  # For dashboard storage
    capabilities:
      - "Metrics collection via /metrics endpoints"
      - "Time-series data storage"
      - "18 pre-configured dashboards"
      - "Alerting rules engine"
      - "Service discovery integration"

  # ===================================================================
  # 5. EVENTBUS CORE (📡)
  # ===================================================================
  - id: eventbus_core
    name: "EventBus Core"
    category: infrastructure
    description: "Clean architecture event system for choreography"
    services:
      - eventbus  # Event publishing and subscription
    status: production
    critical: true
    port_range: "8003"
    dependencies:
      - database_infrastructure  # Redis Streams backend
    capabilities:
      - "Event publishing and subscription"
      - "Multiple backends (Memory, Redis Streams)"
      - "Event filtering by pattern"
      - "Async/await support"
      - "Type-safe event definitions"

  # ===================================================================
  # 6. SECURITY (🔒)
  # ===================================================================
  - id: security
    name: "Security"
    category: infrastructure
    description: "Authentication, authorization, secrets management"
    services:
      - auth_service     # JWT authentication & RBAC
      - vault            # HashiCorp Vault secrets
      - secrets_manager  # Additional secrets management
    status: production
    critical: true
    port_range: "8001, 8200"
    dependencies:
      - database_infrastructure  # User storage
    capabilities:
      - "JWT authentication"
      - "Role-Based Access Control (RBAC)"
      - "Secrets storage (KV v2)"
      - "Dynamic secrets generation"
      - "Audit logging"
      - "Secret rotation"

  # ===================================================================
  # 7. AI OFFICE (🤖)
  # ===================================================================
  - id: ai_office
    name: "AI Office Infrastructure"
    category: ai
    description: "AI specialists, coordinators, and automation agents"
    services:
      - mio_manager           # Platform observatory & coordinator
      - db_intelligence       # Database performance specialist
      - analytics_specialist  # Platform analytics expert
      - devops_agent         # DevOps automation agent
      - project_agent        # Project management agent
      - agent_router         # Agent request routing
      - ai_event_manager     # AI-powered event coordination
    status: production
    critical: false
    port_range: "8046, 8051, 8045, 8062, 8063, 8052, 8055"
    dependencies:
      - database_infrastructure
      - eventbus_core
      - runtime_services
    capabilities:
      - "Platform-wide health monitoring"
      - "Prometheus metrics coverage analysis"
      - "Database performance optimization"
      - "Infrastructure automation"
      - "Project task management"
      - "AI request routing"

  # ===================================================================
  # 8. SHARED LIBRARIES (📚)
  # ===================================================================
  - id: shared_libraries
    name: "Shared Libraries"
    category: infrastructure
    description: "Common utilities, helpers, and test infrastructure"
    services:
      - shared  # Common Python utilities
      - tests   # Shared test infrastructure
    status: production
    critical: false
    port_range: "N/A"
    dependencies: []
    capabilities:
      - "Common Python utilities"
      - "Database managers"
      - "Redis managers"
      - "Shared test infrastructure"
      - "Configuration helpers"

  # ===================================================================
  # 9. PLATFORM SERVICES (📋)
  # ===================================================================
  - id: platform_services
    name: "Platform Services"
    category: business
    description: "BCM business logic services (BIA, Risk, Plans, etc.)"
    services:
      - planning_service      # BCM journey planning
      - bia_service          # Business Impact Analysis
      - learning_service     # Personnel training
      - validation_service   # Testing and validation
      - plans_service        # Continuity plans
      - documents_service    # Document management
      - governance_service   # Governance and policies
      - compliance_service   # Compliance monitoring
      - risk_service         # Risk assessment
      - response_service     # Incident response
      - process_analytics    # Process analytics
    status: production
    critical: true
    port_range: "8004-8029"
    dependencies:
      - database_infrastructure
      - eventbus_core
      - security
    capabilities:
      - "Business Impact Analysis (BIA)"
      - "Risk Assessment"
      - "BCM Plan Management"
      - "Document Management"
      - "Audit Trail"
      - "ISO 22301 Compliance"
      - "Governance Framework"
      - "Incident Response"

  # ===================================================================
  # 10. INTELLIGENT CORE (🧠)
  # ===================================================================
  - id: intelligent_core
    name: "Intelligent Core"
    category: ai
    description: "AI orchestration, learning, workflow intelligence"
    services:
      - workflow_intelligence  # Temporal-based workflow orchestration
      - ai_foundation         # RAG, embeddings, LLM integration
      - expertise_center      # Domain-specific AI assistants
      - community_intelligence # Peer knowledge sharing
      - workflow_engine       # BPMN 2.0 workflow execution
      - ai_orchestration      # Autonomous AI decision-making (handles multi-agent coordination)
      - event_intelligence    # Self-healing and pattern detection
      - predictive            # Forecasting and predictions
      - collective            # Collective intelligence networks
      - ai_workflow_optimizer # ML-powered workflow optimization
      - system_bcm_service    # Platform self-application of BCM
      - scenario_intelligence # Scenario-based orchestration (4-level hierarchy)
      # coordination_center removed - functionality in ai_orchestration (Delegation Manager)
    status: production
    critical: true
    port_range: "8010, 8030-8044, 8050"
    dependencies:
      - database_infrastructure
      - eventbus_core
      - ai_office
    capabilities:
      - "Temporal workflow orchestration"
      - "RAG with Qdrant embeddings"
      - "Domain-Specific AI Assistants"
      - "Peer knowledge sharing"
      - "BPMN 2.0 workflow execution"
      - "Autonomous AI decision-making"
      - "Self-healing and pattern detection"
      - "AI-powered forecasting"
      - "ML workflow optimization"
      - "Platform self-BCM"

  # ===================================================================
  # 11. USER APPLICATIONS (📱)
  # ===================================================================
  - id: user_applications
    name: "User Applications"
    category: business_applications
    description: "User-facing applications and products (программные продукты для пользователей)"
    services:
      # Main Applications (4)
      - bcm_portal              # Main BCM management portal
      - simulation_platform     # BCM exercises and simulations
      - expert_marketplace      # Expert consultation marketplace
      - digital_twin           # Organization digital twin

      # BCM Modules (12)
      - bia_module             # BIA functionality
      - risk_module            # Risk assessment
      - plans_module           # BCM plans
      - response_module        # Incident response
      - validation_module      # Testing & exercises
      - compliance_module      # Compliance monitoring
      - governance_module      # Governance
      - learning_module        # Training
      - documents_module       # Document management
      - planning_module        # Journey planning
      - analytics_module       # Analytics & reporting
      - monitoring_module      # Monitoring & KPIs

    status: production
    critical: false
    port_range: "3000-3003 (apps), 9000-9012 (modules)"
    dependencies:
      - platform_services  # Backend BCM services
      - intelligent_core   # AI services
      - interface_layer    # UI components
      - security          # Authentication
    capabilities:
      # Applications
      - "BCM Portal (unified interface for all BCM)"
      - "Simulation Platform (exercises, drills, scenarios)"
      - "Expert Marketplace (consulting, training, audits)"
      - "Digital Twin (virtual organization model)"

      # Modules
      - "12 BCM modules powering applications"
      - "BIA, Risk, Plans, Response, Validation"
      - "Compliance, Governance, Learning, Documents"
      - "Planning, Analytics, Monitoring"

  # ===================================================================
  # 12. INTERFACE LAYER (🖥️)
  # ===================================================================
  - id: interface_layer
    name: "Interface Layer"
    category: ui
    description: "User interfaces and external integrations"
    services:
      - mcp_interface  # Model Context Protocol (reserved)
      - admin_panel    # System administration (reserved)
      - platform_ui    # End-user interface (reserved)
    status: reserved
    critical: false
    port_range: "TBD"
    dependencies:
      - gateway_layer
      - security
    capabilities:
      - "Model Context Protocol interface (planned)"
      - "System administration dashboard (planned)"
      - "End-user BCM interface (planned)"

