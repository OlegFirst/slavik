  user_applications_breakdown:
    main_applications: 4       # Portal, Simulation, Marketplace, Digital Twin
    bcm_modules: 12           # BIA, Risk, Plans, Response, etc.

  by_status:
    production: 10
    planned: 0
    reserved: 1
    configured: 0

  critical_subsystems: 8
  non_critical_subsystems: 4

# ===================================================================
# DEPLOYMENT ORDER (for docker-compose)
# ===================================================================
deployment_order:
  phase_1_foundation:
    order: 1
    subsystems:
      - database_infrastructure  # PostgreSQL, Redis, Qdrant
      - shared_libraries         # Common utilities

  phase_2_infrastructure:
    order: 2
    subsystems:
      - security                 # Auth, Vault
      - eventbus_core           # EventBus
      - runtime_services        # Service Discovery, WebSocket
      - observability           # Prometheus, Grafana

  phase_3_gateway:
    order: 3
    subsystems:
      - gateway_layer           # API Gateway

  phase_4_platform:
    order: 4
    subsystems:
      - platform_services       # BCM business logic (backend)

  phase_5_intelligence:
    order: 5
    subsystems:
      - intelligent_core        # AI services
      - ai_office              # AI specialists

  phase_6_applications:
    order: 6
    subsystems:
      - business_services      # User applications (программные сервисы)

  phase_7_interface:
    order: 7
    subsystems:
      - interface_layer        # UI (reserved)

# ===================================================================
# INTEGRATION PATTERNS
# ===================================================================
integration_patterns:
  - pattern: "All → Database Managers → PostgreSQL/Redis/Qdrant"
    description: "Universal data access pattern"
    subsystems: [all]
    target: database_infrastructure

  - pattern: "Services ↔ EventBus → Async communication"
    description: "Event-driven choreography"
    subsystems: [platform_services, intelligent_core, ai_office]
    target: eventbus_core

  - pattern: "External → API Gateway → Service Discovery → Services"
    description: "Request routing with service discovery"
    subsystems: [gateway_layer, runtime_services]
    targets: [platform_services, intelligent_core]

  - pattern: "Services /metrics → Prometheus → Grafana"
    description: "Metrics collection and visualization"
    subsystems: [all]
    target: observability

  - pattern: "AI tasks → Agent Router → AI Orchestration → Specialists"
    description: "AI agent coordination"
    subsystems: [ai_office, intelligent_core]
    target: ai_office

  - pattern: "BCM → Workflow Intelligence → Temporal → Execution"
    description: "Workflow orchestration"
    subsystems: [platform_services, intelligent_core]
    target: intelligent_core

  - pattern: "UI ↔ WebSocket ↔ EventBus → Live updates"
    description: "Real-time user interface updates"
    subsystems: [interface_layer, runtime_services, eventbus_core]
    target: runtime_services

  - pattern: "AI → RAG → Qdrant → Context retrieval"
    description: "Retrieval-Augmented Generation"
    subsystems: [intelligent_core, ai_office]
    target: database_infrastructure

