  by_category:
    infrastructure: 6           # Database, Runtime, Gateway, Observability, EventBus, Security
    ai: 2                      # AI Office, Intelligent Core
    business: 1                # Platform Services (backend)
    business_applications: 1   # User Applications (4 apps + 12 modules)
