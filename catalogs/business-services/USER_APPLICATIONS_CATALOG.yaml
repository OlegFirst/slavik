  # Core BCM
  - id: "bia-module"
    name: "BIA Module"
    name_ru: "Модуль BIA"
    category: "bcm_core"
    description: "Business Impact Analysis functionality"
    used_by: ["bcm-portal", "digital-twin"]

  - id: "risk-module"
    name: "Risk Assessment Module"
    name_ru: "Модуль Оценки Рисков"
    category: "bcm_core"
    description: "Risk identification and assessment"
    used_by: ["bcm-portal", "digital-twin"]

  - id: "plans-module"
    name: "BCM Plans Module"
    name_ru: "Модуль Планов БНП"
    category: "bcm_core"
    description: "BCM plan creation and management"
    used_by: ["bcm-portal", "simulation-platform"]

  # Operations
  - id: "response-module"
    name: "Incident Response Module"
    name_ru: "Модуль Реагирования"
    category: "bcm_operations"
    description: "Incident detection and response"
    used_by: ["bcm-portal", "simulation-platform"]

  - id: "validation-module"
    name: "Validation & Testing Module"
    name_ru: "Модуль Валидации"
    category: "bcm_operations"
    description: "Plan testing and exercises"
    used_by: ["bcm-portal", "simulation-platform"]

  # Governance
  - id: "compliance-module"
    name: "Compliance Module"
    name_ru: "Модуль Соответствия"
    category: "governance"
    description: "ISO 22301 compliance monitoring"
    used_by: ["bcm-portal"]

  - id: "governance-module"
    name: "Governance Module"
    name_ru: "Модуль Управления"
    category: "governance"
    description: "BCM governance and policies"
    used_by: ["bcm-portal"]

  # Support
  - id: "learning-module"
    name: "Learning & Training Module"
    name_ru: "Модуль Обучения"
    category: "support"
    description: "Training and competency management"
    used_by: ["bcm-portal", "expert-marketplace"]

  - id: "documents-module"
    name: "Document Management Module"
    name_ru: "Модуль Документов"
    category: "support"
    description: "BCM document management"
    used_by: ["bcm-portal"]

  # Strategy
  - id: "planning-module"
    name: "Planning & Journey Module"
    name_ru: "Модуль Планирования Пути"
    category: "strategy"
    description: "BCM journey planning"
    used_by: ["bcm-portal", "digital-twin"]

  # Analytics
  - id: "analytics-module"
    name: "Analytics & Reporting Module"
    name_ru: "Модуль Аналитики"
    category: "analytics"
    description: "Business intelligence and reporting"
    used_by: ["bcm-portal", "digital-twin"]

  - id: "monitoring-module"
    name: "Monitoring & Metrics Module"
    name_ru: "Модуль Мониторинга"
    category: "analytics"
    description: "Real-time monitoring and KPIs"
    used_by: ["bcm-portal", "digital-twin"]

# ========================================================================
# APPLICATION INTEGRATION MAP
# ========================================================================
application_integration:
  bcm_portal:
    primary_modules: ["bia", "risk", "plans", "compliance", "governance"]
    supporting_modules: ["response", "validation", "learning", "documents", "planning", "analytics", "monitoring"]
    ai_services: ["ai-orchestration", "predictive", "community-intelligence"]

  simulation_platform:
    primary_modules: ["validation", "response", "plans"]
    supporting_modules: ["learning"]
    ai_services: ["scenario-intelligence", "ai-orchestration"]

  expert_marketplace:
    primary_modules: ["learning"]
    supporting_modules: []
    ai_services: ["predictive", "community-intelligence"]

  digital_twin:
    primary_modules: ["bia", "risk", "planning", "analytics", "monitoring"]
    supporting_modules: []
    ai_services: ["workflow-intelligence", "predictive", "event-intelligence", "ai-orchestration"]

# ========================================================================
# USER JOURNEY EXAMPLES
# ========================================================================
user_journeys:
  - journey: "New Organization Onboarding"
    applications: ["bcm-portal", "digital-twin"]
    steps:
      - "Create organization profile (Portal)"
      - "Initial assessment (Portal)"
      - "Create digital twin (Digital Twin)"
      - "Conduct BIA (Portal + Digital Twin)"
      - "Assess risks (Portal + Digital Twin)"
      - "Create BCM plans (Portal)"

  - journey: "BCM Exercise"
    applications: ["simulation-platform", "bcm-portal"]
    steps:
      - "Design exercise scenario (Simulation)"
      - "Configure simulation (Simulation)"
      - "Notify participants (Portal)"
      - "Run simulation (Simulation)"
      - "Track performance (Simulation)"
      - "Generate report (Portal)"

  - journey: "Hire BCM Expert"
    applications: ["expert-marketplace", "bcm-portal"]
    steps:
      - "Post requirement (Marketplace)"
      - "AI matches experts (Marketplace)"
      - "Review profiles (Marketplace)"
      - "Book consultation (Marketplace)"
      - "Video call (Marketplace)"
      - "Track progress (Portal)"

