apiVersion: 1

# Grafana Datasources Configuration
# Auto-provisioned datasources for BCM Platform

datasources:
  # Prometheus - Primary Metrics Store
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      httpMethod: POST
    version: 1

  # Loki - Log Aggregation
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
    version: 1

  # AlertManager - Alerts
  - name: AlertManager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    editable: false
    jsonData:
      implementation: prometheus
    version: 1

  # PostgreSQL - Database for Security & Archive Metrics
  - name: PostgreSQL
    type: postgres
    access: proxy
    url: aws-1-eu-north-1.pooler.supabase.com:5432
    database: postgres
    user: postgres.tpdkhddtbhpoqzzgxfni
    secureJsonData:
      password: K@x3ta9V8GK5rnW
    editable: false
    jsonData:
      sslmode: require
      postgresVersion: 1500
      timescaledb: false
    version: 1
