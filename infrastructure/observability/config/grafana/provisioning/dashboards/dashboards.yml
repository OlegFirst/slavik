apiVersion: 1

# Grafana Dashboards Provisioning - REAL intelligent-core services
# Auto-import all dashboards from /var/lib/grafana/dashboards
# Updated: 2025-10-07 - Configured for Supabase + Upstash + Qdrant Cloud

providers:
  # All Dashboards - Single Provider
  - name: 'BCM Platform & Intelligent Core'
    orgId: 1
    folder: ''  # No folder - all dashboards in root
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false

  # Backup Dashboards (Read-Only Archive)
  - name: 'Archive - Old Dashboards'
    orgId: 1
    folder: 'Archive'
    type: file
    disableDeletion: true
    updateIntervalSeconds: 300
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards/dashboards.backup.20251003
      foldersFromFilesStructure: false
