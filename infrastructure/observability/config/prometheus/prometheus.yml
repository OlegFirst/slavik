global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'bcm-platform'
    environment: 'production'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Load rules once and periodically evaluate them
# rule_files:
#   - "alerts/*.yml"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Planning Service (ISO 22301 Clause 8.3)
  - job_name: 'planning-service'
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['planning-service:8011']
        labels:
          service: 'planning-service'
          iso_clause: '8.3'
          component: 'bcm-strategy'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'planning-service'

  # Plans Service (ISO 22301 Clause 8.4)
  - job_name: 'plans-service'
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['plans-service:8023']
        labels:
          service: 'plans-service'
          iso_clause: '8.4'
          component: 'bcm-plans'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'plans-service'

  # PostgreSQL monitoring (if postgres_exporter is added)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']

  # Redis monitoring (if redis_exporter is added)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']

  # BIA Service (ISO 22301 Clause 8.2.2)
  - job_name: 'bia-service'
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['bia-service:8012']
        labels:
          service: 'bia-service'
          iso_clause: '8.2.2'
          component: 'bcm-bia'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'bia-service'

  # Compliance Service (ISO 22301 Clauses 9.2, 10.1, 10.2)
  - job_name: 'compliance-service'
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['compliance-service:8014']
        labels:
          service: 'compliance-service'
          iso_clause: '9.2,10.1,10.2'
          component: 'bcm-compliance'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'compliance-service'

  # Centralized Monitoring Service (aggregates all platform metrics)
  - job_name: 'monitoring-service'
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['monitoring-service:8045']
        labels:
          service: 'monitoring-service'
          component: 'observability'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'monitoring-service'

  # EventBus monitoring
  - job_name: 'eventbus'
    scrape_interval: 30s
    static_configs:
      - targets: ['eventbus:8001']
        labels:
          service: 'eventbus'
          component: 'messaging'

  # ============================================================================
  # NEW SERVICES - Learning & Governance & Community
  # ============================================================================

  # Learning Service (ISO 22301 Clause 7.2 - Competence)
  - job_name: 'learning-service'
    scrape_interval: 10s
