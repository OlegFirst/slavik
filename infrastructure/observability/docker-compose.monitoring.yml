version: '3.8'

services:
  # Prometheus monitoring server with auto-discovery support
  # Auto-discovery mechanisms:
  # 1. Docker SD: Discovers containers via Docker socket with prometheus.scrape=true label
  # 2. File SD: Reads service discovery configs from sd_configs directory
  # 3. DNS SD: Discovers services via DNS records in bcm-network
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: bcm-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    ports:
      - "9090:9090"
    environment:
      # Enable auto-discovery for dynamic service registration
      - PROMETHEUS_ENABLE_SD=true
    volumes:
      # Main unified configuration file (updated by Agent 1)
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Alert rules directory
      - ./config/prometheus/rules:/etc/prometheus/rules:ro
      # Service discovery configs directory for file-based SD
      - ./config/prometheus/sd_configs:/etc/prometheus/sd_configs:ro
      # Docker socket for Docker service discovery
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Persistent storage for metrics data
      - prometheus_data:/prometheus
    networks:
      - monitoring-network
      - bcm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      # Service discovery labels for Prometheus itself
      - "prometheus.scrape=true"
      - "prometheus.port=9090"
      - "prometheus.path=/metrics"

  # Grafana dashboards and visualization
  grafana:
    image: grafana/grafana-oss:10.2.0
    container_name: bcm-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
      - GF_SECURITY_SECRET_KEY=${GRAFANA_SECRET_KEY:-bcm_grafana_secret}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_ALLOW_ORG_CREATE=false
      - GF_USERS_AUTO_ASSIGN_ORG=true
      - GF_USERS_AUTO_ASSIGN_ORG_ID=1
      - GF_USERS_AUTO_ASSIGN_ORG_ROLE=Viewer
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_DATABASE_TYPE=postgres
      - GF_DATABASE_HOST=grafana-postgres:5432
      - GF_DATABASE_NAME=grafana
      - GF_DATABASE_USER=grafana
      - GF_DATABASE_PASSWORD=${GRAFANA_DB_PASSWORD:-grafana_secure_pass}
      - GF_DATABASE_SSL_MODE=disable
      - GF_SESSION_PROVIDER=postgres
      - GF_SESSION_PROVIDER_CONFIG=user=grafana password=${GRAFANA_DB_PASSWORD:-grafana_secure_pass} host=grafana-postgres port=5432 dbname=grafana sslmode=disable
      # BCM Platform branding
      - GF_BRANDING_TITLE="BCM Platform Monitoring"
      - GF_BRANDING_FOOTER_TEXT="Business Continuity Management Platform"
      - 'GF_BRANDING_FOOTER_LINKS=[{"text": "BCM Platform", "url": "http://localhost:8069"}]'
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./config/grafana/plugins:/var/lib/grafana/plugins
    networks:
      - monitoring-network
      - bcm-network
    depends_on:
      - prometheus
      - grafana-postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL for Grafana metadata
  grafana-postgres:
    image: postgres:15-alpine
    container_name: grafana-postgres
    environment:
      POSTGRES_DB: grafana
      POSTGRES_USER: grafana
      POSTGRES_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana_secure_pass}
    volumes:
      - grafana_postgres_data:/var/lib/postgresql/data
    networks:
      - monitoring-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grafana -d grafana"]
      interval: 30s
      timeout: 10s
      retries: 5

  # AlertManager for alert routing
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: bcm-alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    ports:
      - "9093:9093"
    volumes:
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./config/alertmanager/templates:/etc/alertmanager/templates:ro
      - alertmanager_data:/alertmanager
    networks:
      - monitoring-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Node Exporter for system metrics
  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: bcm-node-exporter
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitoring-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      # Service discovery labels for automatic scraping
      - "prometheus.scrape=true"
      - "prometheus.port=9100"
      - "prometheus.path=/metrics"
      - "prometheus.job=node-exporter"

  # cAdvisor for container metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: bcm-cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring-network
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      # Service discovery labels for automatic scraping
      - "prometheus.scrape=true"
      - "prometheus.port=8080"
      - "prometheus.path=/metrics"
      - "prometheus.job=cadvisor"

  # Blackbox Exporter for endpoint monitoring
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.24.0
    container_name: bcm-blackbox-exporter
    ports:
      - "9115:9115"
    volumes:
      - ./config/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - monitoring-network
      - bcm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9115/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      # Service discovery labels for automatic scraping
      - "prometheus.scrape=true"
      - "prometheus.port=9115"
      - "prometheus.path=/metrics"
      - "prometheus.job=blackbox-exporter"

  # Postgres Exporter for BCM Platform database metrics
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.14.0
    container_name: bcm-postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://${BCM_DB_USER:-odoo}:${BCM_DB_PASSWORD:-odoo}@${BCM_DB_HOST:-bcm-postgres}:5432/${BCM_DB_NAME:-bcm_platform}?sslmode=disable
    ports:
      - "9187:9187"
    networks:
      - monitoring-network
      - bcm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9187/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      # Service discovery labels for automatic scraping
      - "prometheus.scrape=true"
      - "prometheus.port=9187"
      - "prometheus.path=/metrics"
      - "prometheus.job=postgres-exporter"

  # Redis Exporter for caching metrics
  redis-exporter:
    image: oliver006/redis_exporter:v1.54.0
    container_name: bcm-redis-exporter
    environment:
      REDIS_ADDR: ${BCM_REDIS_HOST:-bcm-redis}:${BCM_REDIS_PORT:-6379}
      REDIS_PASSWORD: ${BCM_REDIS_PASSWORD:-}
    ports:
      - "9121:9121"
    networks:
      - monitoring-network
      - bcm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9121/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      # Service discovery labels for automatic scraping
      - "prometheus.scrape=true"
      - "prometheus.port=9121"
      - "prometheus.path=/metrics"
      - "prometheus.job=redis-exporter"

  # Loki for log aggregation
  loki:
    image: grafana/loki:2.9.2
    container_name: bcm-loki
    ports:
      - "3100:3100"
    volumes:
      - ./config/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - monitoring-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Promtail for log collection
  promtail:
    image: grafana/promtail:2.9.2
    container_name: bcm-promtail
    volumes:
      - ./config/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - monitoring-network
    depends_on:
      - loki
    restart: unless-stopped

  # Notification Service - Multi-channel notifications for BCM Platform
  notification-service:
    build:
      context: ../notification-service
      dockerfile: Dockerfile
    container_name: bcm-notification-service
    ports:
      - "8035:8035"
    environment:
      # Service config
      - PORT=8035
      - LOG_LEVEL=INFO
      - NOTIFICATIONS_ENABLED=true

      # Supabase (PostgreSQL)
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}

      # Redis
      - REDIS_URL=${REDIS_URL}

      # RabbitMQ (optional)
      - RABBITMQ_URL=${RABBITMQ_URL:-}

      # SMTP Email
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@bcm-platform.com}

      # Notification recipients
      - COMPLIANCE_OFFICERS_EMAILS=${COMPLIANCE_OFFICERS_EMAILS:-}
      - AUDIT_TEAM_EMAILS=${AUDIT_TEAM_EMAILS:-}

      # External integrations (optional)
      - TEAMS_ENABLED=false
      - TEAMS_WEBHOOK_URL=${TEAMS_WEBHOOK_URL:-}
      - SLACK_ENABLED=false
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - SMS_ENABLED=false
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
      - PAGERDUTY_ENABLED=false
      - PAGERDUTY_INTEGRATION_KEY=${PAGERDUTY_INTEGRATION_KEY:-}
    networks:
      - monitoring-network
      - bcm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8035/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      # Service discovery labels for automatic scraping
      - "prometheus.scrape=true"
      - "prometheus.port=8035"
      - "prometheus.path=/metrics"
      - "prometheus.job=notification-service"
      - "service.type=platform"
      - "service.criticality=high"
      - "iso.clauses=7.4"

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  grafana_postgres_data:
    driver: local
  alertmanager_data:
    driver: local
  loki_data:
    driver: local

networks:
  monitoring-network:
    driver: bridge
    name: monitoring-network
  bcm-network:
    external: true
    name: bcm-network
