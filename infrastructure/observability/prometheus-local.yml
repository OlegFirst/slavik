global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Monitoring Backend metrics
  - job_name: 'monitoring_backend'
    static_configs:
      - targets: ['host.docker.internal:8050']
    metrics_path: '/metrics'

  # AI Orchestrator (if running)
  - job_name: 'ai_orchestrator'
    static_configs:
      - targets: ['host.docker.internal:8000']
    metrics_path: '/metrics'

  # Workflow Intelligence (if running)
  - job_name: 'workflow_intelligence'
    static_configs:
      - targets: ['host.docker.internal:8003']
    metrics_path: '/metrics'

  # Community Intelligence (if running)
  - job_name: 'community_intelligence'
    static_configs:
      - targets: ['host.docker.internal:8004']
    metrics_path: '/metrics'
