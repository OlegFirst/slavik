# Grafana Datasource Configuration for Prometheus
# This file can be used to provision Prometheus as a datasource in Grafana

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      queryTimeout: 60s
      # Enable Prometheus metrics browser
      prometheusType: Prometheus
      prometheusVersion: 2.40.0
      # Cache settings
      cacheLevel: High
      incrementalQuerying: true
      incrementalQueryOverlapWindow: 10m
      # Alert manager integration
      manageAlerts: true
      # Custom query parameters
      customQueryParameters: ""
    # Basic auth (if needed)
    # basicAuth: false
    # basicAuthUser: admin
    # secureJsonData:
    #   basicAuthPassword: password
