# BCM Planning Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: planning-service
  namespace: bcm-platform
  labels:
    app: planning-service
    component: bcm-service
    platform: bcm
    iso-clause: "8.3"
  annotations:
    description: "BCM Planning"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: planning-service
  template:
    metadata:
      labels:
        app: planning-service
        component: bcm-service
        platform: bcm
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8050"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      initContainers:
      - name: wait-for-database
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z postgres-service 5432; do echo waiting for database; sleep 2; done;']

      containers:
      - name: planning
        image: ghcr.io/seh-foundation/ai-platform-iso/planning-service:v2.0.0
        imagePullPolicy: Always

        ports:
        - name: http
          containerPort: 8050
          protocol: TCP

        env:
        - name: PORT
          value: "8050"
        - name: ENVIRONMENT
          value: "production"
        - name: LOG_LEVEL
          value: "INFO"

        # Database
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: bcm-secrets
              key: database-url

        # Redis
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: bcm-secrets
              key: redis-url

        # Platform Integration
        - name: PLATFORM_INTEGRATION_ENABLED
          value: "true"

        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"

        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30

        volumeMounts:
        - name: logs
          mountPath: /app/logs

      volumes:
      - name: logs
        emptyDir: {}

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - planning-service
              topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: planning-service
  namespace: bcm-platform
  labels:
    app: planning-service
    component: bcm-service
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8050
    targetPort: http
    protocol: TCP
  selector:
    app: planning-service
  sessionAffinity: ClientIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: planning-service-hpa
  namespace: bcm-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: planning-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
