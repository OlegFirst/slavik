# BCM Services Deployment Template
# This file defines deployments for all 11 BCM services with Platform Integration
---
# 1. BIA Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bia-service
  namespace: bcm-platform
  labels:
    app: bia-service
    component: bcm-service
    platform: bcm
    iso-clause: "8.2.2"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bia-service
  template:
    metadata:
      labels:
        app: bia-service
        component: bcm-service
        platform: bcm
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8020"
    spec:
      containers:
      - name: bia
        image: ghcr.io/seh-foundation/ai-platform-iso/bia-service:v2.0.0
        ports:
        - containerPort: 8020
        env:
        - name: PORT
          value: "8020"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: bcm-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: bcm-secrets
              key: redis-url
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8020
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8020
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: bia-service
  namespace: bcm-platform
spec:
  type: ClusterIP
  ports:
  - port: 8020
    targetPort: 8020
  selector:
    app: bia-service

