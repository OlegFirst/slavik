# Infrastructure Governance Policies
# ==================================
#
# This file defines all governance policies for infrastructure coordination.
# All thresholds, limits, and rules are centralized here instead of being
# hardcoded in Python.
#
# Version: 1.0
# Last Updated: 2025-10-09
# Approved By: system_architect
#
# Policy Sections:
# 1. Recovery Policies - Service recovery and resilience
# 2. Optimization Policies - Resource optimization thresholds and actions
# 3. Monitoring Policies - Health check and monitoring intervals
# 4. Compliance Policies - Audit and regulatory requirements
# 5. Notification Policies - Alert channels and escalation

version: "1.0"
updated: "2025-10-09"
approved_by: "system_architect"

infrastructure_policies:

  # ============================================================================
  # RECOVERY POLICIES
  # ============================================================================
  # Define how services should be recovered when they fail

  recovery:
    # Default policy for services without specific configurations
    default:
      max_auto_attempts: 3
      escalation_timeout_seconds: 300  # 5 minutes
      backoff_seconds: 5
      require_approval_after_attempts: 2

    # Service-specific recovery policies
    by_service:

      # Database (PostgreSQL/Supabase) - CRITICAL
      database:
        priority: 1  # Critical
        rto_seconds: 120  # 2 minutes
        rpo_seconds: 300  # 5 minutes
        max_auto_attempts: 2
        escalate_immediately: false
        recovery_strategy: "circuit_breaker"
        notify_teams: ["ops", "dba"]
        require_approval: true

      # EventBus (RabbitMQ) - CRITICAL
      eventbus:
        priority: 1  # Critical
        rto_seconds: 60  # 1 minute
        rpo_seconds: 0  # No data loss acceptable
        max_auto_attempts: 3
        escalate_immediately: true
        recovery_strategy: "restart"
        notify_teams: ["ops", "platform"]
        require_approval: false

      # API Gateway - HIGH PRIORITY
      api_gateway:
        priority: 2  # High
        rto_seconds: 120  # 2 minutes
        max_auto_attempts: 3
        escalate_immediately: false
        recovery_strategy: "restart"
        notify_teams: ["ops"]
        require_approval: false

      # Redis Cache - HIGH PRIORITY
      redis:
        priority: 2  # High
        rto_seconds: 180  # 3 minutes
        max_auto_attempts: 3
        escalate_immediately: false
        recovery_strategy: "restart"
        notify_teams: ["ops"]
        require_approval: false

      # RAG Pipeline - MEDIUM PRIORITY
      rag_pipeline:
        priority: 3  # Medium
        rto_seconds: 300  # 5 minutes
        max_auto_attempts: 2
        escalate_immediately: false
        recovery_strategy: "restart"
        notify_teams: ["ai_team"]
        require_approval: false

      # Workflow Intelligence - HIGH PRIORITY
      workflow_intelligence:
        priority: 2  # High
        rto_seconds: 180  # 3 minutes
        max_auto_attempts: 3
        escalate_immediately: false
        recovery_strategy: "restart"
        notify_teams: ["ops", "platform"]
        require_approval: false

      # Expertise Center - MEDIUM PRIORITY
      expertise_center:
        priority: 3  # Medium
        rto_seconds: 300  # 5 minutes
        max_auto_attempts: 2
        escalate_immediately: false
        recovery_strategy: "restart"
        notify_teams: ["ai_team"]
        require_approval: false

      # MIO Manager - HIGH PRIORITY
      mio_manager:
        priority: 2  # High
        rto_seconds: 120  # 2 minutes
        max_auto_attempts: 3
        escalate_immediately: false
        recovery_strategy: "restart"
        notify_teams: ["ops", "platform"]
        require_approval: false

      # Monitoring Service - CRITICAL
      monitoring:
        priority: 1  # Critical
        rto_seconds: 90  # 1.5 minutes
        max_auto_attempts: 3
        escalate_immediately: true
        recovery_strategy: "restart"
        notify_teams: ["ops"]
        require_approval: false

      # Notification Service - HIGH PRIORITY
      notification_service:
        priority: 2  # High
        rto_seconds: 120  # 2 minutes
        max_auto_attempts: 3
        escalate_immediately: false
        recovery_strategy: "restart"
        notify_teams: ["ops"]
        require_approval: false

      # Living Docs - LOW PRIORITY
      living_docs:
        priority: 4  # Low
        rto_seconds: 600  # 10 minutes
        max_auto_attempts: 2
        escalate_immediately: false
        recovery_strategy: "restart"
        notify_teams: ["ops"]
        require_approval: false

      # Simulation Services - MEDIUM PRIORITY
      simulation:
        priority: 3  # Medium
        rto_seconds: 300  # 5 minutes
        max_auto_attempts: 2
        escalate_immediately: false
        recovery_strategy: "restart"
        notify_teams: ["ops"]
        require_approval: false

      # Digital Twin - MEDIUM PRIORITY
      digital_twin:
        priority: 3  # Medium
        rto_seconds: 300  # 5 minutes
        max_auto_attempts: 2
        escalate_immediately: false
        recovery_strategy: "restart"
        notify_teams: ["ops"]
        require_approval: false

      # BIA Service - MEDIUM PRIORITY
      bia_service:
        priority: 3  # Medium
        rto_seconds: 240  # 4 minutes
        max_auto_attempts: 3
        escalate_immediately: false
        recovery_strategy: "restart"
        notify_teams: ["ops"]
        require_approval: false

      # Compliance Service - HIGH PRIORITY
      compliance_service:
        priority: 2  # High
        rto_seconds: 180  # 3 minutes
        max_auto_attempts: 3
        escalate_immediately: false
        recovery_strategy: "restart"
        notify_teams: ["ops", "compliance"]
        require_approval: false

      # Governance Service - HIGH PRIORITY
      governance_service:
        priority: 2  # High
        rto_seconds: 180  # 3 minutes
        max_auto_attempts: 3
        escalate_immediately: false
        recovery_strategy: "restart"
        notify_teams: ["ops", "compliance"]
        require_approval: false

  # ============================================================================
  # OPTIMIZATION POLICIES
  # ============================================================================
  # Define resource thresholds and optimization actions

  optimization:
    # Resource thresholds (percentages)
    thresholds:
      cpu:
        normal: 70   # <= 70% is normal
        high: 80     # 71-80% is high
        critical: 90 # > 80% is critical

      memory:
        normal: 75   # <= 75% is normal
        high: 85     # 76-85% is high
        critical: 95 # > 85% is critical

      disk:
        normal: 70   # <= 70% is normal
        high: 80     # 71-80% is high
        critical: 90 # > 80% is critical

    # Action approval requirements and permissions
    actions:
      # Which actions require human approval
      require_approval:
        scale_up: true        # Scaling up costs money
        scale_down: false     # Safe to auto-scale down
        optimize: false       # Safe optimization
        restart: false        # Can auto-restart
        failover: true        # Requires approval
        rollback: true        # Requires approval

      # Actions that can be automatically executed
      auto_execute:
        - "optimize"
        - "restart"
        - "scale_down"

      # Actions that MUST be manual (never auto-execute)
      manual_only:
        - "scale_up"
        - "failover"
        - "rollback"

  # ============================================================================
  # MONITORING POLICIES
  # ============================================================================
  # Define health check intervals and monitoring behavior

  monitoring:
    # Health check intervals (seconds) based on service priority
    intervals:
      critical_services: 30   # Priority 1 services (every 30s)
      normal_services: 60     # Priority 2-3 services (every 60s)
      low_priority: 120       # Priority 4-5 services (every 2m)

    # Health check timeout
    health_check_timeout: 10  # seconds

    # Event publishing strategy
    status_change_only: true  # Only publish events when status changes

  # ============================================================================
  # COMPLIANCE POLICIES
  # ============================================================================
  # Define audit and compliance requirements

  compliance:
    # Audit settings
    audit_enabled: true
    audit_all_decisions: true  # Log all decision-making
    audit_all_actions: true    # Log all actions taken

    # Regulatory compliance
    iso_22301_compliance: true  # Enable ISO 22301 BCM compliance

    # Retention
    log_retention_days: 90  # Keep audit logs for 90 days

    # Justification requirements
    require_justification: true  # Require justification for actions

  # ============================================================================
  # NOTIFICATION POLICIES
  # ============================================================================
  # Define notification channels and escalation paths

  notifications:
    # Notification channels
    channels:
      email:
        enabled: true
        recipients:
          - "ops@example.com"
          - "platform-alerts@example.com"

      slack:
        enabled: false
        webhook_url: ""  # Set via environment variable

      pagerduty:
        enabled: false
        integration_key: ""  # Set via environment variable

    # Escalation levels with delays
    escalation_levels:
      # Level 1: Immediate notification to ops team
      - level: 1
        delay_seconds: 0
        notify:
          - "ops_team"

      # Level 2: Escalate to on-call after 5 minutes
      - level: 2
        delay_seconds: 300  # 5 minutes
        notify:
          - "ops_team"
          - "on_call"

      # Level 3: Escalate to management after 15 minutes
      - level: 3
        delay_seconds: 900  # 15 minutes
        notify:
          - "ops_team"
          - "on_call"
          - "management"

      # Level 4: Full escalation after 30 minutes
      - level: 4
        delay_seconds: 1800  # 30 minutes
        notify:
          - "ops_team"
          - "on_call"
          - "management"
          - "security"

# ============================================================================
# NOTES
# ============================================================================
#
# Editing This File:
# -----------------
# 1. Always update the 'updated' field when making changes
# 2. Increment 'version' for breaking changes
# 3. Validate changes using: policy_validator.validate_file()
# 4. Reload policies without restart using: engine.reload_policies()
#
# Priority Levels:
# ---------------
# 1 = Critical (EventBus, Database, Monitoring)
# 2 = High (API Gateway, MIO Manager, Compliance)
# 3 = Medium (RAG, Expertise Center, BIA)
# 4 = Low (Living Docs)
# 5 = Minimal (Optional services)
#
# Recovery Strategies:
# -------------------
# - restart: Simple service restart
# - circuit_breaker: Circuit breaker pattern with gradual recovery
# - failover: Switch to backup instance
# - rollback: Rollback to previous version
# - manual: Requires manual intervention
#
# ISO 22301 Compliance:
# --------------------
# When iso_22301_compliance is enabled:
# - All decisions are audited
# - All actions are logged
# - Recovery objectives (RTO/RPO) are enforced
# - Justification is required for critical actions
