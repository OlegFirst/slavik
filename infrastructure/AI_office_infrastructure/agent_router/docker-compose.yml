version: '3.8'

services:
  # ============================================================================
  # AI Agent Router Metrics Server
  # ============================================================================
  agent-router-metrics:
    build:
      context: .
      dockerfile: Dockerfile.metrics
    container_name: ai-agent-router-metrics
    ports:
      - "9090:9090"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bcm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================================================
  # Redis (for analytics and caching)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: agent-router-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - bcm-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Prometheus (metrics collection)
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: agent-router-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - bcm-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # Grafana (metrics visualization)
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: agent-router-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - bcm-network

networks:
  bcm-network:
    driver: bridge
    name: bcm-agent-router-network

volumes:
  redis-data:
    name: agent-router-redis-data
  prometheus-data:
    name: agent-router-prometheus-data
  grafana-data:
    name: agent-router-grafana-data
