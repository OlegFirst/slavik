  # Community Marketplace - ISO 22301 Clause 7.1 (Resource Management)
  - job_name: 'community-marketplace'
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['community-marketplace:8024']
        labels:
          service: 'community-marketplace'
          iso_clause: '7.1'
          component: 'bcm-resources'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'community-marketplace'

  # ==========================================================================
  # PLATFORM CORE SERVICES
  # Gateway, orchestration, and workflow management
  # ==========================================================================

  # Intelligent Gateway - API Gateway and routing
  - job_name: 'intelligent-gateway'
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['intelligent-gateway:8000']
        labels:
          service: 'intelligent-gateway'
          component: 'gateway'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'intelligent-gateway'

  # AI Orchestration Service - AI workflow coordination
  - job_name: 'ai-orchestration'
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ai-orchestration:8002']
        labels:
          service: 'ai-orchestration'
          component: 'platform'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'ai-orchestration'

  # BPMN Workflow Service - Business process automation
  - job_name: 'bpmn-workflow'
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['bpmn-workflow:8003']
        labels:
          service: 'bpmn-workflow'
          component: 'platform'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'bpmn-workflow'

  # Coordination Center - Service coordination and orchestration
  - job_name: 'coordination-center'
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['coordination-center:8004']
        labels:
          service: 'coordination-center'
          component: 'platform'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'coordination-center'

  # EventBus - Event-driven messaging
  - job_name: 'eventbus'
    scrape_interval: 30s
    static_configs:
      - targets: ['eventbus:8001']
        labels:
          service: 'eventbus'
          component: 'messaging'

  # Notification Service - Alert and notification delivery
  - job_name: 'notification-service'
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['notification-service:8035']
        labels:
          service: 'notification-service'
          component: 'platform'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'notification-service'

  # ==========================================================================
  # INTELLIGENCE & ANALYTICS
  # AI-powered insights and analytics
  # ==========================================================================

  # Project Intelligence Service - Project analytics
  - job_name: 'project-intelligence'
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['project-intelligence:8025']
        labels:
          service: 'project-intelligence'
          component: 'intelligence'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'project-intelligence'

  # AI Intelligence Service - AI model management
  - job_name: 'ai-intelligence'
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ai-intelligence:8032']
        labels:
          service: 'ai-intelligence'
          component: 'intelligence'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'ai-intelligence'

  # Process Mining Service - Process discovery and optimization
  - job_name: 'process-mining'
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['process-mining:8040']
        labels:
          service: 'process-mining'
          component: 'analytics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'process-mining'

  # Centralized Monitoring Service - Aggregate platform metrics
  - job_name: 'monitoring-service'
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['monitoring-service:8045']
        labels:
          service: 'monitoring-service'
          component: 'observability'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'monitoring-service'

  # ==========================================================================
  # ENDPOINT MONITORING
  # Health and availability checks
  # ==========================================================================

  # Blackbox Exporter - HTTP endpoint health checks
  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          # Observability Stack
          - http://prometheus:9090/-/healthy
          - http://grafana:3000/api/health
          - http://loki:3100/ready
          - http://alertmanager:9093/-/healthy
          # Platform Core
          - http://intelligent-gateway:8000/health
          - http://ai-orchestration:8002/health
          - http://bpmn-workflow:8003/health
          - http://coordination-center:8004/health
          - http://eventbus:8001/health
          # BCM Services
          - http://planning-service:8011/health
          - http://bia-service:8012/health
          - http://compliance-service:8014/health
          - http://learning-service:8021/health
          - http://governance-service:8022/health
          - http://plans-service:8023/health
          - http://documents-service:8024/health
          - http://validation-service:8025/health
          - http://community-portal:8031/health
          - http://community-marketplace:8024/health
          - http://response-service:8041/health
        labels:
          component: 'health-check'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # ==========================================================================
  # SERVICE DISCOVERY - AUTO-DETECTION
  # Automatically discover new services as they are deployed
  # ==========================================================================

  # Docker Service Discovery - Auto-detect Docker containers
  # Discovers all containers with Prometheus metrics exposed
  - job_name: 'docker-service-discovery'
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s
        # Filter for containers with prometheus.io annotations
        filters:
          - name: label
            values: ["prometheus.scrape=true"]
    relabel_configs:
      # Use container name as instance
      - source_labels: [__meta_docker_container_name]
        target_label: instance
        regex: '/(.*)'
        replacement: '$1'
      # Get service name from label
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      # Get component from label
      - source_labels: [__meta_docker_container_label_prometheus_component]
        target_label: component
      # Get ISO clause from label
      - source_labels: [__meta_docker_container_label_prometheus_iso_clause]
        target_label: iso_clause
      # Use custom metrics path if specified
      - source_labels: [__meta_docker_container_label_prometheus_path]
        target_label: __metrics_path__
        regex: (.+)
      # Use custom port if specified
      - source_labels: [__address__, __meta_docker_container_label_prometheus_port]
        target_label: __address__
        regex: '([^:]+)(?::\d+)?;(\d+)'
        replacement: '$1:$2'

  # DNS Service Discovery - Discover services via DNS SRV records
  # Useful for Kubernetes or Consul-based service discovery
  - job_name: 'dns-service-discovery'
    dns_sd_configs:
      - names:
          - '_prometheus._tcp.bcm-services.local'
          - '_metrics._tcp.platform-services.local'
        refresh_interval: 30s
        type: 'SRV'
    relabel_configs:
      # Extract service name from DNS name
      - source_labels: [__meta_dns_name]
        target_label: service
        regex: '([^.]+)\..*'
        replacement: '$1'

  # File-based Service Discovery - External service configuration
  # Allows dynamic updates without restarting Prometheus
  - job_name: 'file-service-discovery'
    file_sd_configs:
      - files:
          - '/etc/prometheus/service-discovery/*.json'
          - '/etc/prometheus/service-discovery/*.yml'
        refresh_interval: 30s
    relabel_configs:
      # Preserve labels from discovered targets
      - source_labels: [__meta_filepath]
        target_label: discovery_file

  # Static External Services - Third-party integrations
  # For external monitoring targets not in Docker/DNS
  - job_name: 'external-services'
    file_sd_configs:
      - files:
          - '/etc/prometheus/external-targets/*.yml'
        refresh_interval: 60s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: component
        replacement: 'external'
