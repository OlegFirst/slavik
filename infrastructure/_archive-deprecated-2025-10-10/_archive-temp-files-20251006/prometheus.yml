        labels:
          service: 'response-service'
          iso_clause: '8.4'
          component: 'bcm-response'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'response-service'

  # Learning Service - ISO 22301 Clause 7.2 (Competence)
  - job_name: 'learning-service'
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['learning-service:8021']
        labels:
          service: 'learning-service'
          iso_clause: '7.2'
          component: 'bcm-competence'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'learning-service'

  # Governance Service - ISO 22301 Clause 5.3, 7.1, 7.3 (Leadership & Resources)
  - job_name: 'governance-service'
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['governance-service:8022']
        labels:
          service: 'governance-service'
          iso_clause: '5.3,7.1,7.3'
          component: 'bcm-governance'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'governance-service'

  # ==========================================================================
  # COMMUNITY SERVICES
  # Collaboration and resource sharing
  # ==========================================================================

  # Community Portal - ISO 22301 Clause 7.4 (Communication)
  - job_name: 'community-portal'
    scrape_interval: 10s
    scrape_timeout: 5s
