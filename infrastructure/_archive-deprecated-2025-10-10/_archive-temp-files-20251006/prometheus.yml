        labels:
          service: 'compliance-service'
          iso_clause: '9.2,10.1,10.2'
          component: 'bcm-compliance'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'compliance-service'

  # Validation Service - ISO 22301 Clause 8.5 (Exercising & Testing)
  - job_name: 'validation-service'
    scrape_interval: 10s
