# ============================================================================
# UNIFIED PROMETHEUS CONFIGURATION
# Merged from infrastructure and platform-services monitoring
# Created: 2025-10-03
# ============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'bcm-unified'
    environment: 'production'

# ============================================================================
# ALERTMANAGER CONFIGURATION
# ============================================================================
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# ============================================================================
# RULE FILES
# Alert rules for monitoring thresholds and SLA compliance
# ============================================================================
rule_files:
  - "/etc/prometheus/alerts/*.yml"

# ============================================================================
# SCRAPE CONFIGURATIONS
# ============================================================================
scrape_configs:

  # ==========================================================================
  # OBSERVABILITY STACK
  # Core monitoring infrastructure components
  # ==========================================================================

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          component: 'observability'

  # Grafana visualization platform
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          service: 'grafana'
          component: 'observability'
    metrics_path: '/metrics'

  # Loki log aggregation
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
        labels:
          service: 'loki'
          component: 'observability'
    metrics_path: '/metrics'

  # Alertmanager alert routing
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
        labels:
          service: 'alertmanager'
          component: 'observability'
    metrics_path: '/metrics'

  # ==========================================================================
  # SYSTEM METRICS
  # Infrastructure and container monitoring
  # ==========================================================================

  # Node Exporter - System and hardware metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'
          component: 'observability'

  # cAdvisor - Container resource usage and performance
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisor'
          component: 'observability'
    metrics_path: '/metrics'

  # ==========================================================================
  # DATABASE & CACHE
  # Data persistence layer monitoring
  # ==========================================================================

  # PostgreSQL Exporter - Database performance and health
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'
          component: 'database'

  # Redis Exporter - Cache performance and hit rates
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
          component: 'cache'

  # ==========================================================================
  # BCM PLATFORM SERVICES - ISO 22301 COMPLIANCE
  # Business Continuity Management application services
  # ==========================================================================

  # Planning Service - ISO 22301 Clause 8.3 (BC Strategy)
  - job_name: 'planning-service'
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['planning-service:8011']
        labels:
          service: 'planning-service'
          iso_clause: '8.3'
          component: 'bcm-strategy'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'planning-service'

  # Plans Service - ISO 22301 Clause 8.4 (BC Plans & Procedures)
  - job_name: 'plans-service'
    scrape_interval: 10s
    scrape_timeout: 5s
