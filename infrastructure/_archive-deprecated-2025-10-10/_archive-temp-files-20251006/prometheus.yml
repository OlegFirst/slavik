      - targets: ['bia-service:8012']
        labels:
          service: 'bia-service'
          iso_clause: '8.2.2'
          component: 'bcm-bia'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'bia-service'

  # Compliance Service - ISO 22301 Clause 9.2, 10.1, 10.2 (Audit & Improvement)
  - job_name: 'compliance-service'
