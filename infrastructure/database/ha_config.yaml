# Database High Availability Configuration
# AI Platform ISO 22301 - Production Ready
# Version: 1.0.0
# Created: 2025-10-24

---
# =========================================================================
# PostgreSQL High Availability (via Supabase)
# =========================================================================
postgresql:
  provider: supabase

  # Primary Configuration
  primary:
    host: ${SUPABASE_HOST}
    port: 5432
    database: ${SUPABASE_DB}
    ssl_mode: require

  # High Availability Settings
  ha:
    enabled: true
    mode: automatic_failover

    # Point-in-Time Recovery
    pitr:
      enabled: true
      retention_days: 30
      backup_schedule: "0 2 * * *"  # Daily at 2 AM

    # Read Replicas for Scaling
    read_replicas:
      enabled: true
      count: 2
      regions:
        - us-east-1
        - eu-west-1
      load_balancing: round_robin

    # Connection Pooling
    pooling:
      mode: transaction  # pgBouncer transaction mode
      pool_size: 20
      max_client_conn: 100
      default_pool_size: 20
      reserve_pool_size: 5

  # Failover Configuration
  failover:
    detection_timeout: 10s
    promotion_timeout: 30s
    automatic: true
    health_check_interval: 5s

  # Monitoring
  monitoring:
    enabled: true
    metrics:
      - connection_count
      - query_duration
      - replication_lag
      - transaction_rate
    alerts:
      - replication_lag > 5s
      - connection_count > 80
      - query_duration_p95 > 1s

---
# =========================================================================
# Redis High Availability (Sentinel)
# =========================================================================
redis:
  # Sentinel Configuration
  sentinel:
    enabled: true
    master_name: bcm-master

    # Sentinel Instances (минимум 3 для quorum)
    sentinels:
      - host: redis-sentinel-1
        port: 26379
      - host: redis-sentinel-2
        port: 26379
      - host: redis-sentinel-3
        port: 26379

    # Quorum Configuration
    quorum: 2  # Минимум 2 sentinel должны agree на failover
    down_after_milliseconds: 5000
    failover_timeout: 60000
    parallel_syncs: 1

  # Redis Instances
  instances:
    # Master
    master:
      host: redis-master
      port: 6379
      maxmemory: 4gb
      maxmemory_policy: allkeys-lru

    # Replicas
    replicas:
      - host: redis-replica-1
        port: 6379
        replicaof: redis-master 6379
      - host: redis-replica-2
        port: 6379
        replicaof: redis-master 6379

  # Persistence Configuration
  persistence:
    # AOF (Append-Only File) для durability
    aof:
      enabled: true
      fsync: everysec  # Balance между performance и durability
      auto_aof_rewrite_percentage: 100
      auto_aof_rewrite_min_size: 64mb

    # RDB Snapshots для быстрого recovery
    rdb:
      enabled: true
      save_rules:
        - "900 1"    # После 900s если хотя бы 1 ключ изменился
        - "300 10"   # После 300s если хотя бы 10 ключей изменились
        - "60 10000" # После 60s если хотя бы 10000 ключей изменились

  # Connection Settings
  connection:
    pool_size: 50
    max_connections: 10000
    timeout: 5s
    retry_on_timeout: true
    retry_max_attempts: 3
    retry_backoff: exponential

  # Monitoring
  monitoring:
    enabled: true
    metrics:
      - memory_usage
      - keyspace_hits_ratio
      - evicted_keys
      - connected_clients
      - replication_offset
    alerts:
      - memory_usage > 90%
      - keyspace_hits_ratio < 0.8
      - replication_lag > 1000

---
# =========================================================================
# Qdrant Vector Database High Availability
# =========================================================================
qdrant:
  # Cluster Configuration
  cluster:
    enabled: true
    nodes: 3  # Минимум 3 ноды для HA

    # Node Configuration
    node_1:
      host: qdrant-node-1
      port: 6333
      grpc_port: 6334
    node_2:
      host: qdrant-node-2
      port: 6333
      grpc_port: 6334
    node_3:
      host: qdrant-node-3
      port: 6333
      grpc_port: 6334

  # Replication Configuration
  replication:
    factor: 2  # Каждый shard реплицируется на 2 ноды
    write_consistency_factor: 2  # Минимум 2 ноды должны подтвердить write

  # Sharding Configuration
  sharding:
    number_of_shards: 3
    replication_factor: 2

  # Storage Configuration
  storage:
    # Persistent storage
    on_disk:
      enabled: true
      path: /var/lib/qdrant/storage

    # Write-ahead log для durability
    wal:
      enabled: true
      wal_capacity_mb: 32

    # Snapshots для backup
    snapshots:
      enabled: true
      path: /var/lib/qdrant/snapshots
      schedule: "0 3 * * *"  # Daily at 3 AM

  # Performance Tuning
  performance:
    # HNSW Index settings для vector search
    hnsw:
      m: 16  # Number of bi-directional links
      ef_construct: 100  # Size of the dynamic candidate list

    # Quantization для memory efficiency
    quantization:
      enabled: true
      type: scalar  # или binary для большей compression

  # Connection Settings
  connection:
    timeout: 30s
    keepalive_interval: 60s
    max_retries: 3

  # Monitoring
  monitoring:
    enabled: true
    metrics:
      - vector_count
      - search_latency_p95
      - index_size
      - memory_usage
      - disk_usage
    alerts:
      - search_latency_p95 > 500ms
      - memory_usage > 85%
      - disk_usage > 80%

---
# =========================================================================
# Health Checks & Monitoring
# =========================================================================
health_checks:
  # Global Settings
  global:
    enabled: true
    interval: 30s
    timeout: 5s

  # PostgreSQL Health Check
  postgresql:
    query: "SELECT 1"
    expected_result: 1
    max_response_time: 100ms

  # Redis Health Check
  redis:
    command: "PING"
    expected_result: "PONG"
    max_response_time: 10ms

  # Qdrant Health Check
  qdrant:
    endpoint: "/health"
    expected_status: 200
    max_response_time: 100ms

# =========================================================================
# Disaster Recovery
# =========================================================================
disaster_recovery:
  # Backup Strategy
  backups:
    postgresql:
      full_backup_schedule: "0 1 * * 0"  # Weekly full backup (Sunday 1 AM)
      incremental_schedule: "0 1 * * 1-6"  # Daily incremental
      retention_days: 30
      storage_location: s3://bcm-platform-backups/postgresql/

    redis:
      snapshot_schedule: "0 */6 * * *"  # Every 6 hours
      retention_days: 7
      storage_location: s3://bcm-platform-backups/redis/

    qdrant:
      snapshot_schedule: "0 2 * * *"  # Daily at 2 AM
      retention_days: 14
      storage_location: s3://bcm-platform-backups/qdrant/

  # Recovery Time Objectives
  rto:
    postgresql: 5min  # Recovery Time Objective
    redis: 2min
    qdrant: 3min

  # Recovery Point Objectives
  rpo:
    postgresql: 5min  # Maximum acceptable data loss
    redis: 1min
    qdrant: 1hour

---
# =========================================================================
# Deployment Configuration
# =========================================================================
deployment:
  # Kubernetes Resources
  kubernetes:
    postgresql:
      operator: supabase  # Managed by Supabase

    redis:
      operator: redis-operator
      resources:
        master:
          cpu: 2
          memory: 4Gi
          storage: 50Gi
        replica:
          cpu: 1
          memory: 2Gi
          storage: 50Gi
        sentinel:
          cpu: 0.5
          memory: 512Mi

    qdrant:
      resources:
        per_node:
          cpu: 4
          memory: 8Gi
          storage: 100Gi
          storage_class: fast-ssd

  # Auto-scaling
  autoscaling:
    postgresql:
      read_replicas:
        min: 2
        max: 5
        target_cpu: 70%

    redis:
      replicas:
        min: 2
        max: 4
        target_memory: 80%

    qdrant:
      nodes:
        min: 3
        max: 6
        target_cpu: 75%

---
# =========================================================================
# Security Configuration
# =========================================================================
security:
  # Encryption
  encryption:
    at_rest: true
    in_transit: true
    tls_version: "1.3"

  # Authentication
  authentication:
    postgresql:
      method: scram-sha-256
      require_ssl: true

    redis:
      requirepass: true
      acl_enabled: true

    qdrant:
      api_key_required: true

  # Network Security
  network:
    postgresql:
      allowed_cidrs:
        - 10.0.0.0/8  # Internal network only
    redis:
      allowed_cidrs:
        - 10.0.0.0/8
    qdrant:
      allowed_cidrs:
        - 10.0.0.0/8

---
# End of Database HA Configuration
