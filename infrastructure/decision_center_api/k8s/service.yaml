---
# Ingress for external access (requires Ingress Controller)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: decision-center-ingress
  namespace: decision-center
  labels:
    app: decision-center
  annotations:
    # nginx.ingress.kubernetes.io/rewrite-target: /
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    kubernetes.io/ingress.class: "nginx"
spec:
  # tls:
  #   - hosts:
  #       - decision-center.example.com
  #     secretName: decision-center-tls
  rules:
    - host: decision-center.example.com  # Replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: decision-center-service
                port:
                  number: 8080
