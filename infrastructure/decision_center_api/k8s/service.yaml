apiVersion: v1
kind: Service
metadata:
  name: decision-center-service
  namespace: decision-center
  labels:
    app: decision-center
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: decision-center

---
# Optional: LoadBalancer for external access
# apiVersion: v1
# kind: Service
# metadata:
#   name: decision-center-lb
#   namespace: decision-center
