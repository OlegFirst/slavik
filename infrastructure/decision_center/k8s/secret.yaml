apiVersion: v1
kind: Secret
metadata:
  name: decision-center-secrets
  namespace: decision-center
  labels:
    app: decision-center
type: Opaque
stringData:
  # IMPORTANT: Replace these with actual values before deployment
  # For production, use external secret management (e.g., Vault, AWS Secrets Manager)

  POSTGRES_PASSWORD: "change_me_in_production"
  REDIS_PASSWORD: ""

  # Get your API key from: https://console.anthropic.com/
  ANTHROPIC_API_KEY: "sk-ant-api03-YOUR_KEY_HERE"

  # Grafana credentials
  GRAFANA_USER: "admin"
  GRAFANA_PASSWORD: "admin"

---
