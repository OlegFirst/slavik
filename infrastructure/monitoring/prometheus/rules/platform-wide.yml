  # ============================================================================
  # PLATFORM-WIDE AGGREGATE ALERTS
  # ============================================================================

  - name: platform_aggregates
    interval: 1m
    rules:
      - alert: PlatformHighTotalErrors
        expr: |
          sum(rate(http_requests_total{
            job=~"planning-service|plans-service|bia-service|compliance-service|risk-service|response-service|validation-service|documents-service|learning-service|governance-service|file-service|community-service",
            status=~"5.."
          }[5m])) > 5.0
        for: 5m
        labels:
          severity: warning
          component: platform
        annotations:
          summary: "Platform-wide high error rate"
          description: "Total platform errors: {{ $value }} errors/sec across all services"

      - alert: PlatformCriticalTotalErrors
        expr: |
          sum(rate(http_requests_total{
            job=~"planning-service|plans-service|bia-service|compliance-service|risk-service|response-service|validation-service|documents-service|learning-service|governance-service|file-service|community-service",
            status=~"5.."
          }[5m])) > 20.0
        for: 2m
        labels:
          severity: critical
          component: platform
        annotations:
          summary: "CRITICAL: Platform-wide error storm"
          description: "Total platform errors: {{ $value }} errors/sec - possible cascading failure"

      - alert: PlatformLowAvailability
        expr: |
          (count(up{job=~"planning-service|plans-service|bia-service|compliance-service|risk-service|response-service|validation-service|documents-service|learning-service|governance-service|file-service|community-service"} == 1) /
          count(up{job=~"planning-service|plans-service|bia-service|compliance-service|risk-service|response-service|validation-service|documents-service|learning-service|governance-service|file-service|community-service"})) < 0.75
        for: 5m
        labels:
          severity: critical
          component: platform
        annotations:
          summary: "CRITICAL: Platform availability below 75%"
          description: "Only {{ $value | humanizePercentage }} of services are available"

      - alert: PlatformHighRequestRate
        expr: |
          sum(rate(http_requests_total{
            job=~"planning-service|plans-service|bia-service|compliance-service|risk-service|response-service|validation-service|documents-service|learning-service|governance-service|file-service|community-service"
          }[5m])) > 1000
        for: 10m
        labels:
          severity: info
          component: platform
        annotations:
          summary: "Platform experiencing high load"
          description: "Total request rate: {{ $value }} req/sec across all services"

  # ============================================================================
  # RECORDING RULES FOR PLATFORM METRICS
  # ============================================================================

  - name: platform_recording
    interval: 30s
    rules:
      # Overall platform health score (0-1)
      - record: platform:health_score:now
        expr: |
          count(up{job=~"planning-service|plans-service|bia-service|compliance-service|risk-service|response-service|validation-service|documents-service|learning-service|governance-service|file-service|community-service"} == 1) /
          count(up{job=~"planning-service|plans-service|bia-service|compliance-service|risk-service|response-service|validation-service|documents-service|learning-service|governance-service|file-service|community-service"})

      # Platform-wide error rate
      - record: platform:error_rate:5m
        expr: |
          sum(rate(http_requests_total{
            job=~"planning-service|plans-service|bia-service|compliance-service|risk-service|response-service|validation-service|documents-service|learning-service|governance-service|file-service|community-service",
            status=~"5.."
          }[5m])) /
          sum(rate(http_requests_total{
            job=~"planning-service|plans-service|bia-service|compliance-service|risk-service|response-service|validation-service|documents-service|learning-service|governance-service|file-service|community-service"
          }[5m]))

      # Platform-wide request rate
      - record: platform:request_rate:5m
        expr: |
          sum(rate(http_requests_total{
            job=~"planning-service|plans-service|bia-service|compliance-service|risk-service|response-service|validation-service|documents-service|learning-service|governance-service|file-service|community-service"
          }[5m]))

      # Platform-wide P95 latency
      - record: platform:latency_p95:5m
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket{
              job=~"planning-service|plans-service|bia-service|compliance-service|risk-service|response-service|validation-service|documents-service|learning-service|governance-service|file-service|community-service"
            }[5m])) by (le)
          )

      # Platform-wide P99 latency
      - record: platform:latency_p99:5m
        expr: |
          histogram_quantile(0.99,
            sum(rate(http_request_duration_seconds_bucket{
              job=~"planning-service|plans-service|bia-service|compliance-service|risk-service|response-service|validation-service|documents-service|learning-service|governance-service|file-service|community-service"
            }[5m])) by (le)
          )

      # Per-service error rate
      - record: service:error_rate:5m
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m])) by (job) /
          sum(rate(http_requests_total[5m])) by (job)

      # Per-service request rate
      - record: service:request_rate:5m
        expr: |
          sum(rate(http_requests_total[5m])) by (job)

      # Per-service P95 latency
      - record: service:latency_p95:5m
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (job, le)
          )
