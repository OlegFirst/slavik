groups:
  # ============================================================================
  # PLATFORM-WIDE HEALTH ALERTS - ALL 12 SERVICES
  # ============================================================================

  - name: platform_health
    interval: 30s
    rules:
      # Individual service health alerts
      - alert: PlanningServiceDown
        expr: up{job="planning-service"} == 0
        for: 1m
        labels:
          severity: critical
          service: planning
          component: platform
        annotations:
          summary: "Planning Service is DOWN"
          description: "Planning service has been unavailable for 1 minute"

      - alert: PlansServiceDown
        expr: up{job="plans-service"} == 0
        for: 1m
        labels:
          severity: critical
          service: plans
          component: platform
        annotations:
          summary: "Plans Service is DOWN"
          description: "Plans service has been unavailable for 1 minute"

      - alert: BIAServiceDown
        expr: up{job="bia-service"} == 0
        for: 1m
        labels:
          severity: critical
          service: bia
          component: platform
        annotations:
          summary: "BIA Service is DOWN"
          description: "BIA service has been unavailable for 1 minute"

      - alert: ComplianceServiceDown
        expr: up{job="compliance-service"} == 0
        for: 1m
        labels:
          severity: critical
          service: compliance
          component: platform
        annotations:
          summary: "Compliance Service is DOWN"
          description: "Compliance service has been unavailable for 1 minute"

      - alert: RiskServiceDown
        expr: up{job="risk-service"} == 0
        for: 1m
        labels:
          severity: critical
          service: risk
          component: platform
        annotations:
          summary: "Risk Service is DOWN"
          description: "Risk service has been unavailable for 1 minute"

      - alert: ResponseServiceDown
        expr: up{job="response-service"} == 0
        for: 1m
        labels:
          severity: critical
          service: response
          component: platform
        annotations:
          summary: "Response Service is DOWN"
          description: "Response service has been unavailable for 1 minute"

      - alert: ValidationServiceDown
        expr: up{job="validation-service"} == 0
        for: 1m
        labels:
          severity: critical
          service: validation
          component: platform
        annotations:
          summary: "Validation Service is DOWN"
          description: "Validation service has been unavailable for 1 minute"

      - alert: DocumentsServiceDown
        expr: up{job="documents-service"} == 0
        for: 1m
        labels:
          severity: critical
          service: documents
          component: platform
        annotations:
          summary: "Documents Service is DOWN"
          description: "Documents service has been unavailable for 1 minute"

      - alert: LearningServiceDown
        expr: up{job="learning-service"} == 0
        for: 1m
        labels:
          severity: critical
          service: learning
          component: platform
        annotations:
          summary: "Learning Service is DOWN"
          description: "Learning service has been unavailable for 1 minute"

      - alert: GovernanceServiceDown
        expr: up{job="governance-service"} == 0
        for: 1m
        labels:
          severity: critical
          service: governance
          component: platform
        annotations:
          summary: "Governance Service is DOWN"
          description: "Governance service has been unavailable for 1 minute"

      - alert: FileServiceDown
        expr: up{job="file-service"} == 0
        for: 1m
        labels:
          severity: critical
          service: file
          component: platform
        annotations:
          summary: "File Service is DOWN"
          description: "File service has been unavailable for 1 minute"

      - alert: CommunityServiceDown
        expr: up{job="community-service"} == 0
        for: 1m
        labels:
          severity: critical
          service: community
          component: platform
        annotations:
          summary: "Community Service is DOWN"
          description: "Community service has been unavailable for 1 minute"

      # Platform-wide health alert
      - alert: MultipleServicesDown
        expr: |
          count(up{job=~"planning-service|plans-service|bia-service|compliance-service|risk-service|response-service|validation-service|documents-service|learning-service|governance-service|file-service|community-service"} == 0) >= 2
        for: 2m
        labels:
          severity: critical
          component: platform
        annotations:
          summary: "CRITICAL: Multiple platform services are down"
          description: "{{ $value }} services are currently unavailable"

      - alert: PlatformDegraded
        expr: |
          count(up{job=~"planning-service|plans-service|bia-service|compliance-service|risk-service|response-service|validation-service|documents-service|learning-service|governance-service|file-service|community-service"} == 0) == 1
        for: 5m
        labels:
          severity: warning
          component: platform
        annotations:
          summary: "Platform degraded: One service is down"
          description: "Platform is operating with reduced capacity"

  # ============================================================================
  # PER-SERVICE PERFORMANCE ALERTS
  # ============================================================================

  - name: service_performance
    interval: 30s
    rules:
      # Planning Service
      - alert: PlanningServiceHighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="planning-service"}[5m])) > 1.0
        for: 5m
        labels:
          severity: warning
          service: planning
        annotations:
          summary: "Planning Service - High latency"
          description: "P95 latency is {{ $value }}s (threshold: 1s)"

      - alert: PlanningServiceVeryHighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="planning-service"}[5m])) > 3.0
        for: 2m
        labels:
          severity: critical
          service: planning
        annotations:
          summary: "Planning Service - CRITICAL latency"
          description: "P95 latency is {{ $value }}s (threshold: 3s)"

      # Plans Service
      - alert: PlansServiceHighLatency
