  # ============================================================================
  # PER-SERVICE ERROR RATE ALERTS
  # ============================================================================

  - name: service_errors
    interval: 30s
    rules:
      # Planning Service
      - alert: PlanningServiceHighErrorRate
        expr: |
          sum(rate(http_requests_total{job="planning-service", status=~"5.."}[5m])) /
          sum(rate(http_requests_total{job="planning-service"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
          service: planning
        annotations:
          summary: "Planning Service - High error rate"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 5%)"

      - alert: PlanningServiceCriticalErrorRate
        expr: |
          sum(rate(http_requests_total{job="planning-service", status=~"5.."}[5m])) /
          sum(rate(http_requests_total{job="planning-service"}[5m])) > 0.15
