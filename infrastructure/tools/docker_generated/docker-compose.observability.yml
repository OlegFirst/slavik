version: '3.8'
services:
  observability:
    container_name: observability
    build:
      context: infrastructure/observability
      dockerfile: Dockerfile
    ports:
    - 8035:8035
    environment:
    - SERVICE_NAME=observability
    - SERVICE_PORT=8035
    - SCRAPE_INTERVAL=${{var_name}}
    - REDIS_URL=${{var_name}}
    - NOTIFICATION_SERVICE_URL=${{var_name}}
    - SMTP_PORT=${{var_name}}
    - SLACK_BOT_TOKEN=${{var_name}}
    - SLACK_CHANNEL_ALERTS=${{var_name}}
    - PAGERDUTY_INTEGRATION_KEY=${{var_name}}
    - COMPLIANCE_DATA_DIR=${{var_name}}
    - SUPABASE_URL=${{var_name}}
    - SUPABASE_SERVICE_ROLE_KEY=${{var_name}}
    - SMTP_USER=${{var_name}}
    - QDRANT_EXPORTER_PORT=${{var_name}}
    - LOG_LEVEL=${{var_name}}
    - ALERT_EMAIL=${{var_name}}
    - TEAMS_ENABLED=${{var_name}}
    - PAGERDUTY_ENABLED=${{var_name}}
    - SLACK_WEBHOOK_URL=${{var_name}}
    - SMS_ENABLED=${{var_name}}
    - SMTP_PASSWORD=${{var_name}}
    - RABBITMQ_URL=${{var_name}}
    networks:
    - observability-network
    restart: unless-stopped
    healthcheck:
      test: curl -f http://localhost:8035/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  observability-network:
    driver: bridge
volumes: {}
