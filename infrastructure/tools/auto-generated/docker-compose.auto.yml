version: '3.8'
services:
  workflow-engine:
    build: intelligent-core/workflow-engine
    container_name: bcm-workflow-engine
    ports:
    - 9000:9000
    environment:
    - WORKFLOW_API_PORT=${WORKFLOW_API_PORT}
    - DATABASE_URL=${DATABASE_URL}
    networks:
    - bcm-network
    restart: unless-stopped
    healthcheck:
      test: curl -f http://localhost:9000/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
    - workflow-intelligence
    - shared-libraries
  predictive:
    build: intelligent-core/predictive
    container_name: bcm-predictive
    ports:
    - 8031:8031
    environment:
    - DATABASE_URL=${DATABASE_URL}
    - ENABLE_DAILY_DIGESTS=${ENABLE_DAILY_DIGESTS}
    - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    - SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD}
    - SUPABASE_URL=${SUPABASE_URL}
    networks:
    - bcm-network
    restart: unless-stopped
    healthcheck:
      test: curl -f http://localhost:8031/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
    - workflow-intelligence
  collective:
