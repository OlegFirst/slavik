version: '3.8'
services:
  integration:
    container_name: integration
    build:
      context: infrastructure/integration
      dockerfile: Dockerfile
    ports:
    - 8003:8003
    environment:
    - SERVICE_NAME=integration
    - SERVICE_PORT=8003
    - GITHUB_APP_ID=${{var_name}}
    - DATABASE_URL=${{var_name}}
    networks:
    - integration-network
    restart: unless-stopped
    healthcheck:
      test: curl -f http://localhost:8003/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    depends_on:
      infrastructure-services:
        condition: service_healthy
networks:
  integration-network:
    driver: bridge
volumes: {}
