version: '3.8'

# 🧠 COGNITIVE ORCHESTRATION PLATFORM
# Собираем все компоненты в единую интеллектуальную систему

services:
  # ==================================
  # LAYER 1: NEURAL FABRIC (Мозг)
  # ==================================

  cognitive-orchestrator:
    container_name: cognitive-brain
    build:
      context: ./platform-framework/orchestrator
      dockerfile: Dockerfile
    ports:
      - "8000:8000"  # Главный мозг системы
    environment:
      - REDIS_URL=redis://redis:6379
      - EVENTBUS_URL=http://eventbus:8001
      - ODOO_URL=http://odoo:8069
    depends_on:
      - redis
      - eventbus
      - postgres
    networks:
      - cognitive-network

  eventbus:
    container_name: neural-eventbus
    build: ./platform-framework/event-bus
    ports:
      - "8001:8001"
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - cognitive-network

  service-registry:
    container_name: service-registry
    build: ./platform-framework/service-registry
    ports:
      - "8002:8002"
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - cognitive-network

  # ==================================
  # LAYER 2: PLATFORM FRAMEWORK
  # ==================================

  api-gateway:
    container_name: api-gateway
    image: kong:3.4
    ports:
      - "8080:8000"  # Единая точка входа
      - "8443:8443"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: "/kong/kong.yml"
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8443 ssl"
    volumes:
      - ./infrastructure/kong/kong.yml:/kong/kong.yml
    networks:
      - cognitive-network

  document-processor:
    container_name: document-processor
    build: ./platform-framework/document-processor
    ports:
      - "8083:8083"
    environment:
      - EVENTBUS_URL=http://eventbus:8001
      - ORCHESTRATOR_URL=http://cognitive-orchestrator:8000
    depends_on:
      - eventbus
      - cognitive-orchestrator
    networks:
      - cognitive-network

  # ==================================
  # LAYER 3: BUSINESS SERVICES
  # ==================================

  odoo:
    container_name: bcm-odoo
    image: odoo:17.0
    ports:
      - "8069:8069"
    environment:
      - HOST=postgres
      - USER=odoo
      - PASSWORD=odoo
    volumes:
      - ./services/bcm-specific/odoo/odoo-18.0/addons:/mnt/extra-addons
      - odoo-data:/var/lib/odoo
    depends_on:
      - postgres
    networks:
      - cognitive-network

  # AI Services
  ai-consultant:
    container_name: ai-consultant
    build: ./ai-core/services/ai-consultant
    ports:
      - "8090:8090"
    environment:
      - EVENTBUS_URL=http://eventbus:8001
      - ORCHESTRATOR_URL=http://cognitive-orchestrator:8000
    depends_on:
      - eventbus
      - cognitive-orchestrator
    networks:
      - cognitive-network

  # ==================================
  # INFRASTRUCTURE
  # ==================================

  postgres:
    container_name: cognitive-postgres
    image: postgres:15
    environment:
      - POSTGRES_DB=bcm_platform
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/database:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - cognitive-network

  redis:
    container_name: cognitive-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - cognitive-network

  # ==================================
  # MONITORING
  # ==================================

  prometheus:
    container_name: cognitive-prometheus
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./platform-framework/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - cognitive-network

  grafana:
    container_name: cognitive-grafana
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./platform-framework/monitoring/grafana:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - cognitive-network

  # ==================================
  # EXTERNAL INTEGRATIONS
  # ==================================

  thehive:
    container_name: thehive
    image: strangebee/thehive:5.2
    ports:
      - "9000:9000"
    environment:
      - TH_SECRET=MySecretForTheHive
    volumes:
      - thehive-data:/opt/thehive/data
    networks:
      - cognitive-network

  moodle:
    container_name: moodle
    image: bitnami/moodle:4.3
    ports:
      - "8085:8080"
    environment:
      - MOODLE_DATABASE_HOST=postgres
      - MOODLE_DATABASE_NAME=moodle
      - MOODLE_DATABASE_USER=moodle
      - MOODLE_DATABASE_PASSWORD=moodle
    depends_on:
      - postgres
    networks:
      - cognitive-network

# ==================================
# VOLUMES
# ==================================
volumes:
  postgres-data:
  odoo-data:
  redis-data:
  prometheus-data:
  grafana-data:
  thehive-data:

# ==================================
# NETWORK
# ==================================
networks:
  cognitive-network:
    driver: bridge
    name: cognitive-network