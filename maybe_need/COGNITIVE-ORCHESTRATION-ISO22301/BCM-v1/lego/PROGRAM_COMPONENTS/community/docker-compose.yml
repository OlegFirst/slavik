version: '3.8'

services:
  # BCM Community Forum Service
  community-forum:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bcm-community-forum
    environment:
      # Service configuration
      PORT: 8006
      HOST: 0.0.0.0
      LOG_LEVEL: info
      
      # API Security
      FORUM_API_KEY: ${FORUM_API_KEY}
      JWT_SECRET: ${FORUM_JWT_SECRET:-forum_jwt_secret_key_change_in_production}
      
      # Database connection
      DATABASE_URL: postgresql+asyncpg://forumuser:${FORUM_DB_PASSWORD:-forum_secure_pass}@forum-postgres:5432/bcm_forum
      
      # Redis connection
      REDIS_URL: redis://:${FORUM_REDIS_PASSWORD:-redis_secure_pass}@forum-redis:6379/0
      
      # BCM Platform integration
      BCM_API_URL: ${BCM_API_URL:-http://host.docker.internal:8069}
      BCM_API_KEY: ${BCM_API_KEY}
      
      # File upload configuration
      MAX_FILE_SIZE: 10MB
      UPLOAD_DIR: /app/uploads
      ALLOWED_EXTENSIONS: "jpg,jpeg,png,gif,pdf,doc,docx"
      
      # WebSocket configuration
      WEBSOCKET_ENABLED: "true"
      MAX_CONNECTIONS: 1000
      
      # Email configuration (optional)
      SMTP_SERVER: ${SMTP_SERVER:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      
      # Forum settings
      FORUM_NAME: "BCM Community Hub"
      FORUM_DESCRIPTION: "Business Continuity Management Knowledge Exchange"
      POSTS_PER_PAGE: 20
      TOPICS_PER_PAGE: 20
      MAX_POST_LENGTH: 10000
      ENABLE_REACTIONS: "true"
      ENABLE_POLLS: "true"
      
    ports:
      - "8006:8006"
    volumes:
      - forum_uploads:/app/uploads
      - forum_logs:/app/logs
      - forum_temp:/tmp
    networks:
      - community-network
      - bcm-network
    depends_on:
      - forum-postgres
      - forum-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.5'
        reservations:
          memory: 512M
          cpus: '0.5'

  # PostgreSQL for forum data
  forum-postgres:
    image: postgres:15-alpine
    container_name: bcm-forum-postgres
    environment:
      POSTGRES_DB: bcm_forum
      POSTGRES_USER: forumuser
      POSTGRES_PASSWORD: ${FORUM_DB_PASSWORD:-forum_secure_pass}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - forum_postgres_data:/var/lib/postgresql/data
      - ./sql/init-forum-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - community-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forumuser -d bcm_forum"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis for caching and WebSocket state
  forum-redis:
    image: redis:7-alpine
    container_name: bcm-forum-redis
    command: redis-server --requirepass ${FORUM_REDIS_PASSWORD:-redis_secure_pass}
    volumes:
      - forum_redis_data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - community-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Nginx reverse proxy for forum
  forum-nginx:
    image: nginx:alpine
    container_name: bcm-forum-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/ssl:/etc/nginx/ssl:ro
      - forum_uploads:/var/www/uploads:ro
    networks:
      - community-network
    depends_on:
      - community-forum
    restart: unless-stopped
    profiles:
      - nginx

  # MinIO for file storage (optional)
  forum-minio:
    image: minio/minio:RELEASE.2023-11-20T22-40-07Z
    container_name: bcm-forum-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - forum_minio_data:/data
    networks:
      - community-network
    restart: unless-stopped
    profiles:
      - storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Elasticsearch for forum search (optional)
  forum-elasticsearch:
    image: elasticsearch:8.11.0
    container_name: bcm-forum-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - cluster.name=bcm-forum
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - forum_elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9204:9200"
    networks:
      - community-network
    restart: unless-stopped
    profiles:
      - search
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Background task worker
  forum-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bcm-forum-worker
    command: python worker.py
    environment:
      DATABASE_URL: postgresql+asyncpg://forumuser:${FORUM_DB_PASSWORD:-forum_secure_pass}@forum-postgres:5432/bcm_forum
      REDIS_URL: redis://:${FORUM_REDIS_PASSWORD:-redis_secure_pass}@forum-redis:6379/0
      BCM_API_URL: ${BCM_API_URL:-http://host.docker.internal:8069}
      BCM_API_KEY: ${BCM_API_KEY}
      WORKER_CONCURRENCY: 2
      LOG_LEVEL: info
    volumes:
      - forum_uploads:/app/uploads
      - forum_logs:/app/logs
    networks:
      - community-network
      - bcm-network
    depends_on:
      - forum-postgres
      - forum-redis
    restart: unless-stopped
    profiles:
      - worker

  # Forum analytics service
  forum-analytics:
    build:
      context: .
      dockerfile: Dockerfile.analytics
    container_name: bcm-forum-analytics
    environment:
      DATABASE_URL: postgresql+asyncpg://forumuser:${FORUM_DB_PASSWORD:-forum_secure_pass}@forum-postgres:5432/bcm_forum
      REDIS_URL: redis://:${FORUM_REDIS_PASSWORD:-redis_secure_pass}@forum-redis:6379/0
      ANALYTICS_PORT: 8007
    ports:
      - "8007:8007"
    volumes:
      - forum_analytics_data:/app/data
    networks:
      - community-network
    depends_on:
      - forum-postgres
      - forum-redis
    restart: unless-stopped
    profiles:
      - analytics

volumes:
  # Forum storage
  forum_uploads:
    driver: local
  forum_logs:
    driver: local
  forum_temp:
    driver: local
  forum_analytics_data:
    driver: local
    
  # Database storage
  forum_postgres_data:
    driver: local
  forum_redis_data:
    driver: local
    
  # Optional services storage
  forum_minio_data:
    driver: local
  forum_elasticsearch_data:
    driver: local

networks:
  community-network:
    driver: bridge
    name: community-network
  bcm-network:
    external: true
    name: bcm-network
