# TheHive Configuration for BCM Platform Integration
play.http.secret.key = "bcm-thehive-secret-key-change-in-production"

# Database configuration
db.janusgraph {
  storage {
    backend = cql
    hostname = ["cassandra"]
    port = 9042
    cql {
      cluster-name = thehive
      keyspace = thehive
    }
  }
  index.search {
    backend = elasticsearch
    hostname = ["elasticsearch"]
    index-name = thehive
  }
}

# Storage configuration for file attachments
storage {
  provider = localfs
  localfs {
    location = /opt/thp/thehive/data
  }
}

# Authentication configuration
auth {
  providers = [
    {name = session}
    {name = basic}
    {name = local}
  ]
  
  # Multi-factor authentication
  multifactor = [
    {name = totp}
  ]
}

# Services configuration
services {
  LocalAuthSrv {
    method = basic
  }
  
  LocalUserSrv {
  }
  
  UserSrv {
  }
  
  OrganisationSrv {
  }
  
  AlertSrv {
  }
  
  CaseSrv {
  }
  
  TaskSrv {
  }
  
  ObservableSrv {
  }
  
  AttachmentSrv {
  }
  
  IntegrityCheckSrv {
  }
  
  MispSrv {
  }

  # Cortex integration for enrichment
  CortexSrv {
    url = "http://cortex:9001"
    auth {
      type = "bearer"
      key = "cortex-api-key"
    }
    # Request timeout
    wsConfig.requestTimeout = 60000
  }
}

# BCM Platform specific configuration
bcm {
  # Webhook configuration for BCM integration
  webhooks {
    enabled = true
    url = "http://thehive-webhook-receiver:8091/webhook/thehive"
    secret = "${?WEBHOOK_SECRET}"
    events = ["CaseCreated", "CaseUpdated", "TaskCreated", "TaskUpdated", "AlertCreated"]
  }
  
  # Custom fields for BCM integration
  customFields {
    bcm_incident_id {
      type = "string"
      description = "BCM Platform Incident ID"
    }
    bcm_exercise_id {
      type = "string"
      description = "BCM Platform Exercise ID"  
    }
    bcm_company_id {
      type = "string"
      description = "BCM Platform Company ID"
    }
    business_impact {
      type = "string"
      description = "Business Impact Level"
      options = ["Low", "Medium", "High", "Critical"]
    }
    affected_processes {
      type = "string"
      description = "Affected Business Processes"
    }
    recovery_objectives {
      type = "string"
      description = "Recovery Time/Point Objectives"
    }
  }
}

# HTTP configuration
http.address = 0.0.0.0
http.port = 9000

# Play Framework configuration
play {
  http {
    context = "/"
    parser.maxDiskBuffer = 50MB
    parser.maxMemoryBuffer = 10MB
  }
  
  # Enable CORS for BCM Platform integration
  filters {
    enabled += "play.filters.cors.CORSFilter"
    cors {
      allowedOrigins = ["http://localhost:3000", "http://localhost:8069"]
      allowedHttpMethods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
      allowedHttpHeaders = ["Accept", "Content-Type", "Origin", "Authorization"]
    }
  }
  
  # Session configuration
  http.session {
    maxAge = 1h
    httpOnly = true
    secure = false
    sameSite = "lax"
  }
}

# Logging configuration
logger.root = WARN
logger.play = INFO
logger.application = INFO
logger.org.thp.thehive = INFO

# Akka configuration
akka {
  actor {
    default-dispatcher {
      fork-join-executor {
        parallelism-min = 2
        parallelism-factor = 2.0
        parallelism-max = 4
      }
    }
  }
  
  http {
    server {
      idle-timeout = 60s
      request-timeout = 40s
    }
    
    client {
      idle-timeout = 60s
    }
  }
}

# Feature flags for BCM integration
features {
  bcmIntegration = true
  webhookSupport = true
  customFieldsSupport = true
  cortexAnalysis = true
}
