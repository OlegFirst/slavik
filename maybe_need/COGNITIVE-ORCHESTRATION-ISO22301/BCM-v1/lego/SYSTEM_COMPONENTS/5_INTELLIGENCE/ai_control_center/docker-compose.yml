version: '3.8'

services:
  ai-control-center:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8200:3000"
    environment:
      - NODE_ENV=development
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - BCM_PLATFORM_URL=http://localhost:8069
      - AI_ORCHESTRATOR_URL=http://localhost:8000
      - SCENARIO_ORCHESTRATOR_URL=http://localhost:8085
      - MCP_SERVER_URL=http://localhost:8087
      - REDIS_URL=redis://localhost:6379
      - SUPABASE_URL=${SUPABASE_AI_MEMORY_URL}
      - SUPABASE_KEY=${SUPABASE_AI_MEMORY_KEY}
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    networks:
      - bcm-network

networks:
  bcm-network:
    external: true