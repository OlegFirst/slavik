worker_processes 1;
events { worker_connections 1024; }
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  client_max_body_size 50m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen ${GATEWAY_PORT};
    server_name _;

    # === Frontend SPA ===
    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass ${FRONTEND_URL};
    }

    # === EventBus API (history/publish) ===
    location /api/events/ {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin ${ALLOWED_ORIGIN};
        add_header Access-Control-Allow-Headers Authorization,Content-Type,X-Tenant-Id;
        add_header Access-Control-Allow-Methods GET,POST,OPTIONS;
        return 204;
      }
      add_header Access-Control-Allow-Origin ${ALLOWED_ORIGIN};
      add_header Access-Control-Allow-Headers Authorization,Content-Type,X-Tenant-Id;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass ${EVENTBUS_URL}/api/events/;
    }

    # === SSE stream (без буферизации) ===
    location /api/events/stream {
      add_header Access-Control-Allow-Origin ${ALLOWED_ORIGIN};
      add_header Cache-Control no-cache;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_buffering off;               # ВАЖНО для SSE
      proxy_read_timeout 3600s;
      proxy_pass ${EVENTBUS_URL}/api/events/stream;
    }

    # === WebSocket (если есть) ===
    location /api/events/ws {
      add_header Access-Control-Allow-Origin ${ALLOWED_ORIGIN};
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass ${EVENTBUS_URL}/api/events/ws;
    }

    # === Orchestrator API ===
    location /api/ai/ {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin ${ALLOWED_ORIGIN};
        add_header Access-Control-Allow-Headers Authorization,Content-Type,X-Tenant-Id;
        add_header Access-Control-Allow-Methods GET,POST,OPTIONS;
        return 204;
      }
      add_header Access-Control-Allow-Origin ${ALLOWED_ORIGIN};
      add_header Access-Control-Allow-Headers Authorization,Content-Type,X-Tenant-Id;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass ${ORCH_URL}/api/ai/;
    }
    
    location /api/recommendations {
      add_header Access-Control-Allow-Origin ${ALLOWED_ORIGIN};
      add_header Access-Control-Allow-Headers Authorization,Content-Type,X-Tenant-Id;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass ${ORCH_URL}/api/recommendations;
    }
    
    location /api/audit/summarize {
      add_header Access-Control-Allow-Origin ${ALLOWED_ORIGIN};
      add_header Access-Control-Allow-Headers Authorization,Content-Type,X-Tenant-Id;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass ${ORCH_URL}/api/audit/summarize;
    }

    # === Odoo под /odoo/ (в iframe) ===
    location /odoo/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass ${ODOO_URL}/;
      # если блокируется iframe → на стороне Odoo выстави CSP frame-ancestors или снимай X-Frame-Options
    }

    # === Health check ===
    location /health {
      return 200 "Gateway OK";
      add_header Content-Type text/plain;
    }
  }
}
