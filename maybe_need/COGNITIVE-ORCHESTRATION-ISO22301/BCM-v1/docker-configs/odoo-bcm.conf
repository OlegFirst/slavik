[options]
; BCM Platform Odoo Configuration
; Database configuration
db_host = postgres
db_port = 5432
db_user = odoo
db_password = postgres123
database = bcm_platform

; Server configuration
http_interface = 0.0.0.0
http_port = 8069
longpolling_port = 8072

; Log configuration
log_level = info
logfile = /var/log/odoo/odoo.log

; BCM Addons paths
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons

; Performance settings
max_cron_threads = 2
workers = 4
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200

; Redis session store
session_redis_host = redis
session_redis_port = 6379
session_redis_db = 1

; BCM Platform specific settings
server_wide_modules = base,web,bcm_core
auto_reload = False
dev_mode = False

; Security settings
list_db = False
admin_passwd = bcm_admin_2023