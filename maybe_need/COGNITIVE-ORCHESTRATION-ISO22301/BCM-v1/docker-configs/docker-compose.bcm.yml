version: '3.8'

services:
  # PostgreSQL Database
  postgres-bcm:
    image: postgres:16-alpine
    container_name: bcm-postgres
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bcm_secure_2024}
      POSTGRES_DB: postgres
    volumes:
      - postgres_bcm_data:/var/lib/postgresql/data
    networks:
      - bcm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis-bcm:
    image: redis:7-alpine
    container_name: bcm-redis
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_bcm_data:/data
    networks:
      - bcm-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Custom Odoo with pre-installed BCM modules
  odoo-bcm:
    build:
      context: ./core/odoo-18.0
      dockerfile: Dockerfile.bcm
    container_name: bcm-odoo
    depends_on:
      postgres-bcm:
        condition: service_healthy
      redis-bcm:
        condition: service_healthy
    environment:
      - DB_HOST=postgres-bcm
      - DB_PORT=5432
      - DB_USER=odoo
      - DB_PASSWORD=${DB_PASSWORD:-bcm_secure_2024}
      - DB_NAME=bcm_platform
      - BCM_MODULES_AUTO_INSTALL=true
      - ADMIN_PASSWD=admin123
    ports:
      - "8169:8069"  # Different port to avoid conflicts
      - "8172:8072"  # Longpolling port
    volumes:
      - odoo_bcm_data:/var/lib/odoo
      - ./core/odoo-18.0/addons:/mnt/extra-addons:ro
      - ./core/odoo-18.0/config:/etc/odoo:ro
    networks:
      - bcm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8069/web/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  bcm-network:
    driver: bridge

volumes:
  postgres_bcm_data:
  redis_bcm_data:
  odoo_bcm_data: