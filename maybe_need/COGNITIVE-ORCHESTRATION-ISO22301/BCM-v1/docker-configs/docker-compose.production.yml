# BCM Platform - Production Architecture
# Optimized version with active services only
# Architecture: Infrastructure -> Core -> AI -> Business -> Frontend

version: '3.8'

services:
  # ===============================================
  # LAYER 1: INFRASTRUCTURE (Data Layer)
  # ===============================================

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: bcm_platform
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: keycloak
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./core/database/seeds:/docker-entrypoint-initdb.d/
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: bcm
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 3

  # ===============================================
  # LAYER 2: CORE SERVICES (Business Logic)
  # ===============================================

  odoo:
    image: maxde4/seh-foundation-iso-22301:latest
    depends_on:
      - postgres
      - redis
    ports:
      - "8069:8069"
    environment:
      - HOST=postgres
      - USER=odoo
      - PASSWORD=${DB_PASSWORD}
      - DB_NAME=bcm_platform
      - REDIS_URL=redis://redis:6379/0
      - BCM_MODE=production
      - BCM_AI_ENABLED=true
      - ODOO_BASE_URL=${ODOO_BASE_URL}
    volumes:
      - ./core/odoo-18.0/addons:/mnt/extra-addons:rw
      - odoo_data:/var/lib/odoo
      - odoo_logs:/var/log/odoo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8069/web/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Unified Database Gateway - Central data access
  unified_database_gateway:
    build:
      context: ./services/unified_database_gateway
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - redis
      - rabbitmq
    environment:
      - POSTGRES_URL=postgresql://odoo:${DB_PASSWORD}@postgres:5432/bcm_platform
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://bcm:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_KEY=${SUPABASE_KEY:-}
    ports:
      - "8888:8888"
    volumes:
      - ./services/unified_database_gateway:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Unified API Gateway - централизованный роутер для всех backend сервисов
  unified_api_gateway:
    build:
      context: ./services/unified_api_gateway
      dockerfile: Dockerfile
    depends_on:
      - unified_database_gateway
    environment:
      - DATABASE_GATEWAY_URL=http://unified_database_gateway:8888
    ports:
      - "8777:8777"
    volumes:
      - ./services/unified_api_gateway:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8777/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # CRM Bridge - мост между Odoo CRM и централизованными gateway
  crm_bridge:
    build:
      context: ./services/crm_bridge
      dockerfile: Dockerfile
    depends_on:
      - unified_database_gateway
      - unified_api_gateway
      - odoo
    environment:
      - ODOO_API_URL=http://odoo:8069
      - ODOO_DB=bcm_platform
      - DATABASE_GATEWAY_URL=http://unified_database_gateway:8888
      - API_GATEWAY_URL=http://unified_api_gateway:8777
    ports:
      - "8778:8778"
    volumes:
      - ./services/crm_bridge:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8778/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # BCM Platform UI (from sandbox) - дополнительный интерфейс
  bcm_platform_ui:
    build:
      context: ./sandbox/odoo-inspector/BCM_PLATFORM_FINAL/bcm-platform-ui
      dockerfile: Dockerfile
    depends_on:
      - unified_api_gateway
      - crm_bridge
    environment:
      - VITE_API_URL=http://unified_api_gateway:8777
      - VITE_CRM_URL=http://crm_bridge:8778
      - VITE_DATABASE_URL=http://unified_database_gateway:8888
    ports:
      - "3004:3000"
    volumes:
      - ./sandbox/odoo-inspector/BCM_PLATFORM_FINAL/bcm-platform-ui:/app
    restart: unless-stopped

  # ===============================================
  # LAYER 3: AI SERVICES (Intelligence Layer)
  # ===============================================

  ai_orchestrator:
    build:
      context: ./services/ai_orchestrator
      dockerfile: Dockerfile
    depends_on:
      - redis
      - rabbitmq
    environment:
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://bcm:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      - ODOO_URL=http://odoo:8069
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ./services/ai_orchestrator:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  ai_control_center:
    build:
      context: ./services/ai_control_center
      dockerfile: Dockerfile
    depends_on:
      - redis
      - ai_orchestrator
    environment:
      - PORT=8200
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8200:8200"
    volumes:
      - ./services/ai_control_center:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8200/api/organism/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===============================================
  # LAYER 4: BUSINESS SERVICES (API Layer)
  # ===============================================

  # BCM Platform API v4 - Main API Gateway
  bcm_platform_api:
    build:
      context: ./api
      dockerfile: Dockerfile
    depends_on:
      - odoo
      - unified_database_gateway
    environment:
      - FLASK_ENV=production
      - BCM_MODULES_PATH=/mnt/bcm-modules
      - DATABASE_URL=http://unified_database_gateway:8888
      - ODOO_URL=http://odoo:8069
    ports:
      - "5001:5001"
    volumes:
      - ./core/odoo-18.0/addons:/mnt/bcm-modules:ro
      - ./api:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5001/api/modules/list').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3

  # WebSocket Real-time Server
  websocket_server:
    build:
      context: ./api
      dockerfile: Dockerfile.websocket
    depends_on:
      - redis
    environment:
      - SOCKETIO_PORT=8889
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8889:8889"
    volumes:
      - ./api:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8889/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Business Intelligence & Analytics
  bia_engine:
    build:
      context: ./services/bia_engine
      dockerfile: Dockerfile
    depends_on:
      - redis
      - rabbitmq
      - postgres
    environment:
      - DATABASE_URL=postgresql://odoo:${DB_PASSWORD}@postgres:5432/bcm_platform
      - REDIS_URL=redis://redis:6379/1
      - RABBITMQ_URL=amqp://bcm:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      - PORT=8082
    ports:
      - "8082:8082"
    volumes:
      - ./services/bia_engine:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Document Processing & Compliance
  document_processor:
    build:
      context: ./services/document_processor
      dockerfile: Dockerfile
    depends_on:
      - redis
      - rabbitmq
    environment:
      - REDIS_URL=redis://redis:6379/3
      - RABBITMQ_URL=amqp://bcm:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      - PORT=8083
    ports:
      - "8083:8083"
    volumes:
      - ./services/document_processor:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  compliance_checker:
    build:
      context: ./services/compliance_checker
      dockerfile: Dockerfile
    depends_on:
      - redis
      - rabbitmq
    environment:
      - REDIS_URL=redis://redis:6379/4
      - RABBITMQ_URL=amqp://bcm:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      - PORT=8084
    ports:
      - "8084:8084"
    volumes:
      - ./services/compliance_checker:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===============================================
  # LAYER 5: FRONTEND SERVICES (Presentation Layer)
  # ===============================================

  # Admin Panel (React/TypeScript)
  admin_panel:
    build:
      context: ./frontend/admin_panel
      dockerfile: Dockerfile
    depends_on:
      - bcm_platform_api
      - odoo
    environment:
      - REACT_APP_API_URL=http://bcm_platform_api:5001/api/v1
      - REACT_APP_ODOO_URL=http://odoo:8069
      - REACT_APP_WEBSOCKET_URL=ws://websocket_server:8889
    ports:
      - "3001:3001"
    volumes:
      - ./frontend/admin_panel:/app
    restart: unless-stopped

  # Unified BCM Platform (Next.js)
  unified_platform:
    build:
      context: ./frontend/unified-bcm-platform
      dockerfile: Dockerfile
    depends_on:
      - bcm_platform_api
      - ai_orchestrator
    environment:
      - NEXT_PUBLIC_API_URL=http://bcm_platform_api:5001
      - NEXT_PUBLIC_AI_URL=http://ai_orchestrator:8000
      - NEXT_PUBLIC_WEBSOCKET_URL=ws://websocket_server:8889
    ports:
      - "3002:3000"
    volumes:
      - ./frontend/unified-bcm-platform:/app
    restart: unless-stopped

  # Web Portal (Vue.js Enhanced)
  web_portal:
    build:
      context: ./frontend/web_portal-2
      dockerfile: Dockerfile
    depends_on:
      - bcm_platform_api
      - websocket_server
    environment:
      - VITE_API_URL=http://bcm_platform_api:5001
      - VITE_WEBSOCKET_URL=ws://websocket_server:8889
      - VITE_ODOO_URL=http://odoo:8069
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/web_portal-2:/app
    restart: unless-stopped

  # ===============================================
  # LAYER 6: MONITORING & SUPPORT
  # ===============================================

  # Grafana for monitoring
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3003:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=redis-datasource,prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/bcm-dashboard.json:ro
    depends_on:
      - redis
      - postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Traefik reverse proxy
  traefik:
    image: traefik:v3.0
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

# ===============================================
# VOLUMES CONFIGURATION
# ===============================================
volumes:
  # Database & Cache
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local

  # Application Data
  odoo_data:
    driver: local
  odoo_logs:
    driver: local

  # Monitoring
  grafana_data:
    driver: local

# ===============================================
# NETWORK CONFIGURATION
# ===============================================
networks:
  default:
    name: bcm_platform_network
    driver: bridge

# ===============================================
# ENVIRONMENT VARIABLES REQUIRED:
# ===============================================
# DB_PASSWORD=postgres123
# RABBITMQ_PASSWORD=bcm123
# ANTHROPIC_API_KEY=your_api_key
# SUPABASE_URL=your_supabase_url
# SUPABASE_KEY=your_supabase_key
# ODOO_BASE_URL=your_domain
# GRAFANA_PASSWORD=admin123