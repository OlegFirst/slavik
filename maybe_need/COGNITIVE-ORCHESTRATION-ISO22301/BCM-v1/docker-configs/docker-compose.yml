
# Digital BCM Organism - Complete Platform with 10 AI Organs
# Enhanced with AI consciousness and specialized intelligence
#
# AI ORGANS INCLUDED:
# 🧠 Governance Brain (Anthropic) - Strategic intelligence
# 🚨 Emergency Response (Local) - Crisis management
# 🔮 Impact Oracle (Local) - Predictive analysis
# 🎭 Scenario Creator (Local) - Creative intelligence
# ⚠️ Risk Advisor (Local) - FAIR + Monte Carlo
# 🛡️ Compliance Guardian (Automated) - Continuous monitoring
# 📈 Performance Analyst (Local) - KPI intelligence
# 🎓 Learning Coach (Adaptive) - Training optimization
# 📋 Plan Generator (Local) - Intelligent planning
# 📊 Lifecycle Monitor (Dashboard) - Health monitoring

services:
  # Основная база данных
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: bcm_platform
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: postgres123
      # Дополнительные базы данных
      POSTGRES_MULTIPLE_DATABASES: keycloak
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./core/database/seeds:/docker-entrypoint-initdb.d/
      - ./core/database/init-keycloak-db.sh:/docker-entrypoint-initdb.d/01-init-keycloak-db.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis для кэширования и очередей
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # RabbitMQ для сообщений между сервисами
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: bcm
      RABBITMQ_DEFAULT_PASS: bcm123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 3

  # Keycloak для SSO и управления ролями BCM
  keycloak:
    image: quay.io/keycloak/keycloak:23.0.0
    command: start-dev
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD}
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_HTTP_ENABLED=true
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
    depends_on:
      - postgres
    volumes:
      - keycloak_data:/opt/keycloak/data
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Odoo 18.0 CE с полным набором BCM модулей
  odoo:
    image: maxde4/seh-foundation-iso-22301:v1.1
    # For Docker AI version use: maxde4/seh-foundation-iso-22301:v3.0-docker-ai
    # build:
    #   context: ./core/odoo-18.0
    #   dockerfile: Dockerfile
    depends_on:
      - postgres
      - redis
    ports:
      - "8069:8069"
    environment:
      # PostgreSQL connection - use local postgres container
      - HOST=postgres
      - USER=odoo
      - PASSWORD=postgres123
      - DB_NAME=bcm_platform
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=odoo
      - DB_PASSWORD=postgres123
      
      # Redis connection
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      
      # MongoDB connection (настраивается через переменные окружения)
      - MONGODB_URL=${MONGODB_URL}
      - MONGODB_DATABASE=${MONGODB_DATABASE}
      
      # Keycloak SSO integration
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=bcm-platform
      - KEYCLOAK_CLIENT_ID=odoo-bcm
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      
      # AI Services URLs
      - AI_ORCHESTRATOR_URL=http://ai_orchestrator:8000
      - BIA_ENGINE_URL=http://bia_engine:8082
      - DOCUMENT_PROCESSOR_URL=http://document_processor:8083
      - COMPLIANCE_CHECKER_URL=http://compliance_checker:8084
      
      # BCM Platform configuration
      - BCM_MODE=production
      - BCM_MULTITENANCY=true
      - BCM_AI_ENABLED=true
      - BCM_VERSION=18.0.1.0.0
      
      # Vercel frontend integration
      - FRONTEND_URL=https://iso-22301-theta.vercel.app
      - CORS_ORIGINS=https://iso-22301-theta.vercel.app,https://94a0f440b3da.ngrok-free.app
      
      # Odoo Base URL (ngrok tunnel for development)
      - ODOO_BASE_URL=https://94a0f440b3da.ngrok-free.app
      - WEB_BASE_URL=https://94a0f440b3da.ngrok-free.app
      
      # Ngrok auth token
      - NGROK_AUTHTOKEN=2wbM1vt2feyHnzoluwngV6yw9cN_7zujqcuBJMHWVhuzDGYPS
      
      
      # Email settings
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - EMAIL_FROM=bcm-platform@localhost
      
      # File upload settings
      - MAX_UPLOAD_SIZE=104857600
      
      # Security settings
      - SESSION_TIMEOUT=86400
      - PROXY_MODE=true
      
    volumes:
      - ./core/odoo-18.0/addons:/mnt/extra-addons:rw
      - odoo_data:/var/lib/odoo
      - odoo_logs:/var/log/odoo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8069/web/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.odoo.rule=Host(`bcm-platform.local`)"
      - "traefik.http.routers.odoo.tls=true"
      - "traefik.http.services.odoo.loadbalancer.server.port=8069"

  # AI Orchestrator микросервис
  ai_orchestrator:
    # image: ghcr.io/seh-foundation/iso-22301/bcm-ai_orchestrator:latest
    build:
      context: ./services/ai_orchestrator
      dockerfile: Dockerfile
    depends_on:
      - redis
      - rabbitmq
    environment:
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://bcm:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      - ODOO_URL=http://odoo:8069
      # GitHub Copilot Extension переменные
      - GITHUB_APP_ID=${GITHUB_APP_ID:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - GITHUB_PRIVATE_KEY=${GITHUB_PRIVATE_KEY:-}
      # Supabase AI Memory
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_KEY=${SUPABASE_KEY:-}
      # Anthropic API for AI Governance Brain
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./services/ai_orchestrator:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      # Alternative: test: ["CMD", "python", "-c", "import http.client; conn = http.client.HTTPConnection('localhost', 8000); conn.request('GET', '/health'); conn.getresponse().status == 200"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Deployment Service - простой и надежный деплойер
  deployer:
    build:
      context: ./services/deployer
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - redis
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
    ports:
      - "8009:8002"
    volumes:
      - ./services/deployer:/app
      - /var/run/docker.sock:/var/run/docker.sock  # Docker socket для управления
    working_dir: /app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # GitHub App сервис для webhooks и Copilot Extension
  github_app:
    # image: ghcr.io/seh-foundation/iso-22301/bcm-github_app:latest
    build:
      context: ./services/github_app
      dockerfile: Dockerfile
    depends_on:
      - ai_orchestrator
    environment:
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - GITHUB_PRIVATE_KEY=${GITHUB_PRIVATE_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - AI_ORCHESTRATOR_URL=http://ai_orchestrator:8000
    ports:
      - "8011:8001"
    volumes:
      - ./services/github_app:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8001/').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3

  # BIA Engine v2.0 - ML Business Impact Analysis
  bia_engine:
    # image: ghcr.io/seh-foundation/iso-22301/bcm-bia_engine:latest
    build:
      context: ./services/bia_engine
      dockerfile: Dockerfile
    depends_on:
      - redis
      - rabbitmq
      - postgres
    environment:
      - DATABASE_URL=postgresql://odoo:${DB_PASSWORD}@postgres:5432/bcm_platform
      - REDIS_URL=redis://redis:6379/1
      - RABBITMQ_URL=amqp://bcm:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      - PORT=8082
    ports:
      - "8082:8082"
    volumes:
      - ./services/bia_engine:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Notification Service
  notification_service:
    build:
      context: ./services/notification_service
      dockerfile: Dockerfile
    depends_on:
      - redis
      - rabbitmq
    environment:
      - REDIS_URL=redis://redis:6379/2
      - RABBITMQ_URL=amqp://bcm:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
    ports:
      - "8002:8000"
    volumes:
      - ./services/notification_service:/app

  # Document Processor - AI Document Intelligence  
  document_processor:
    build:
      context: ./services/document_processor
      dockerfile: Dockerfile
    depends_on:
      - redis
      - rabbitmq
    environment:
      - REDIS_URL=redis://redis:6379/3
      - RABBITMQ_URL=amqp://bcm:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      - PORT=8083
    ports:
      - "8083:8083"
    volumes:
      - ./services/document_processor:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8083/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Compliance Checker - ISO 22301 Automation
  compliance_checker:
    build:
      context: ./services/compliance_checker
      dockerfile: Dockerfile
    depends_on:
      - redis
      - rabbitmq
    environment:
      - REDIS_URL=redis://redis:6379/4
      - RABBITMQ_URL=amqp://bcm:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      - PORT=8084
    ports:
      - "8084:8084"
    volumes:
      - ./services/compliance_checker:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8084/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3

  # BPMN Workflow Service
  bpmn_service:
    build:
      context: ./backend/bpmn_service
      dockerfile: Dockerfile
    depends_on:
      - redis
      - eventbus
    environment:
      - EVENTBUS_URL=http://eventbus:8001
      - POSTGRES_URL=postgresql://odoo:${DB_PASSWORD}@postgres:5432/bcm_platform
    ports:
      - "8005:8005"
    volumes:
      - ./backend/bpmn_service:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3

  # LMS Adapter Service
  lms_adapter:
    build:
      context: ./backend/lms_adapter
      dockerfile: Dockerfile
    depends_on:
      - eventbus
    environment:
      - EVENTBUS_URL=http://eventbus:8001
    ports:
      - "8006:8006"
    volumes:
      - ./backend/lms_adapter:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8006/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # TheHive Adapter Service
  thehive_adapter:
    build:
      context: ./backend/thehive_adapter
      dockerfile: Dockerfile
    depends_on:
      - eventbus
    environment:
      - EVENTBUS_URL=http://eventbus:8001
    ports:
      - "8007:8007"
    volumes:
      - ./backend/thehive_adapter:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8007/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana Adapter Service
  grafana_adapter:
    build:
      context: ./backend/grafana_adapter
      dockerfile: Dockerfile
    depends_on:
      - eventbus
    environment:
      - EVENTBUS_URL=http://eventbus:8001
    ports:
      - "8008:8008"
    volumes:
      - ./backend/grafana_adapter:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8008/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # EventBus Service (renamed for clarity)
  eventbus:
    build:
      context: ./backend/eventbus
      dockerfile: Dockerfile
    depends_on:
      - redis
      - postgres
    environment:
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_URL=postgresql://odoo:${DB_PASSWORD}@postgres:5432/bcm_platform
    ports:
      - "8001:8001"
    volumes:
      - ./backend/eventbus:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Web Portal Frontend
  web_portal:
    # image: ghcr.io/seh-foundation/iso-22301/bcm-web_portal:latest
    build:
      context: ./frontend/web_portal
      dockerfile: Dockerfile
    depends_on:
      - odoo
      - bpmn_service
      - lms_adapter
      - thehive_adapter
      - grafana_adapter
      - eventbus
    environment:
      - VUE_APP_API_URL=http://localhost:8069/api/v1
      - VUE_APP_BPMN_URL=http://localhost:8005/api
      - VUE_APP_LMS_URL=http://localhost:8006/api
      - VUE_APP_THEHIVE_URL=http://localhost:8007/api
      - VUE_APP_GRAFANA_URL=http://localhost:8008/api
      - VUE_APP_EVENTBUS_URL=http://localhost:8001/api
    ports:
      - "3000:80"
    volumes:
      - ./frontend/web_portal:/app

  # Admin Panel
  admin_panel:
    build:
      context: ./frontend/admin_panel
      dockerfile: Dockerfile
    depends_on:
      - odoo
    environment:
      - REACT_APP_API_URL=http://localhost:8069/api/v1
    ports:
      - "3001:3001"
    volumes:
      - ./frontend/admin_panel:/app

  # MailHog для тестирования email
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailhog.rule=Host(`mail.bcm-platform.local`)"
      - "traefik.http.services.mailhog.loadbalancer.server.port=8025"

  # Traefik reverse proxy
  traefik:
    image: traefik:v3.0
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
      - "8888:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"

  # Web Portal v2 - Modern BCM Interface with Odoo Integration
  web_portal_v2:
    build:
      context: ./frontend/web_portal-2
      dockerfile: Dockerfile
      target: development
    ports:
      - "5173:5173"
    environment:
      # API Configuration - ALL through proxy
      - VITE_API_URL=/api
      - VITE_AI_URL=/ai
      - VITE_ODOO_URL=/web

      # Odoo Configuration
      - VITE_ODOO_DB=bcm_platform
      - VITE_ODOO_USERNAME=admin
      - VITE_ODOO_PASSWORD=admin

      # WebSocket Configuration
      - VITE_WS_URL=ws://localhost:8069

      # Feature Flags
      - VITE_ENABLE_AI_FEATURES=true
      - VITE_ENABLE_SIMULATION=true
      - VITE_ENABLE_ANALYTICS=true
      - VITE_ENABLE_ODOO_INTEGRATION=true

      # Development
      - VITE_DEBUG_MODE=true
      - VITE_LOG_LEVEL=debug
      - VITE_DISABLE_AUTH=false
    depends_on:
      - odoo
      - ai_orchestrator
    volumes:
      - ./frontend/web_portal-2:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PDCA AI Assistant Service
  pdca_assistant:
    build:
      context: ./ai_services
      dockerfile: Dockerfile
    depends_on:
      - redis
      - ai_orchestrator
    environment:
      - REDIS_URL=redis://redis:6379/0
      - AI_ORCHESTRATOR_URL=http://ai_orchestrator:8000
    ports:
      - "8010:8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8010/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Module Validator API - BCM Module Validation Service
  module_validator_api:
    build:
      context: ./api
      dockerfile: Dockerfile
    depends_on:
      - odoo
    environment:
      - FLASK_ENV=production
      - BCM_MODULES_PATH=/mnt/bcm-modules
    ports:
      - "5001:5001"
    volumes:
      - ./core/odoo-18.0/addons:/mnt/bcm-modules:ro
      - ./validate_modules.py:/app/validate_modules.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5001/api/modules/list').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Unified AI Service (Docker AI PoC) - ВАША РАЗРАБОТКА
  unified_ai_service:
    build:
      context: ./services/docker-ai
      dockerfile: Dockerfile
    depends_on:
      - redis
      - ai_orchestrator
    environment:
      - REDIS_URL=redis://redis:6379/1
      - AI_ORCHESTRATOR_URL=http://ai_orchestrator:8000
      - PORT=8090
    ports:
      - "8090:8090"
    volumes:
      - ./services/docker-ai:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8090/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Scenario Orchestrator Service - ВАША РАЗРАБОТКА
  scenario_orchestrator:
    build:
      context: ./services/scenario_orchestrator
      dockerfile: Dockerfile
    depends_on:
      - redis
      - ai_orchestrator
    environment:
      - REDIS_URL=redis://redis:6379/2
      - AI_ORCHESTRATOR_URL=http://ai_orchestrator:8000
      - PORT=8085
    ports:
      - "8085:8085"
    volumes:
      - ./services/scenario_orchestrator:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Docker Model Runner (Local LLM) - OPTIONAL
  model_runner:
    image: docker/model-runner:latest
    platform: linux/amd64
    ports:
      - "8088:8080"
    environment:
      - MODEL_NAME=gemma3:latest                           # Primary: Google quality 2.3GB
      - FAST_MODEL=smollm2:135M-Q4_K_M                    # Emergency: 100MB instant
      - BUSINESS_MODEL=mistral:latest                      # Business: 4.1GB efficient
      - ANALYSIS_MODEL=deepseek-r1-distill-llama:latest   # Deep: 4.6GB optimized
      - CODE_MODEL=deepcoder-preview:latest               # Code: 8.4GB reasoning
      - OPENAI_COMPATIBLE_API=true
      - GPU_ACCELERATION=${GPU_ENABLED:-false}
      - MODEL_STRATEGY=bcm_enterprise                      # Enterprise BCM routing
    volumes:
      - model_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MCP Server for BCM Tools - RECOMMENDED (relocated to integrations)
  bcm_mcp_server:
    build:
      context: ./integrations/mcp-server
      dockerfile: Dockerfile
    ports:
      - "8087:8080"
    environment:
      - ODOO_URL=http://odoo:8069
      - POSTGRES_URL=postgresql://odoo:${DB_PASSWORD}@postgres:5432/bcm_platform
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
      - odoo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana for BCM Platform Monitoring
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3003:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_ALLOW_ORG_CREATE=false
      - GF_INSTALL_PLUGINS=redis-datasource,prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/bcm-dashboard.json:ro
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Exercise Simulators Bridge - PHASE 4
  exercise_simulators:
