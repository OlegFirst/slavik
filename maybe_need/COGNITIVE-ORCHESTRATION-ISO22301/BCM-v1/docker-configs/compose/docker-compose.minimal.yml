# Минимальная конфигурация для тестирования unified database integration
# Только основные сервисы для быстрого запуска

services:
  # Основная база данных
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: bcm_platform
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: postgres123
    volumes:
      - postgres_data_minimal:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Redis для кэширования и очередей
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data_minimal:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # RabbitMQ для сообщений между сервисами
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: bcm
      RABBITMQ_DEFAULT_PASS: bcm123
    volumes:
      - rabbitmq_data_minimal:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 3

  # Odoo - стандартный быстрый образ
  odoo:
    image: odoo:18.0
    depends_on:
      - postgres
      - redis
    ports:
      - "8069:8069"
    environment:
      - HOST=postgres
      - USER=odoo
      - PASSWORD=postgres123
      - DB_NAME=bcm_platform
    volumes:
      - ./core/odoo-18.0/addons:/mnt/extra-addons:rw
      - odoo_data_minimal:/var/lib/odoo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8069/web/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data_minimal:
  redis_data_minimal:
  rabbitmq_data_minimal:
  odoo_data_minimal:

networks:
  default:
    driver: bridge