version: '3.8'

# Docker AI Agents Configuration for BCM Platform
# Modern AI orchestration with GitHub App integration

services:
  # Core AI Orchestrator (Brain of the platform)
  ai_orchestrator:
    build:
      context: ./services/ai_orchestrator
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://bcm:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      - ODOO_URL=http://odoo:8069
      - GITHUB_APP_URL=http://github_app:8001
      - DOCKER_AI_SERVICE=http://unified_ai:8090
    depends_on:
      - redis
      - rabbitmq
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "ai.agent.role=orchestrator"
      - "ai.agent.capabilities=pdca,workflow,decision"

  # Unified Docker AI Service (Multi-agent processor)
  unified_ai:
    build:
      context: ./services/docker-ai-poc
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      - REDIS_URL=redis://redis:6379/1
      - AI_ORCHESTRATOR_URL=http://ai_orchestrator:8000
      - GITHUB_APP_URL=http://github_app:8001
    depends_on:
      - redis
      - ai_orchestrator
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "ai.agent.role=processor"
      - "ai.agent.capabilities=bia,document,compliance,analysis"

  # PDCA AI Assistant (Context-aware helper)
  pdca_assistant:
    build:
      context: ./ai_services
      dockerfile: Dockerfile
    ports:
      - "8010:8010"
    environment:
      - REDIS_URL=redis://redis:6379/2
      - AI_ORCHESTRATOR_URL=http://ai_orchestrator:8000
      - UNIFIED_AI_URL=http://unified_ai:8090
    depends_on:
      - redis
      - ai_orchestrator
      - unified_ai
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8010/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "ai.agent.role=assistant"
      - "ai.agent.capabilities=pdca,context,suggestions"

  # GitHub App (Developer integration bridge)
  github_app:
    build:
      context: ./services/github_app
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - GITHUB_PRIVATE_KEY=${GITHUB_PRIVATE_KEY}
      - AI_ORCHESTRATOR_URL=http://ai_orchestrator:8000
      - UNIFIED_AI_URL=http://unified_ai:8090
    depends_on:
      - ai_orchestrator
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "ai.agent.role=bridge"
      - "ai.agent.capabilities=github,copilot,webhook,auth"

  # Document AI Processor (Specialized agent)
  document_ai:
    build:
      context: ./ai_services/document_processor
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    environment:
      - REDIS_URL=redis://redis:6379/3
      - AI_ORCHESTRATOR_URL=http://ai_orchestrator:8000
    depends_on:
      - redis
      - ai_orchestrator
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "ai.agent.role=specialist"
      - "ai.agent.capabilities=document,ocr,extraction,nlp"

  # AI Agent Discovery Service
  agent_registry:
    image: nginx:alpine
    ports:
      - "8099:80"
    volumes:
      - ./config/agent-registry.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ai_orchestrator
      - unified_ai
      - pdca_assistant
      - github_app
      - document_ai
    labels:
      - "ai.agent.role=registry"
      - "ai.agent.capabilities=discovery,routing,monitoring"

networks:
  ai_agents:
    driver: bridge
    labels:
      - "ai.network=agents"

volumes:
  ai_models:
  ai_logs:
  ai_cache: