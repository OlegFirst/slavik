version: '3.8'

# AI СЕРВИСЫ
# Запуск: docker-compose -f compose/docker-compose.ai.yml up -d

services:
  # AI Orchestrator - главный координатор
  ai_orchestrator:
    build:
      context: ./services/ai_orchestrator
      dockerfile: Dockerfile
    depends_on:
      - redis
      - rabbitmq
    environment:
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://bcm:${RABBITMQ_PASSWORD:-bcm123}@rabbitmq:5672/
      - ODOO_URL=http://odoo:8069
    ports:
      - "8000:8000"
    volumes:
      - ./services/ai_orchestrator:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3

  # BIA Engine v2.0
  bia_engine:
    build:
      context: ./services/bia_engine
      dockerfile: Dockerfile
    depends_on:
      - redis
      - rabbitmq
      - postgres
    environment:
      - DATABASE_URL=postgresql://odoo:${DB_PASSWORD:-postgres123}@postgres:5432/bcm_platform
      - REDIS_URL=redis://redis:6379/1
      - RABBITMQ_URL=amqp://bcm:${RABBITMQ_PASSWORD:-bcm123}@rabbitmq:5672/
      - PORT=8082
    ports:
      - "8082:8082"
    volumes:
      - ./services/bia_engine:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8082/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Document Processor
  document_processor:
    build:
      context: ./services/document_processor
      dockerfile: Dockerfile
    depends_on:
      - redis
      - rabbitmq
    environment:
      - REDIS_URL=redis://redis:6379/3
      - RABBITMQ_URL=amqp://bcm:${RABBITMQ_PASSWORD:-bcm123}@rabbitmq:5672/
      - PORT=8083
    ports:
      - "8083:8083"
    volumes:
      - ./services/document_processor:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8083/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Compliance Checker
  compliance_checker:
    build:
      context: ./services/compliance_checker
      dockerfile: Dockerfile
    depends_on:
      - redis
      - rabbitmq
    environment:
      - REDIS_URL=redis://redis:6379/4
      - RABBITMQ_URL=amqp://bcm:${RABBITMQ_PASSWORD:-bcm123}@rabbitmq:5672/
      - PORT=8084
    ports:
      - "8084:8084"
    volumes:
      - ./services/compliance_checker:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8084/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PDCA Assistant
  pdca_assistant:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
    depends_on:
      - redis
      - ai_orchestrator
    environment:
      - REDIS_URL=redis://redis:6379/0
      - AI_ORCHESTRATOR_URL=http://ai_orchestrator:8000
    ports:
      - "8010:8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8010/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Docker AI PoC - Unified AI Service
  docker_ai_poc:
    build:
      context: ./docker-ai-poc
      dockerfile: Dockerfile
    depends_on:
      - redis
      - ai_orchestrator
    environment:
      - REDIS_URL=redis://redis:6379/1
      - AI_ORCHESTRATOR_URL=http://ai_orchestrator:8000
      - PORT=8090
    ports:
      - "8090:8090"
    volumes:
      - ./docker-ai-poc:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Scenario Orchestrator
  scenario_orchestrator:
    build:
      context: ./ai_orchestrator
      dockerfile: Dockerfile
    depends_on:
      - redis
      - ai_orchestrator
    environment:
      - REDIS_URL=redis://redis:6379/2
      - AI_ORCHESTRATOR_URL=http://ai_orchestrator:8000
      - PORT=8085
    ports:
      - "8085:8085"
    volumes:
      - ./ai_orchestrator:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MCP Server
  bcm_mcp_server:
    build:
      context: ./docker-ai/mcp-server
      dockerfile: Dockerfile
    ports:
      - "8087:8080"
    environment:
      - ODOO_URL=http://odoo:8069
      - POSTGRES_URL=postgresql://odoo:${DB_PASSWORD:-postgres123}@postgres:5432/bcm_platform
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  default:
    external: true
    name: iso-22301_default