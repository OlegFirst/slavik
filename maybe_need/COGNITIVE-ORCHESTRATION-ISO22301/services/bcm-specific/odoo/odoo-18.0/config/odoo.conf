[options]
# Database settings (will be overridden by environment variables)
db_host = postgres
db_port = 5432
db_user = odoo
db_password = bcm_secure_2024
db_name = odoo

# Server settings
admin_passwd = bcm_secure_2024
http_port = 8069
workers = 4
max_cron_threads = 2
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200

# Addons path - правильный порядок модулей
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons

# Установка только базовых модулей сначала
# init = base,web,mail,portal

# BCM модули устанавливаются в правильной последовательности:
# 1. bcm_core (база)
# 2. bcm_base (интеграция)  
# 3. bcm_intelligent_base (AI)
# 4. остальные BCM модули
# update = all

# Logging
log_level = info
log_handler = :INFO
logfile = /var/log/odoo/odoo.log

# Session and security
session_timeout = 86400

# Email settings (будет настроено через ENV)
email_from = bcm-platform@localhost
smtp_server = localhost
smtp_port = 1025

# Keycloak SSO settings (будет настроено через модули auth_oauth)
# Данные настройки будут переданы через переменные окружения

# AI Services URLs (передаются через ENV в docker-compose)
# AI_ORCHESTRATOR_URL=http://ai_orchestrator:8000  
# BIA_ENGINE_URL=http://bia_engine:8082
# DOCUMENT_PROCESSOR_URL=http://document_processor:8083
# COMPLIANCE_CHECKER_URL=http://compliance_checker:8084

# Redis settings for caching and sessions
enable_redis = True

# File upload settings
max_upload_size = 104857600  # 100MB
data_dir = /var/lib/odoo

# Internationalization
language = en_US
timezone = UTC
translate_modules = bcm_intelligent_base,bcm_clients,bcm_context,bcm_bia,bcm_plans,bcm_incident,bcm_kpi,bcm_governance,bcm_audit,bcm_exercise,bcm_training,bcm_templates,bcm_portal,bcm_scenario_hub

# Development settings (для production установить в False)
dev_mode = False
reload = False

# Proxy mode for reverse proxy setup
proxy_mode = True

# BCM Platform specific settings
[bcm_platform]
version = 18.0.1.0.0
mode = production
ai_enabled = True
multitenancy = True
sso_enabled = True
