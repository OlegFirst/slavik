version: '3.8'

# 🧠 NUCLEUS - Ядро BCM Cognitive Orchestration Platform
# Основано на BCM_ORGANISM_ARCHITECTURE.md

services:
  # ==================================
  # БАЗОВАЯ ИНФРАСТРУКТУРА (кровь и лимфа)
  # ==================================

  postgres:
    container_name: nucleus-postgres
    image: postgres:15
    environment:
      POSTGRES_DB: bcm_platform
      POSTGRES_USER: bcm_user
      POSTGRES_PASSWORD: bcm_secure_pass
      POSTGRES_MULTIPLE_DATABASES: orchestration,odoo,eventstore
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/database:/docker-entrypoint-initdb.d
    networks:
      - nucleus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bcm_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: nucleus-redis
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - nucleus-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    container_name: nucleus-rabbitmq
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: bcm
      RABBITMQ_DEFAULT_PASS: bcm_pass
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - nucleus-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================================
  # ЦЕНТРАЛЬНАЯ НЕРВНАЯ СИСТЕМА (по документу)
  # ==================================

  # 1. Event Bus - нервные импульсы
  eventbus:
    container_name: nucleus-eventbus
    build:
      context: ./platform-framework/event-bus
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      REDIS_URL: redis://redis:6379/0
      POSTGRES_URL: postgresql://bcm_user:bcm_secure_pass@postgres:5432/eventstore
      RABBITMQ_URL: amqp://bcm:bcm_pass@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - nucleus-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Module Registry - каталог органов
  registry:
    container_name: nucleus-registry
    build:
      context: ./platform-framework/service-registry
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      REDIS_URL: redis://redis:6379/1
      POSTGRES_URL: postgresql://bcm_user:bcm_secure_pass@postgres:5432/orchestration
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - nucleus-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Workflow Engine (BPMN) - кровеносная система процессов
  workflow:
    container_name: nucleus-workflow
    build:
      context: ./platform-framework/services/bpmn_service
      dockerfile: Dockerfile
    ports:
      - "8005:8005"
    environment:
      EVENTBUS_URL: http://eventbus:8001
      REGISTRY_URL: http://registry:8002
      POSTGRES_URL: postgresql://bcm_user:bcm_secure_pass@postgres:5432/orchestration
    depends_on:
      eventbus:
        condition: service_healthy
      registry:
        condition: service_healthy
    networks:
      - nucleus-network

  # 4. AI Bridge / Orchestrator - Meta-AI связь
  orchestrator:
    container_name: nucleus-orchestrator
    build:
      context: ./platform-framework/orchestrator
      dockerfile: Dockerfile.unified  # Нужно создать
    ports:
      - "8000:8000"
    environment:
      EVENTBUS_URL: http://eventbus:8001
      REGISTRY_URL: http://registry:8002
      WORKFLOW_URL: http://workflow:8005
      POSTGRES_URL: postgresql://bcm_user:bcm_secure_pass@postgres:5432/orchestration
      REDIS_URL: redis://redis:6379/2
      RABBITMQ_URL: amqp://bcm:bcm_pass@rabbitmq:5672
    depends_on:
      eventbus:
        condition: service_healthy
      registry:
        condition: service_healthy
      workflow:
        condition: service_started
    networks:
      - nucleus-network

  # 5. BCM Integration Hub (Odoo модуль) - координатор
  # Запускается вместе с Odoo, но это КРИТИЧЕСКИЙ компонент ядра
  odoo-nucleus:
    container_name: nucleus-odoo
    image: odoo:17.0
    command: >
      sh -c "pip install redis pika httpx websockets &&
             odoo --db_host=postgres --db_user=bcm_user --db_password=bcm_secure_pass
             --database=bcm_platform --init=bcm_base,bcm_ai_bridge
             --load-language=ru_RU --without-demo=all"
    ports:
      - "8069:8069"
    environment:
      HOST: postgres
      USER: bcm_user
      PASSWORD: bcm_secure_pass
      EVENTBUS_URL: http://eventbus:8001
      REGISTRY_URL: http://registry:8002
    volumes:
      # Подключаем ТОЛЬКО критические модули ядра
      - ./services/bcm-specific/golden-pr-modules/bcm_ai_bridge:/mnt/extra-addons/bcm_ai_bridge
      - ./services/bcm-specific/golden-pr-modules/core/odoo-18.0/addons/bcm_base:/mnt/extra-addons/bcm_base
      - odoo-data:/var/lib/odoo
    depends_on:
      postgres:
        condition: service_healthy
      eventbus:
        condition: service_healthy
      registry:
        condition: service_healthy
    networks:
      - nucleus-network

# ==================================
# VOLUMES
# ==================================
volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  odoo-data:

# ==================================
# NETWORK
# ==================================
networks:
  nucleus-network:
    driver: bridge
    name: bcm-nucleus-network