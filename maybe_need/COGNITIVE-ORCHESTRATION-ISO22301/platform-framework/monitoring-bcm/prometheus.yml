global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter for system metrics
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # PostgreSQL metrics
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Odoo metrics (if exposed)
  - job_name: 'odoo'
    static_configs:
      - targets: ['odoo:8069']
    metrics_path: '/web/database/manager'

  # EventBus metrics
  - job_name: 'eventbus'
    static_configs:
      - targets: ['eventbus:3001']
    metrics_path: '/metrics'

  # AI Orchestrator metrics
  - job_name: 'ai_orchestrator'
    static_configs:
      - targets: ['ai_orchestrator:8000']
    metrics_path: '/metrics'