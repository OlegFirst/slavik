[options]
# Database
db_host = postgres  
db_port = 5432
db_user = odoo
db_password = odoo
db_name = bcm_platform

# Paths  
addons_path = /mnt/addons
data_dir = /var/lib/odoo

# STAGED MODULE LOADING - Start with minimal set
# Stage 1: Core system modules only
server_wide_modules = base,web

# Performance
workers = 0
max_cron_threads = 1

# Logging
log_level = info
logfile = /var/log/odoo/odoo.log

# Security
admin_passwd = admin123
list_db = False

# Network
proxy_mode = True
xmlrpc_port = 8069

# Prevent auto-load of all modules
without_demo = all
test_enable = False
init = base,web,mail,bus,portal,web_editor,base_setup