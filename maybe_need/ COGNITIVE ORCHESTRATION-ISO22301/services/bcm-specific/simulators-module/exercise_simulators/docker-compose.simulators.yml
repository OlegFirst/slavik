version: '3.8'

services:
  # JaamSim simulation engine
  jaamsim:
    build:
      context: .
      dockerfile: Dockerfile.jaamsim
    container_name: bcm-jaamsim
    volumes:
      - jaamsim_data:/opt/jaamsim/data
      - jaamsim_models:/opt/jaamsim/models
      - jaamsim_results:/opt/jaamsim/results
      - ./templates:/opt/jaamsim/templates:ro
    environment:
      JAVA_OPTS: "-Xmx2g -XX:+UseG1GC"
      JAAMSIM_HOME: "/opt/jaamsim"
      DISPLAY: ":99"  # Virtual display for headless mode
    ports:
      - "5900:5900"  # VNC for GUI access (optional)
    networks:
      - simulators-network
      - bcm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "java", "-version"]
      interval: 30s
      timeout: 10s
      retries: 3

  # X11 Virtual Display for JaamSim GUI (optional)
  xvfb:
    image: jlesage/x11vnc:v1.3.0
    container_name: bcm-xvfb
    environment:
      DISPLAY_WIDTH: 1280
      DISPLAY_HEIGHT: 1024
      VNC_PASSWORD: bcm2023
    ports:
      - "5901:5900"
    networks:
      - simulators-network
    restart: unless-stopped
    profiles:
      - gui

  # Exercise Simulators Bridge Service
  simulators-bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    container_name: bcm-simulators-bridge
    environment:
      JAAMSIM_PATH: "/opt/jaamsim"
      SIMULATORS_WORKING_DIR: "/app/exercises"
      NICS_URL: ${NICS_URL:-}
      NICS_API_KEY: ${NICS_API_KEY:-}
      BCM_API_URL: ${BCM_API_URL:-http://host.docker.internal:8069}
      BCM_API_KEY: ${BCM_API_KEY}
      BRIDGE_API_KEY: ${BRIDGE_API_KEY}
      LOG_LEVEL: info
      PORT: 8094
    ports:
      - "8094:8094"
    volumes:
      - simulators_exercises:/app/exercises
      - simulators_logs:/app/logs
      - jaamsim_results:/opt/jaamsim/results:ro
    networks:
      - simulators-network
      - bcm-network
    depends_on:
      - jaamsim
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8094/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Exercise Results Processor
  results-processor:
    build:
      context: .
      dockerfile: Dockerfile.processor
    container_name: bcm-results-processor
    environment:
      BCM_API_URL: ${BCM_API_URL:-http://host.docker.internal:8069}
      BCM_API_KEY: ${BCM_API_KEY}
      RESULTS_PROCESSING_INTERVAL: 300  # 5 minutes
      LOG_LEVEL: info
    volumes:
      - simulators_exercises:/app/exercises
      - simulators_results:/app/results
      - jaamsim_results:/app/jaamsim_results:ro
    networks:
      - simulators-network
      - bcm-network
    depends_on:
      - simulators-bridge
    restart: unless-stopped

  # Exercise Dashboard (optional web interface)
  exercise-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: bcm-exercise-dashboard
    environment:
      BRIDGE_API_URL: http://simulators-bridge:8094
      BRIDGE_API_KEY: ${BRIDGE_API_KEY}
      DASHBOARD_PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      - ./dashboard/public:/app/public
      - simulators_exercises:/app/exercises:ro
    networks:
      - simulators-network
      - bcm-network
    depends_on:
      - simulators-bridge
    restart: unless-stopped
    profiles:
      - dashboard
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for exercise state management
  exercise-redis:
    image: redis:7-alpine
    container_name: bcm-exercise-redis
    command: redis-server --requirepass ${EXERCISE_REDIS_PASSWORD:-exercise_secure_pass}
    volumes:
      - exercise_redis_data:/data
    networks:
      - simulators-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # PostgreSQL for exercise data storage
  exercise-postgres:
    image: postgres:15-alpine
    container_name: bcm-exercise-postgres
    environment:
      POSTGRES_DB: bcm_exercises
      POSTGRES_USER: bcm_exercises
      POSTGRES_PASSWORD: ${EXERCISE_DB_PASSWORD:-exercises_secure_pass}
    volumes:
      - exercise_postgres_data:/var/lib/postgresql/data
      - ./sql/init-exercises-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - simulators-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bcm_exercises -d bcm_exercises"]
      interval: 30s
      timeout: 10s
      retries: 5

  # NICS Web Application (if self-hosted)
  nics-web:
    image: nicinc/nics-web:latest
    container_name: bcm-nics-web
    environment:
      POSTGRES_HOST: nics-postgres
      POSTGRES_DB: nics
      POSTGRES_USER: nics
      POSTGRES_PASSWORD: ${NICS_DB_PASSWORD:-nics_secure_pass}
      GEOSERVER_URL: http://nics-geoserver:8080/geoserver
      RABBITMQ_HOST: nics-rabbitmq
      ELASTICSEARCH_HOST: nics-elasticsearch
      JWT_SECRET: ${NICS_JWT_SECRET:-nics_jwt_secret_change_in_production}
    ports:
      - "8443:8443"  # HTTPS
      - "8080:8080"  # HTTP
    volumes:
      - nics_uploads:/opt/nics-web/upload
      - nics_config:/opt/nics-web/config
    networks:
      - simulators-network
      - nics-network
    depends_on:
      - nics-postgres
      - nics-rabbitmq
      - nics-elasticsearch
    restart: unless-stopped
    profiles:
      - nics-selfhosted
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/nics/health"]
      interval: 60s
      timeout: 30s
      retries: 3

  # NICS PostgreSQL Database
  nics-postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: bcm-nics-postgres
    environment:
      POSTGRES_DB: nics
      POSTGRES_USER: nics
      POSTGRES_PASSWORD: ${NICS_DB_PASSWORD:-nics_secure_pass}
    volumes:
      - nics_postgres_data:/var/lib/postgresql/data
      - ./sql/nics-init.sql:/docker-entrypoint-initdb.d/01-nics-init.sql:ro
    networks:
      - nics-network
    restart: unless-stopped
    profiles:
      - nics-selfhosted
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nics -d nics"]
      interval: 30s
      timeout: 10s
      retries: 5

  # NICS RabbitMQ Message Broker
  nics-rabbitmq:
    image: rabbitmq:3.11-management-alpine
    container_name: bcm-nics-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: nics
      RABBITMQ_DEFAULT_PASS: ${NICS_RABBITMQ_PASSWORD:-nics_rabbitmq_pass}
    volumes:
      - nics_rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "15672:15672"  # Management UI
    networks:
      - nics-network
    restart: unless-stopped
    profiles:
      - nics-selfhosted
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # NICS Elasticsearch for search
  nics-elasticsearch:
    image: elasticsearch:8.11.0
    container_name: bcm-nics-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - nics_elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9202:9200"
    networks:
      - nics-network
    restart: unless-stopped
    profiles:
      - nics-selfhosted
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # NICS GeoServer for mapping
  nics-geoserver:
    image: kartoza/geoserver:2.22.0
    container_name: bcm-nics-geoserver
    environment:
      GEOSERVER_ADMIN_PASSWORD: ${NICS_GEOSERVER_PASSWORD:-geoserver_admin}
      INITIAL_MEMORY: 512M
      MAXIMUM_MEMORY: 1024M
    volumes:
      - nics_geoserver_data:/opt/geoserver/data_dir
    ports:
      - "8081:8080"
    networks:
      - nics-network
    restart: unless-stopped
    profiles:
      - nics-selfhosted
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/geoserver/web/"]
      interval: 60s
      timeout: 30s
      retries: 3

volumes:
  # JaamSim volumes
  jaamsim_data:
    driver: local
  jaamsim_models:
    driver: local
  jaamsim_results:
    driver: local
  
  # Exercise management volumes
  simulators_exercises:
    driver: local
  simulators_results:
    driver: local
  simulators_logs:
    driver: local
  
  # Database volumes
  exercise_redis_data:
    driver: local
  exercise_postgres_data:
    driver: local
  
  # NICS volumes
  nics_postgres_data:
    driver: local
  nics_rabbitmq_data:
    driver: local
  nics_elasticsearch_data:
    driver: local
  nics_geoserver_data:
    driver: local
  nics_uploads:
    driver: local
  nics_config:
    driver: local

networks:
  simulators-network:
    driver: bridge
    name: simulators-network
  nics-network:
    driver: bridge
    name: nics-network
  bcm-network:
    external: true
    name: bcm-network
