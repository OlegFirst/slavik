# JaamSim Template: IT System Failure Scenario
# BCM Platform Exercise Template
# Scenario: Critical IT infrastructure failure with backup activation

RecordEdits

# Probability distributions
Define DiscreteDistribution { FailureTypeDist }
Define ExponentialDistribution { RepairTimeDist }
Define UniformDistribution { UserRequestDist }

# Configure distributions
FailureTypeDist ValueList { 1 2 3 4 }
FailureTypeDist ProbabilityList { 0.4 0.3 0.2 0.1 }
# 1=Hardware, 2=Software, 3=Network, 4=Power

RepairTimeDist Mean { 4 h }
UserRequestDist MinValue { 1 min }
UserRequestDist MaxValue { 5 min }

# Entity types
Define EntityGenerator { UserRequestSource }
Define Queue { RequestQueue BackupQueue }
Define Server { PrimarySystem BackupSystem NetworkSwitch }
Define Branch { SystemRouter }
Define EntitySink { ProcessedRequests FailedRequests }
Define Assign { FailureDetector }
Define Seize { TechnicalTeam }
Define Release { TeamRelease }
Define Statistics { ResponseTimeStats DowntimeStats }

# BCM Resources
Define Resource { ITSupport BCMCoordinator EmergencyPower }
ITSupport Capacity { 3 }
BCMCoordinator Capacity { 1 }
EmergencyPower Capacity { 1 }

# Primary System Configuration
PrimarySystem Position { 0 0 0 m }
PrimarySystem Capacity { 100 }
PrimarySystem ServiceTime { UserRequestDist }
PrimarySystem NextComponent { ProcessedRequests }

# Backup System Configuration  
BackupSystem Position { 10 0 0 m }
BackupSystem Capacity { 50 }
BackupSystem ServiceTime { 2*UserRequestDist }
BackupSystem NextComponent { ProcessedRequests }

# Network Infrastructure
NetworkSwitch Position { 5 5 0 m }
NetworkSwitch Capacity { 200 }
NetworkSwitch ServiceTime { 0.1 s }

# User Request Generation
UserRequestSource Position { -10 0 0 m }
UserRequestSource FirstCreationTime { 0 s }
UserRequestSource InterArrivalTime { UserRequestDist }
UserRequestSource NextComponent { RequestQueue }
UserRequestSource MaxNumber { 1000 }

# Request Queuing
RequestQueue Position { -5 0 0 m }
RequestQueue Capacity { 50 }
RequestQueue NextComponent { SystemRouter }

# System Routing Logic
SystemRouter Position { 0 -5 0 m }
SystemRouter NextComponentList { PrimarySystem BackupSystem FailedRequests }
SystemRouter Choice { 'this.obj.PrimarySystem.OperatingThreshold > 0.5 ? 1 : (this.obj.BackupSystem.OperatingThreshold > 0.5 ? 2 : 3)' }

# Failure Detection and Response
FailureDetector Position { 0 5 0 m }
FailureDetector AttributeAssignmentList { { 'this.FailureTime' '[SimEntity].SimTime' } }
FailureDetector NextComponent { TechnicalTeam }

# Technical Team Response
TechnicalTeam Position { 5 -5 0 m }
TechnicalTeam ResourceName { ITSupport }
TechnicalTeam NextComponent { TeamRelease }

TeamRelease Position { 10 -5 0 m }
TeamRelease ResourceName { ITSupport }
TeamRelease NextComponent { ProcessedRequests }

# Sinks
ProcessedRequests Position { 15 0 0 m }
FailedRequests Position { 15 -10 0 m }

# Statistics Collection
ResponseTimeStats Position { 0 10 0 m }
ResponseTimeStats SampleValue { '[RequestQueue].QueueTime + [PrimarySystem].ServiceTime' }
ResponseTimeStats UnitType { TimeUnit }

DowntimeStats Position { 5 10 0 m }
DowntimeStats SampleValue { 'this.obj.PrimarySystem.OperatingThreshold < 0.1 ? 1 : 0' }
DowntimeStats UnitType { DimensionlessUnit }

# BCM Exercise Events
Define TimedEvent { InitialFailure BackupActivation RecoveryComplete }

InitialFailure FirstOccurrenceTime { 30 min }
InitialFailure TargetInput { PrimarySystem }
InitialFailure ActionCommand { 'SET PrimarySystem OperatingThreshold 0.0' }

BackupActivation FirstOccurrenceTime { 45 min }
BackupActivation TargetInput { BackupSystem }
BackupActivation ActionCommand { 'SET BackupSystem OperatingThreshold 1.0' }

RecoveryComplete FirstOccurrenceTime { 4 h }
RecoveryComplete TargetInput { PrimarySystem }
RecoveryComplete ActionCommand { 'SET PrimarySystem OperatingThreshold 1.0' }

# Simulation Settings
Define SimulationRun { ITFailureExercise }
ITFailureExercise Description { 'BCM IT System Failure Exercise' }
ITFailureExercise RunDuration { 8 h }
ITFailureExercise PauseTime { 0 s }

# View Configuration
Define View { ExerciseView }
ExerciseView Description { 'IT Failure Exercise View' }
ExerciseView ViewCenter { 5 0 0 m }
ExerciseView ViewPosition { -20 -20 25 m }
ExerciseView ShowLabels { TRUE }
ExerciseView ShowSubModels { TRUE }

# Output Files
Define FileToWrite { ExerciseResults }
ExerciseResults DataSource { ResponseTimeStats DowntimeStats }
ExerciseResults OutputFile { 'it_failure_results.csv' }
