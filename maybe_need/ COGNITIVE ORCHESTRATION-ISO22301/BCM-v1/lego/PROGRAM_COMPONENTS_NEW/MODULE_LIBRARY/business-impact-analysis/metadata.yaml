module_name: "business-impact-analysis"
display_name: "Business Impact Analysis"
version: "1.0.0"
description: "Comprehensive business impact analysis module for BCM"

# Возможности модуля
capabilities:
  - assess_business_impact
  - map_process_dependencies
  - calculate_rto_rpo
  - generate_bia_reports
  - risk_impact_correlation

# Источники данных модуля
sources:
  odoo_module:
    path: "./odoo-source/bcm_bia"
    models: ["bcm.bia.assessment", "bcm.bia.dependency", "bcm.bia.impact"]
    api_endpoints: ["/api/bia/assess", "/api/bia/dependencies"]

  standalone_engine:
    path: "./bia-engine"
    type: "python_service"
    api_base: "http://bia-engine:8080"

# Интеграция с универсальной системой
system_integration:
  required_functions: [1, 2, 3, 4]  # ORCHESTRATION, EVENTS, PROCESSING, STORAGE
  event_subscriptions: ["business.process.*", "risk.*", "organization.*"]
  data_dependencies: ["processes", "risks", "organizational_structure"]

# Конфигурация адаптера
adapter_config:
  odoo_adapter:
    module_name: "bcm_bia"
    system_alias: "business-impact-analysis"
    transform_rules:
      input: "system_bia_request_to_odoo"
      output: "odoo_bia_result_to_system"

# API методы для Bridge Layer
bridge_api:
  assess_impact:
    input_format: "system_standard"
    processing_method: "adaptive"
    output_format: "personalized"

  map_dependencies:
    input_format: "system_standard"
    processing_method: "intelligent"
    output_format: "contextual"

# Персонализация
personalization:
  user_roles: ["bia_analyst", "risk_manager", "business_owner"]
  contextual_factors: ["industry", "organization_size", "compliance_requirements"]
  adaptive_parameters: ["assessment_depth", "reporting_detail", "visualization_type"]

# Безопасность
security:
  access_control: "role_based"
  data_classification: "confidential"
  audit_logging: true