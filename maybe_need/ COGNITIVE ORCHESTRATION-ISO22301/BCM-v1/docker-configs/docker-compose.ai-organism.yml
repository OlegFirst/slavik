# Digital BCM Organism - AI Services Configuration
# Specialized AI Organs with Intelligence Coordination

version: '3.8'

services:
  # ===========================================
  # STRATEGIC INTELLIGENCE (Anthropic-Powered)
  # ===========================================

  # Governance Brain - Strategic Intelligence Center
  governance-brain-service:
    build:
      context: ./services/ai_orchestrator
      dockerfile: Dockerfile
    environment:
      - AI_ORGAN_TYPE=governance_brain
      - AI_PROVIDER=anthropic
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PERSONALITY=wise_ruler
      - INTELLIGENCE_LEVEL=strategic
      - SPECIALIZATION=governance_compliance_policy
    ports:
      - "8100:8000"
    depends_on:
      - postgres
      - redis
    labels:
      - "ai.organ.type=governance_brain"
      - "ai.provider=anthropic"
      - "ai.intelligence=strategic"

  # ===========================================
  # OPERATIONAL INTELLIGENCE (Local Models)
  # ===========================================

  # Emergency Response System - Crisis Management
  emergency-response-service:
    build:
      context: ./services/ai_orchestrator
      dockerfile: Dockerfile
    environment:
      - AI_ORGAN_TYPE=emergency_response
      - AI_PROVIDER=local_fast
      - PERSONALITY=emergency_responder
      - RESPONSE_TIME_TARGET=10
      - SPECIALIZATION=crisis_incident_emergency
    ports:
      - "8101:8000"
    depends_on:
      - redis
      - notification_service
    labels:
      - "ai.organ.type=emergency_response"
      - "ai.provider=local"
      - "ai.speed=fast"

  # Impact Oracle - Predictive Analysis Engine
  impact-oracle-service:
    build:
      context: ./services/ai_orchestrator
      dockerfile: Dockerfile
    environment:
      - AI_ORGAN_TYPE=impact_oracle
      - AI_PROVIDER=local_predictive
      - PERSONALITY=analytical_oracle
      - PREDICTION_ACCURACY_TARGET=0.85
      - SPECIALIZATION=impact_prediction_bia
      - DIGITAL_TWIN_INTEGRATION=ready
    ports:
      - "8102:8000"
    depends_on:
      - bia_engine
      - postgres
    labels:
      - "ai.organ.type=impact_oracle"
      - "ai.capability=prediction"
      - "ai.digital_twin=ready"

  # Scenario Creator - Creative Intelligence Engine
  scenario-creator-service:
    build:
      context: ./services/scenario_orchestrator
      dockerfile: Dockerfile
    environment:
      - AI_ORGAN_TYPE=scenario_creator
      - AI_PROVIDER=local_creative
      - PERSONALITY=creative_visionary
      - CREATIVITY_LEVEL=0.8
      - SPECIALIZATION=scenario_generation_creativity
    ports:
      - "8103:8085"
    depends_on:
      - ai_orchestrator
      - redis
    labels:
      - "ai.organ.type=scenario_creator"
      - "ai.capability=creative"
      - "ai.learning=adaptive"

  # Risk Advisor - Predictive Risk Intelligence
  risk-advisor-service:
    build:
      context: ./services/ai_orchestrator
      dockerfile: Dockerfile
    environment:
      - AI_ORGAN_TYPE=risk_advisor
      - AI_PROVIDER=local_analytical
      - PERSONALITY=risk_analyst
      - FAIR_METHODOLOGY=enabled
      - MONTE_CARLO_ITERATIONS=10000
      - SPECIALIZATION=risk_prediction_fair
    ports:
      - "8104:8000"
    depends_on:
      - postgres
      - redis
    labels:
      - "ai.organ.type=risk_advisor"
      - "ai.methodology=fair"
      - "ai.simulation=monte_carlo"

  # ===========================================
  # COMPLIANCE INTELLIGENCE (Automated)
  # ===========================================

  # Compliance Guardian - Automated Monitoring
  compliance-guardian-service:
    build:
      context: ./services/compliance_checker
      dockerfile: Dockerfile
    environment:
      - AI_ORGAN_TYPE=compliance_guardian
      - AI_PROVIDER=automated_compliance
      - PERSONALITY=vigilant_guardian
      - MONITORING_FREQUENCY=continuous
      - SPECIALIZATION=iso22301_compliance
    ports:
      - "8105:8084"
    depends_on:
      - postgres
      - eventbus
    labels:
      - "ai.organ.type=compliance_guardian"
      - "ai.automation=continuous"
      - "ai.compliance=iso22301"

  # Performance Analyst - KPI Intelligence
  performance-analyst-service:
    build:
      context: ./services/ai_orchestrator
      dockerfile: Dockerfile
    environment:
      - AI_ORGAN_TYPE=performance_analyst
      - AI_PROVIDER=local_analytics
      - PERSONALITY=data_analyst
      - KPI_AUTOMATION=enabled
      - SPECIALIZATION=performance_kpi_analytics
    ports:
      - "8106:8000"
    depends_on:
      - postgres
      - redis
    labels:
      - "ai.organ.type=performance_analyst"
      - "ai.capability=analytics"
      - "ai.automation=kpi"

  # ===========================================
  # LEARNING INTELLIGENCE (Adaptive)
  # ===========================================

  # Learning Coach - Adaptive Training Intelligence
  learning-coach-service:
    build:
      context: ./services/ai_orchestrator
      dockerfile: Dockerfile
    environment:
      - AI_ORGAN_TYPE=learning_coach
      - AI_PROVIDER=local_adaptive
      - PERSONALITY=supportive_coach
      - LEARNING_ADAPTATION=enabled
      - SPECIALIZATION=training_competency_learning
    ports:
      - "8107:8000"
    depends_on:
      - postgres
      - redis
    labels:
      - "ai.organ.type=learning_coach"
      - "ai.capability=adaptive"
      - "ai.learning=continuous"

  # Plan Generator - Intelligent Planning
  plan-generator-service:
    build:
      context: ./services/ai_orchestrator
      dockerfile: Dockerfile
    environment:
      - AI_ORGAN_TYPE=plan_generator
      - AI_PROVIDER=local_planning
      - PERSONALITY=strategic_planner
      - BIA_INTEGRATION=enabled
      - SPECIALIZATION=continuity_planning_strategy
    ports:
      - "8108:8000"
    depends_on:
      - bia_engine
      - postgres
    labels:
      - "ai.organ.type=plan_generator"
      - "ai.capability=planning"
      - "ai.integration=bia"

  # ===========================================
  # AI COORDINATION & COMMUNICATION
  # ===========================================

  # AI Organism Coordinator - Central Intelligence
  ai-organism-coordinator:
    build:
      context: ./services/ai_orchestrator
      dockerfile: Dockerfile
    environment:
      - AI_ROLE=organism_coordinator
      - COORDINATION_MODE=ecosystem_awareness
      - CONSCIOUSNESS_LEVEL=collective_intelligence
      - MEMORY_COORDINATION=enabled
    ports:
      - "8109:8000"
    depends_on:
      - governance-brain-service
      - emergency-response-service
      - impact-oracle-service
      - scenario-creator-service
      - risk-advisor-service
    labels:
      - "ai.role=coordinator"
      - "ai.consciousness=collective"
      - "ai.ecosystem=orchestration"

  # Enhanced MCP Server - Chat Integration
  ai-organism-mcp:
    build:
      context: ./integrations/mcp-server
      dockerfile: Dockerfile
    environment:
      - MCP_VERSION=2.0.0
      - AI_ORGANISMS_ENABLED=true
      - CHAT_INTERFACE=enabled
      - ANTHROPIC_INTEGRATION=true
      - ORGANISM_TOOLS=10_organs
    ports:
      - "8110:8080"
    depends_on:
      - ai-organism-coordinator
      - governance-brain-service
      - emergency-response-service
    labels:
      - "mcp.version=2.0"
      - "mcp.organisms=enabled"
      - "mcp.chat=anthropic"

volumes:
  ai_organism_memory:
  governance_brain_memory:
  emergency_response_memory:
  impact_oracle_memory:
  scenario_creator_memory:
  risk_advisor_memory:
  compliance_guardian_memory:
  performance_analyst_memory:
  learning_coach_memory:
  plan_generator_memory:

networks:
  ai-organism-network:
    driver: bridge
    labels:
      - "ai.network=organism"
      - "ai.intelligence=collective"