version: '3.8'

# BACKEND СЕРВИСЫ
# Запуск: docker-compose -f compose/docker-compose.backend.yml up -d

services:
  # EventBus Service
  eventbus:
    build:
      context: ./backend/eventbus
      dockerfile: Dockerfile
    depends_on:
      - redis
      - postgres
    environment:
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_URL=postgresql://odoo:${DB_PASSWORD:-postgres123}@postgres:5432/bcm_platform
    ports:
      - "8001:8001"
    volumes:
      - ./backend/eventbus:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # BPMN Service
  bpmn_service:
    build:
      context: ./backend/bpmn_service
      dockerfile: Dockerfile
    depends_on:
      - redis
      - eventbus
    environment:
      - EVENTBUS_URL=http://eventbus:8001
      - POSTGRES_URL=postgresql://odoo:${DB_PASSWORD:-postgres123}@postgres:5432/bcm_platform
    ports:
      - "8005:8005"
    volumes:
      - ./backend/bpmn_service:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8005/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Adapter Services
  lms_adapter:
    build:
      context: ./backend/lms_adapter
      dockerfile: Dockerfile
    depends_on:
      - eventbus
    environment:
      - EVENTBUS_URL=http://eventbus:8001
    ports:
      - "8006:8006"
    volumes:
      - ./backend/lms_adapter:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8006/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3

  thehive_adapter:
    build:
      context: ./backend/thehive_adapter
      dockerfile: Dockerfile
    depends_on:
      - eventbus
    environment:
      - EVENTBUS_URL=http://eventbus:8001
    ports:
      - "8007:8007"
    volumes:
      - ./backend/thehive_adapter:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8007/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana_adapter:
    build:
      context: ./backend/grafana_adapter
      dockerfile: Dockerfile
    depends_on:
      - eventbus
    environment:
      - EVENTBUS_URL=http://eventbus:8001
    ports:
      - "8008:8008"
    volumes:
      - ./backend/grafana_adapter:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8008/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  default:
    external: true
    name: iso-22301_default