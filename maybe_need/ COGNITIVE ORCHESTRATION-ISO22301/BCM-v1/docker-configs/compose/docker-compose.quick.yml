# Самая минимальная конфигурация для быстрого запуска
# Только базовые сервисы + frontend в dev режиме

services:
  # База данных
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: bcm_platform
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: bcm
      RABBITMQ_DEFAULT_PASS: bcm123
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 3

  # Simple mock API gateway для frontend
  api_gateway:
    image: node:18-alpine
    working_dir: /app
    command: |
      sh -c "npm init -y && npm install express cors && node -e \"
      const express = require('express');
      const cors = require('cors');
      const app = express();
      app.use(cors());
      app.use(express.json());

      // Health check
      app.get('/health', (req, res) => res.json({status: 'ok'}));

      // Mock API endpoints
      app.get('/api/*', (req, res) => res.json({message: 'Mock API response', path: req.path}));
      app.post('/api/*', (req, res) => res.json({message: 'Mock API response', path: req.path}));

      app.listen(8095, () => console.log('Mock API Gateway running on port 8095'));
      \""
    ports:
      - "8095:8095"
    depends_on:
      - postgres
      - redis