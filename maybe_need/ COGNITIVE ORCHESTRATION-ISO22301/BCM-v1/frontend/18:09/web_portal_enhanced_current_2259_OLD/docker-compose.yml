version: '3.8'

services:
  # BCM Web Portal v2 Frontend
  bcm-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_TITLE: "BCM Platform v2"
        VITE_API_BASE_URL: "http://localhost:8000/api"
        VITE_API_VERSION: "v1"
        VITE_APP_ENV: "production"
    container_name: bcm-web-portal-v2
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - bcm-network
    environment:
      - TZ=UTC
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bcm-frontend.rule=Host(`bcm.example.com`)"
      - "traefik.http.routers.bcm-frontend.entrypoints=websecure"
      - "traefik.http.routers.bcm-frontend.tls.certresolver=letsencrypt"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - nginx-logs:/var/log/nginx
    depends_on:
      - bcm-backend

  # BCM Backend API (placeholder - replace with actual backend service)
  bcm-backend:
    image: bcm-backend:latest  # Replace with actual backend image
    container_name: bcm-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - bcm-network
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://bcm_user:bcm_password@postgres:5432/bcm_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-jwt-secret-here
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - postgres
      - redis

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: bcm-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=bcm_db
      - POSTGRES_USER=bcm_user
      - POSTGRES_PASSWORD=bcm_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - bcm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bcm_user -d bcm_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: bcm-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis_password
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - bcm-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_password", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Traefik Reverse Proxy (optional)
  traefik:
    image: traefik:v3.0
    container_name: bcm-traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=admin@example.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Traefik dashboard
    networks:
      - bcm-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.bcm.example.com`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik.service=api@internal"

  # Monitoring with Prometheus (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: bcm-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    networks:
      - bcm-network
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  # Grafana for visualization (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: bcm-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    networks:
      - bcm-network
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources

networks:
  bcm-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  nginx-logs:
    driver: local
  traefik-certs:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local