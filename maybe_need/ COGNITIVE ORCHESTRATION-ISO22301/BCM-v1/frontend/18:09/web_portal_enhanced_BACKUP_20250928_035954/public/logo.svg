<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- BCM Platform Logo -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#logoGradient)" stroke="none"/>

  <!-- Shield icon representing business continuity and protection -->
  <path d="M32 8L20 14V26C20 36.4 25.6 46.2 32 48C38.4 46.2 44 36.4 44 26V14L32 8Z"
        fill="white" stroke="none"/>

  <!-- Inner layers representing BCM processes -->
  <path d="M32 12L24 16V26C24 33.2 27.6 40.2 32 42C36.4 40.2 40 33.2 40 26V16L32 12Z"
        fill="url(#logoGradient)" stroke="none" opacity="0.3"/>

  <!-- Center checkmark for completed/secure status -->
  <path d="M28 26L30 28L36 22" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Connection lines representing integrated BCM modules -->
  <circle cx="18" cy="18" r="3" fill="white" opacity="0.8"/>
  <circle cx="46" cy="18" r="3" fill="white" opacity="0.8"/>
  <circle cx="18" cy="46" r="3" fill="white" opacity="0.8"/>
  <circle cx="46" cy="46" r="3" fill="white" opacity="0.8"/>

  <!-- Connection lines -->
  <line x1="21" y1="18" x2="29" y2="24" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <line x1="43" y1="18" x2="35" y2="24" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <line x1="21" y1="46" x2="29" y2="40" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <line x1="43" y1="46" x2="35" y2="40" stroke="white" stroke-width="1.5" opacity="0.6"/>
</svg>