# Blackbox Exporter Configuration for BCM Platform
modules:
  # HTTP 2xx response check
  http_2xx:
    prober: http
    timeout: 10s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200]
      method: GET
      headers:
        User-Agent: "BCM-Platform-Monitor/1.0"
      fail_if_ssl: false
      fail_if_not_ssl: false
      tls_config:
        insecure_skip_verify: false
      preferred_ip_protocol: "ip4"
      follow_redirects: true
      
  # HTTP POST with JSON payload for APIs
  http_post_2xx:
    prober: http
    timeout: 10s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200, 201, 202]
      method: POST
      headers:
        Content-Type: "application/json"
        User-Agent: "BCM-Platform-Monitor/1.0"
      body: '{"jsonrpc": "2.0", "method": "version", "id": 1}'
      
  # HTTPS with SSL certificate validation
  https_2xx:
    prober: http
    timeout: 10s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200]
      method: GET
      fail_if_not_ssl: true
      tls_config:
        insecure_skip_verify: false
      preferred_ip_protocol: "ip4"
      
  # SSL certificate expiry check
  ssl_expire:
    prober: http
    timeout: 10s
    http:
      method: GET
      fail_if_not_ssl: true
      tls_config:
        insecure_skip_verify: false
      preferred_ip_protocol: "ip4"
      
  # TCP connection check
  tcp_connect:
    prober: tcp
    timeout: 10s
    tcp:
      preferred_ip_protocol: "ip4"
      
  # Database connection check (PostgreSQL)
  postgres_connect:
    prober: tcp
    timeout: 10s
    tcp:
      preferred_ip_protocol: "ip4"
      query_response:
        - expect: "^\\x00"
          send: "\\x00\\x00\\x00\\x17\\x00\\x03\\x00\\x00user\\x00postgres\\x00\\x00"
          
  # Redis connection check
  redis_connect:
    prober: tcp
    timeout: 10s
    tcp:
      preferred_ip_protocol: "ip4"
      query_response:
        - send: "PING\r\n"
        - expect: "PONG"
        
  # DNS resolution check
  dns_check:
    prober: dns
    timeout: 10s
    dns:
      preferred_ip_protocol: "ip4"
      query_type: "A"
      
  # ICMP ping check
  icmp_check:
    prober: icmp
    timeout: 10s
    icmp:
      preferred_ip_protocol: "ip4"
      dont_fragment: false
      
  # BCM Platform specific health check
  bcm_health_check:
    prober: http
    timeout: 15s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200]
      method: GET
      headers:
        Accept: "application/json"
        User-Agent: "BCM-Platform-Health-Monitor/1.0"
      fail_if_body_not_matches_regexp:
        - '"status":\s*"(healthy|ok)"'
      preferred_ip_protocol: "ip4"
      
  # TheHive API health check
  thehive_api_check:
    prober: http
    timeout: 15s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200]
      method: GET
      headers:
        Accept: "application/json"
        User-Agent: "BCM-Platform-Monitor/1.0"
      fail_if_body_not_matches_regexp:
        - '"name":\s*"thehive"'
      preferred_ip_protocol: "ip4"
      
  # Moodle health check
  moodle_health_check:
    prober: http
    timeout: 15s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200]
      method: GET
      headers:
        User-Agent: "BCM-Platform-Monitor/1.0"
      fail_if_body_not_matches_regexp:
        - '<title>.*Moodle.*</title>'
      preferred_ip_protocol: "ip4"
      
  # WebDAV check for file storage
  webdav_check:
    prober: http
    timeout: 10s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200, 207]
      method: PROPFIND
      headers:
        Depth: "0"
        Content-Type: "text/xml"
        User-Agent: "BCM-Platform-Monitor/1.0"
      body: |
        <?xml version="1.0" encoding="utf-8" ?>
        <propfind xmlns="DAV:">
          <prop>
            <displayname/>
          </prop>
        </propfind>
        
  # SMTP mail server check
  smtp_check:
    prober: tcp
    timeout: 10s
    tcp:
      preferred_ip_protocol: "ip4"
      query_response:
        - expect: "^220"
        - send: "EHLO bcm-platform-monitor"
        - expect: "^250"
        - send: "QUIT"
