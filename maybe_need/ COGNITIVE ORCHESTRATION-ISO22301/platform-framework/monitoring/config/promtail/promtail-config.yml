# Promtail Configuration for BCM Platform Log Collection
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    tenant_id: bcm-platform

scrape_configs:
  # System logs
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*.log
          component: system
          environment: production
    
    pipeline_stages:
      - match:
          selector: '{job="varlogs"}'
          stages:
            - regex:
                expression: '^(?P<timestamp>\S+\s+\S+\s+\S+)\s+(?P<host>\S+)\s+(?P<process>\S+):\s+(?P<message>.*)$'
            - timestamp:
                source: timestamp
                format: 'Jan 02 15:04:05'
            - labels:
                host:
                process:

  # BCM Platform application logs
  - job_name: bcm-platform-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: bcm-platform
          __path__: /var/log/bcm-platform/*.log
          component: bcm-platform
          service: core
          environment: production
    
    pipeline_stages:
      - match:
          selector: '{job="bcm-platform"}'
          stages:
            - json:
                expressions:
                  timestamp: timestamp
                  level: level
                  message: message
                  module: module
                  user_id: user_id
                  company_id: company_id
                  request_id: request_id
            - timestamp:
                source: timestamp
                format: '2006-01-02T15:04:05.000000Z'
            - labels:
                level:
                module:
                company_id:

  # Docker container logs
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*.log
          component: docker
          environment: production
    
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs:
      - json:
          source: attrs
          expressions:
            tag:
      - regex:
          source: tag
          expression: '^(?P<container_name>\S+)'
      - timestamp:
          source: time
          format: RFC3339Nano
      - labels:
          stream:
          container_name:
      - output:
          source: output

  # TheHive integration logs
  - job_name: thehive-integration
    static_configs:
      - targets:
          - localhost
        labels:
          job: thehive-integration
          __path__: /var/log/thehive-integration/*.log
          component: thehive
          service: integration
          environment: production
    
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            service: service
            case_id: case_id
            incident_id: incident_id
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          level:
          service:

  # Moodle integration logs
  - job_name: moodle-integration
    static_configs:
      - targets:
          - localhost
        labels:
          job: moodle-integration
          __path__: /var/log/moodle-integration/*.log
          component: moodle
          service: integration
          environment: production
    
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            service: service
            user_id: user_id
            course_id: course_id
            company_id: company_id
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          level:
          service:
          company_id:

  # Nginx/Apache access logs
  - job_name: nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          __path__: /var/log/nginx/access.log
          component: nginx
          log_type: access
          environment: production
    
    pipeline_stages:
      - regex:
          expression: '^(?P<remote_addr>\S+) \S+ \S+ \[(?P<time_local>[\w:/]+\s[+\-]\d{4})\] "(?P<method>\S+) (?P<request>\S+) (?P<protocol>\S+)" (?P<status>\d+) (?P<body_bytes_sent>\d+) "(?P<http_referer>[^"]*)" "(?P<http_user_agent>[^"]*)".*'
      - timestamp:
          source: time_local
          format: '02/Jan/2006:15:04:05 -0700'
      - labels:
          method:
          status:
          remote_addr:
      - template:
          source: message
          template: '{{ .method }} {{ .request }} {{ .status }}'

  # PostgreSQL logs
  - job_name: postgresql
    static_configs:
      - targets:
          - localhost
        labels:
          job: postgresql
          __path__: /var/log/postgresql/*.log
          component: database
          service: postgresql
          environment: production
    
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3} \w+) \[(?P<pid>\d+)\] (?P<level>\w+):\s+(?P<message>.*)$'
      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05.000 MST'
      - labels:
          level:
          pid:

  # Redis logs
  - job_name: redis
    static_configs:
      - targets:
          - localhost
        labels:
          job: redis
          __path__: /var/log/redis/*.log
          component: cache
          service: redis
          environment: production
    
    pipeline_stages:
      - regex:
          expression: '^(?P<pid>\d+):\w (?P<timestamp>\d{2} \w{3} \d{4} \d{2}:\d{2}:\d{2}\.\d{3}) (?P<level>\*|#|-) (?P<message>.*)$'
      - timestamp:
          source: timestamp
          format: '02 Jan 2006 15:04:05.000'
      - labels:
          level:
          pid:

  # Application security logs
  - job_name: security-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: security
          __path__: /var/log/security/*.log
          component: security
          environment: production
          priority: high
    
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            event_type: event_type
            user_id: user_id
            ip_address: ip_address
            user_agent: user_agent
            message: message
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          level:
          event_type:
          user_id:

  # Audit trail logs
  - job_name: audit-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: audit
          __path__: /var/log/audit/*.log
          component: audit
          environment: production
          compliance: iso22301
    
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            action: action
            resource: resource
            user_id: user_id
            company_id: company_id
            ip_address: ip_address
            result: result
            details: details
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          action:
          resource:
          user_id:
          company_id:
          result:
