{%- assign social_links = site.social_links -%}

{%- if social_links -%}
  <ul class="social-media-list">
    {%- for link in social_links -%}
      {%- if link contains "github.com" -%}
        <li><a rel="me" href="{{ link }}" title="{{ link | split: '/' | last }}"><svg class="svg-icon grey"><use xlink:href="{{ 'assets/minima-social-icons.svg#github' | relative_url }}"></use></svg></a></li>
      {%- elsif link contains "twitter.com" -%}
        <li><a rel="me" href="{{ link }}" title="{{ link | split: '/' | last }}"><svg class="svg-icon grey"><use xlink:href="{{ 'assets/minima-social-icons.svg#twitter' | relative_url }}"></use></svg></a></li>
      {%- elsif link contains "linkedin.com" -%}
        <li><a rel="me" href="{{ link }}" title="{{ link | split: '/' | last }}"><svg class="svg-icon grey"><use xlink:href="{{ 'assets/minima-social-icons.svg#linkedin' | relative_url }}"></use></svg></a></li>
      {%- endif -%}
    {%- endfor -%}
  </ul>
{%- endif -%}
