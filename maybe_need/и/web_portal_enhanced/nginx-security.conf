# Additional security configuration for nginx
# Enhanced security headers and protection measures

# Hide nginx version
server_tokens off;

# Prevent clickjacking
add_header X-Frame-Options "DENY" always;

# Prevent MIME type confusion
add_header X-Content-Type-Options "nosniff" always;

# XSS protection
add_header X-XSS-Protection "1; mode=block" always;

# Referrer policy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions policy
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), cross-origin-isolated=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), keyboard-map=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(), usb=(), web-share=(), xr-spatial-tracking=()" always;

# Strict transport security (HTTPS only - enable only if using HTTPS)
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Content Security Policy (restrictive - adjust as needed)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https:; media-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=strict:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=3r/m;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=addr:10m;

# Block common bad bots and scanners
map $http_user_agent $bad_bot {
    default 0;
    ~*(?i)(360Spider|acapbot|acoonbot|ahrefs|alexibot|asterias|attackbot|backdorbot|becomebot|binlar|blackwidow|blekkobot|blex|blowfish|bullseye|bunnys|butterfly|careerbot|casper|checkpriv|cheesebot|cherrypick|chinaclaw|choppy|clshttp|cmsworld|coccoc|collision|cosmos|crescent|curl|cybele|cymru|dataaccesslayer|dbot|disco|dittospyder|dotbot|dotnetdotcom|dumbot|emailcollector|emailsiphon|emailwolf|extract|eyenetie|feedfinder|flaming|flashget|flicky|foobot|g00g1e|getright|gigabot|go-ahead-got|gozilla|grabnet|grafula|harvest|heritrix|httprack|icarus6j|jetbot|jetcar|jikespider|kmccrew|leechftp|libweb|linkdex|linkscan|linkwalker|loader|masscan|miner|majestic|mechanize|mj12bot|morfeus|moveoverbot|netmechanic|netspider|nicerspro|nikto|ninja|nutch|octopus|pagegrabber|petalbot|planetwork|postrank|proximic|purebot|pycurl|python|queryn|queryseeker|radian6|radiation|realdownload|rogerbot|scooter|seekerspider|semalt|siclab|sindice|sistrix|sitebot|siteexplorer|sitesnagger|skygrid|smartdownload|snoopy|sosospider|spankbot|spbot|sqlmap|stackrambler|stripper|sucker|surftbot|sux0r|suzukacz|suzuran|takeout|teleport|telesoft|true_robots|turingos|turnit|vampire|vikspider|voideye|webleacher|webreaper|webstripper|webvac|webviewer|webwhacker|winhttp|wwwoffle|woxbot|xaldon|xxxyy|yamanalab|yioopbot|youda|zeus|zmeu|zune|zyborg) 1;
}

# Block requests from bad bots
if ($bad_bot = 1) {
    return 403;
}

# Block requests with suspicious patterns
map $request_uri $suspicious_request {
    default 0;
    ~*(?i)(\.php|\.asp|\.aspx|\.jsp|wp-admin|phpmyadmin|adminer|admin|login\.php|xmlrpc\.php) 1;
    ~*(?i)(eval\(|base64_decode|gzinflate|str_rot13|shell_exec|passthru|system|exec) 1;
    ~*(?i)(\<script|\<iframe|\<object|\<embed) 1;
}

# Block suspicious requests
if ($suspicious_request = 1) {
    return 403;
}

# Block requests with no user agent
if ($http_user_agent = "") {
    return 403;
}

# Block requests with suspicious user agents
if ($http_user_agent ~* (?i)(bot|crawler|spider|scraper|wget|curl)) {
    set $block_ua 1;
}

# Allow legitimate crawlers
if ($http_user_agent ~* (?i)(googlebot|bingbot|slurp|duckduckbot|baiduspider|yandexbot|sogou|facebookexternalhit|twitterbot|rogerbot|linkedinbot|embedly|quora|showyoubot|outbrain|pinterest|developers\.google\.com)) {
    set $block_ua 0;
}

# Block based on user agent check
if ($block_ua = 1) {
    return 403;
}

# Rate limiting for different endpoints
location ~ /api/auth/ {
    limit_req zone=auth burst=5 nodelay;
    limit_conn addr 5;
}

location ~ /api/ {
    limit_req zone=general burst=20 nodelay;
    limit_conn addr 10;
}

# Block access to sensitive files
location ~* \.(log|conf|config|cfg|ini|sql|bak|backup|tmp|temp|cache)$ {
    deny all;
}

# Block access to version control directories
location ~ /\.(git|svn|hg|bzr) {
    deny all;
}

# Block access to composer and npm files
location ~* (composer\.(json|lock)|package(-lock)?\.json|yarn\.lock|Gruntfile\.js|gulpfile\.js|webpack\.config\.js) {
    deny all;
}

# Prevent access to environment files
location ~* \.(env|environment) {
    deny all;
}