# AI-Platform-ISO Analysis Configuration

# Directories to scan
scan_paths:
  - platform-services/validation-service
  - platform-services/documents-service
  - platform-services/governance-service
  - platform-services/incident-service
  - shared

# Exclude patterns
exclude:
  - "*/venv/*"
  - "*/__pycache__/*"
  - "*/migrations/*"
  - "*/.pytest_cache/*"

# Analysis settings
complexity:
  max_cyclomatic: 10
  max_cognitive: 15
  warn_threshold: 5

security:
  confidence_level: "HIGH"
  severity_level: "MEDIUM"

# Output formats
reports:
  formats: ["json", "html", "markdown"]
  output_dir: "tools/reports"

# Documentation
docs:
  api_format: "openapi"
  include_examples: true
  auto_generate_ui: true
