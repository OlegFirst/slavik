# BCM Platform Alerting Rules
groups:
  - name: bcm-platform-core
    rules:
      # BCM Platform Core Service Health
      - alert: BCMPlatformDown
        expr: up{job="bcm-platform-core"} == 0
        for: 1m
        labels:
          severity: critical
          service: bcm-platform
          component: core
        annotations:
          summary: "BCM Platform core service is down"
          description: "The BCM Platform core service has been down for more than 1 minute."
          runbook_url: "https://docs.bcm-platform.local/runbooks/core-service-down"

      # High Response Time
      - alert: BCMPlatformHighResponseTime
        expr: http_request_duration_seconds{job="bcm-platform-core",quantile="0.95"} > 5
        for: 5m
        labels:
          severity: warning
          service: bcm-platform
          component: core
        annotations:
          summary: "BCM Platform high response time"
          description: "95th percentile response time is {{ $value }}s for BCM Platform core service."

      # High Error Rate
      - alert: BCMPlatformHighErrorRate
        expr: rate(http_requests_total{job="bcm-platform-core",code=~"5.."}[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
          service: bcm-platform
          component: core
        annotations:
          summary: "BCM Platform high error rate"
          description: "Error rate is {{ $value | humanizePercentage }} for BCM Platform core service."

      # Memory Usage High
      - alert: BCMPlatformHighMemoryUsage
        expr: process_resident_memory_bytes{job="bcm-platform-core"} / 1024 / 1024 / 1024 > 4
        for: 10m
        labels:
          severity: warning
          service: bcm-platform
          component: core
        annotations:
          summary: "BCM Platform high memory usage"
          description: "BCM Platform is using {{ $value }}GB of memory."

  - name: bcm-database
    rules:
      # Database Connection Issues
      - alert: BCMDatabaseDown
        expr: up{job="bcm-postgres"} == 0
        for: 1m
        labels:
          severity: critical
          service: bcm-platform
          component: database
        annotations:
          summary: "BCM Platform database is down"
          description: "PostgreSQL database for BCM Platform is not responding."

      # High Database Connection Usage
      - alert: BCMDatabaseHighConnections
        expr: pg_stat_activity_count{job="bcm-postgres"} > 80
        for: 5m
        labels:
          severity: warning
          service: bcm-platform
          component: database
        annotations:
          summary: "BCM Platform database high connection count"
          description: "Database has {{ $value }} active connections, approaching limit."

      # Slow Queries
      - alert: BCMDatabaseSlowQueries
        expr: rate(pg_stat_activity_max_tx_duration{job="bcm-postgres"}[5m]) > 30
        for: 10m
        labels:
          severity: warning
          service: bcm-platform
          component: database
        annotations:
          summary: "BCM Platform database slow queries detected"
          description: "Database has queries running longer than 30 seconds."

      # Disk Space Low
      - alert: BCMDatabaseDiskSpaceLow
        expr: pg_database_size_bytes{job="bcm-postgres"} / 1024 / 1024 / 1024 > 50
        for: 5m
        labels:
          severity: warning
          service: bcm-platform
          component: database
        annotations:
          summary: "BCM Platform database disk usage high"
          description: "Database size is {{ $value }}GB, monitor disk space."

  - name: bcm-integrations
    rules:
      # TheHive Integration Health
      - alert: TheHiveIntegrationDown
        expr: up{job="thehive-bridge"} == 0
        for: 2m
        labels:
          severity: critical
          service: bcm-platform
          component: thehive-integration
        annotations:
          summary: "TheHive integration service is down"
          description: "TheHive bridge service has been down for more than 2 minutes."

      - alert: TheHiveWebhookDown
        expr: up{job="thehive-webhook"} == 0
        for: 2m
        labels:
          severity: critical
          service: bcm-platform
          component: thehive-webhook
        annotations:
          summary: "TheHive webhook receiver is down"
          description: "TheHive webhook receiver has been down for more than 2 minutes."

      # Moodle Integration Health
      - alert: MoodleIntegrationDown
        expr: up{job="moodle-bridge"} == 0
        for: 2m
        labels:
          severity: critical
          service: bcm-platform
          component: moodle-integration
        annotations:
          summary: "Moodle integration service is down"
          description: "Moodle bridge service has been down for more than 2 minutes."

      - alert: MoodleWebhookDown
        expr: up{job="moodle-webhook"} == 0
        for: 2m
        labels:
          severity: critical
          service: bcm-platform
          component: moodle-webhook
        annotations:
          summary: "Moodle webhook receiver is down"
          description: "Moodle webhook receiver has been down for more than 2 minutes."

      # TheHive Core Health
      - alert: TheHiveCoreDown
        expr: up{job="thehive-core"} == 0
        for: 3m
        labels:
          severity: critical
          service: thehive
          component: core
        annotations:
          summary: "TheHive core service is down"
          description: "TheHive core application has been down for more than 3 minutes."

      # Moodle LMS Health
      - alert: MoodleLMSDown
        expr: up{job="moodle-lms"} == 0
        for: 3m
        labels:
          severity: critical
          service: moodle
          component: lms
        annotations:
          summary: "Moodle LMS is down"
          description: "Moodle LMS has been down for more than 3 minutes."

  - name: bcm-business-continuity
    rules:
      # Critical Incident Response
      - alert: BCMCriticalIncidentCreated
        expr: increase(bcm_incidents_total{severity="critical"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
          service: bcm-platform
          component: incident-management
        annotations:
          summary: "Critical BCM incident created"
          description: "A critical business continuity incident has been created and requires immediate attention."

      # High Number of Open Incidents
      - alert: BCMHighOpenIncidents
        expr: bcm_incidents_open_total > 10
        for: 15m
        labels:
          severity: warning
          service: bcm-platform
          component: incident-management
        annotations:
          summary: "High number of open BCM incidents"
          description: "There are {{ $value }} open incidents in the BCM Platform."

      # RTO/RPO Breach Alert
      - alert: BCMRTOBreached
        expr: bcm_incident_recovery_time_seconds > bcm_incident_rto_seconds
        for: 1m
        labels:
          severity: critical
          service: bcm-platform
          component: incident-management
        annotations:
          summary: "BCM RTO (Recovery Time Objective) breached"
          description: "Incident {{ $labels.incident_id }} has exceeded its RTO threshold."

      # Training Compliance Alert
      - alert: BCMTrainingComplianceLow
        expr: bcm_training_compliance_percentage < 80
        for: 1h
        labels:
          severity: warning
          service: bcm-platform
          component: training
        annotations:
          summary: "BCM training compliance below threshold"
          description: "Training compliance is at {{ $value }}%, below the required 80% threshold."

      # Plan Review Overdue
      - alert: BCMPlanReviewOverdue
        expr: bcm_plans_review_overdue_total > 0
        for: 1h
        labels:
          severity: warning
          service: bcm-platform
          component: plan-management
        annotations:
          summary: "BCM plans review overdue"
          description: "{{ $value }} BCM plans are overdue for review."

  - name: system-resources
    rules:
      # High CPU Usage
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is above 85% on {{ $labels.instance }} for more than 10 minutes."

      # High Memory Usage
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 10m
        labels:
          severity: critical
          component: system
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is above 90% on {{ $labels.instance }}."

      # Low Disk Space
      - alert: LowDiskSpace
        expr: (1 - (node_filesystem_avail_bytes / node_filesystem_size_bytes)) * 100 > 85
        for: 10m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "Low disk space"
          description: "Disk usage is above 85% on {{ $labels.instance }} for {{ $labels.mountpoint }}."

      # High Disk I/O
      - alert: HighDiskIO
        expr: irate(node_disk_io_time_seconds_total[5m]) > 0.8
        for: 10m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High disk I/O detected"
          description: "Disk I/O utilization is above 80% on {{ $labels.instance }} for device {{ $labels.device }}."

  - name: ssl-certificates
    rules:
      # SSL Certificate Expiry Warning
      - alert: SSLCertificateExpiryWarning
        expr: probe_ssl_earliest_cert_expiry - time() < 7 * 24 * 3600
        for: 1h
        labels:
          severity: warning
          component: ssl
        annotations:
          summary: "SSL certificate expiring soon"
          description: "SSL certificate for {{ $labels.instance }} expires in {{ $value | humanizeDuration }}."

      # SSL Certificate Expiry Critical
      - alert: SSLCertificateExpiryCritical
        expr: probe_ssl_earliest_cert_expiry - time() < 2 * 24 * 3600
        for: 1h
        labels:
          severity: critical
          component: ssl
        annotations:
          summary: "SSL certificate expiring very soon"
          description: "SSL certificate for {{ $labels.instance }} expires in {{ $value | humanizeDuration }}."

  - name: endpoint-monitoring
    rules:
      # Endpoint Down
      - alert: EndpointDown
        expr: probe_success == 0
        for: 2m
        labels:
          severity: critical
          component: endpoint
        annotations:
          summary: "Endpoint down"
          description: "Endpoint {{ $labels.instance }} is not responding to health checks."

      # Slow Response Time
      - alert: SlowEndpointResponse
        expr: probe_duration_seconds > 10
        for: 5m
        labels:
          severity: warning
          component: endpoint
        annotations:
          summary: "Slow endpoint response"
          description: "Endpoint {{ $labels.instance }} is responding slowly: {{ $value }}s response time."
