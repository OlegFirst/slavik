version: '3.8'

# Production BCM Platform with Docker AI
# Uses registry images for enterprise deployment

services:
  # Core Infrastructure
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: bcm_platform
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: keycloak
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./core/database/init-keycloak-db.sh:/docker-entrypoint-initdb.d/01-init-keycloak-db.sh
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: bcm
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 3

  # Authentication
  keycloak:
    image: quay.io/keycloak/keycloak:23.0.0
    command: start-dev
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD}
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_HTTP_ENABLED=true
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - keycloak_data:/opt/keycloak/data
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Main BCM Platform (Registry Image)
  odoo:
    image: maxde4/seh-foundation-iso-22301:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      # Database
      - HOST=postgres
      - USER=odoo
      - PASSWORD=${DB_PASSWORD}
      - DB_NAME=bcm_platform
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=odoo
      - DB_PASSWORD=${DB_PASSWORD}

      # Cache
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379

      # Authentication
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=bcm-platform
      - KEYCLOAK_CLIENT_ID=odoo-bcm
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}

      # Docker AI Integration
      - AI_ORCHESTRATOR_URL=http://ai_orchestrator:8000
      - AI_SERVICES_ENABLED=true

      # BCM Configuration
      - BCM_MODE=production
      - BCM_MULTITENANCY=true
      - BCM_AI_ENABLED=true
      - BCM_VERSION=3.0.0-docker-ai
    volumes:
      - odoo_data:/var/lib/odoo
      - odoo_logs:/var/log/odoo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8069/web/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Docker AI Services (Registry Images)
  ai_orchestrator:
    image: maxde4/seh-foundation-iso-22301:ai-orchestrator-latest
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://bcm:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      - ODOO_URL=http://odoo:8069
      - AI_AGENT_MODE=docker-native
      - LOCAL_LLM_ENABLED=${LOCAL_LLM_ENABLED:-false}
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PDCA Assistant (Registry Image)
  pdca_assistant:
    image: maxde4/seh-foundation-iso-22301:pdca-assistant-latest
    depends_on:
      redis:
        condition: service_healthy
      ai_orchestrator:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379/2
      - AI_ORCHESTRATOR_URL=http://ai_orchestrator:8000
    ports:
      - "8010:8010"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8010/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Unified AI Service (Registry Image)
  unified_ai:
    image: maxde4/seh-foundation-iso-22301:unified-ai-latest
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379/1
      - AI_ORCHESTRATOR_URL=http://ai_orchestrator:8000
    ports:
      - "8090:8090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Load Balancer
  traefik:
    image: traefik:v3.0
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
      - "8888:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  keycloak_data:
    driver: local
  odoo_data:
    driver: local
  odoo_logs:
    driver: local

networks:
  default:
    driver: bridge
    name: bcm_production