version: '3.8'

# Docker AI Native BCM Platform
# Leverages Docker Model Runner + MCP + Offload for enterprise AI

services:
  # Docker Model Runner for Local LLM Inference
  model-runner:
    image: docker/model-runner:latest
    platform: linux/amd64
    ports:
      - "8088:8080"
    environment:
      - MODEL_NAME=llama3.2:3b
      - OPENAI_COMPATIBLE_API=true
      - GPU_ACCELERATION=${GPU_ENABLED:-false}
    volumes:
      - model_cache:/root/.cache/huggingface
      - ./models:/models
    labels:
      - "docker.ai.component=model-runner"
      - "docker.ai.capability=inference"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MCP Gateway for BCM Tool Integration
  mcp-gateway:
    build:
      context: ./docker-ai/mcp-gateway
      dockerfile: Dockerfile
    ports:
      - "8089:8080"
    environment:
      - MCP_REGISTRY_URL=https://registry.docker.com/mcp
      - BCM_TOOLS_ENABLED=true
      - ODOO_MCP_URL=http://odoo:8069/mcp
      - KEYCLOAK_MCP_URL=http://keycloak:8080/mcp
    volumes:
      - ./mcp-configs:/app/configs
      - mcp_tools:/app/tools
    depends_on:
      - model-runner
    labels:
      - "docker.ai.component=mcp-gateway"
      - "docker.ai.capability=tool-integration"

  # Enhanced AI Orchestrator with Docker AI Integration
  ai-orchestrator-native:
    build:
      context: ./services/ai_orchestrator
      dockerfile: Dockerfile.docker-ai
    ports:
      - "8000:8000"
    environment:
      # Docker AI Integration
      - DOCKER_MODEL_RUNNER_URL=http://model-runner:8080
      - MCP_GATEWAY_URL=http://mcp-gateway:8080
      - DOCKER_OFFLOAD_ENDPOINT=${DOCKER_OFFLOAD_ENDPOINT}

      # BCM Platform Integration
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://bcm:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      - ODOO_URL=http://odoo:8069

      # AI Agent Configuration
      - AI_AGENT_MODE=docker-native
      - LOCAL_LLM_ENABLED=true
      - GPU_OFFLOAD_ENABLED=${GPU_OFFLOAD_ENABLED:-false}
    volumes:
      - ./ai-models:/app/models
      - agent_memory:/app/memory
    depends_on:
      - redis
      - rabbitmq
      - model-runner
      - mcp-gateway
    labels:
      - "docker.ai.component=orchestrator"
      - "docker.ai.capability=agent-coordination,pdca,bia,risk-analysis"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # BCM Agent - BIA Specialist (GPU Offload Ready)
  bia-agent:
    build:
      context: ./docker-ai/agents/bia
      dockerfile: Dockerfile
    environment:
      - AGENT_ROLE=bia-specialist
      - MODEL_RUNNER_URL=http://model-runner:8080
      - MCP_GATEWAY_URL=http://mcp-gateway:8080
      - DOCKER_OFFLOAD_GPU=${GPU_OFFLOAD_ENABLED:-false}
      - SPECIALIZED_MODEL=business-impact-analysis
    volumes:
      - bia_models:/app/models
      - bia_cache:/app/cache
    depends_on:
      - model-runner
      - mcp-gateway
    labels:
      - "docker.ai.agent=bia-specialist"
      - "docker.ai.capabilities=business-impact,risk-assessment,rto-rpo"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # BCM Agent - Incident Response (MCP Tools Integration)
  incident-agent:
    build:
      context: ./docker-ai/agents/incident
      dockerfile: Dockerfile
    environment:
      - AGENT_ROLE=incident-response
      - MODEL_RUNNER_URL=http://model-runner:8080
      - MCP_GATEWAY_URL=http://mcp-gateway:8080
      - THEHIVE_MCP_TOOL=enabled
      - GRAFANA_MCP_TOOL=enabled
      - NOTIFICATION_MCP_TOOL=enabled
    depends_on:
      - model-runner
      - mcp-gateway
    labels:
      - "docker.ai.agent=incident-response"
      - "docker.ai.capabilities=incident-classification,response-automation,escalation"

  # BCM Agent - Compliance Checker (Enterprise LLM)
  compliance-agent:
    build:
      context: ./docker-ai/agents/compliance
      dockerfile: Dockerfile
    environment:
      - AGENT_ROLE=compliance-specialist
      - MODEL_RUNNER_URL=http://model-runner:8080
      - MCP_GATEWAY_URL=http://mcp-gateway:8080
      - ISO_22301_KNOWLEDGE_BASE=enabled
      - DOCKER_OFFLOAD_COMPUTE=enabled
    depends_on:
      - model-runner
      - mcp-gateway
    labels:
      - "docker.ai.agent=compliance-specialist"
      - "docker.ai.capabilities=iso-22301,audit-preparation,gap-analysis"

  # Docker AI Agent Registry & Discovery
  agent-registry:
    image: nginx:alpine
    ports:
      - "8099:80"
    volumes:
      - ./docker-ai/registry/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker-ai/registry/api:/usr/share/nginx/html:ro
    labels:
      - "docker.ai.component=registry"
      - "docker.ai.capability=agent-discovery,health-monitoring"
    depends_on:
      - ai-orchestrator-native
      - bia-agent
      - incident-agent
      - compliance-agent

  # MCP Tools for BCM Integration
  bcm-mcp-server:
    build:
      context: ./integrations/mcp-server
      dockerfile: Dockerfile
    environment:
      - MCP_SERVER_NAME=bcm-platform
      - MCP_TOOLS=odoo,keycloak,postgres,redis,grafana,thehive
      - ODOO_URL=http://odoo:8069
      - KEYCLOAK_URL=http://keycloak:8080
      - POSTGRES_URL=postgresql://odoo:${DB_PASSWORD}@postgres:5432/bcm_platform
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8087:8080"
    depends_on:
      - postgres
      - redis
      - odoo
      - keycloak
    labels:
      - "docker.ai.component=mcp-server"
      - "docker.ai.tools=bcm-platform-integration"

  # Docker AI Enhanced Scenario Orchestrator
  scenario-orchestrator:
    build:
      context: ./services/scenario_orchestrator
      dockerfile: Dockerfile
    ports:
      - "8085:8085"
    environment:
      - AI_ORCHESTRATOR_URL=http://ai-orchestrator-native:8000
      - MODEL_RUNNER_URL=http://model-runner:8080
      - MCP_GATEWAY_URL=http://mcp-gateway:8080
      - ODOO_URL=http://odoo:8069
      - REDIS_URL=redis://redis:6379/2
      - PORT=8085
    volumes:
      - ./services/scenario_orchestrator:/app
    depends_on:
      - redis
      - ai-orchestrator-native
      - model-runner
    labels:
      - "docker.ai.component=scenario-orchestrator"
      - "docker.ai.capability=scenario-generation,ai-integration"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Docker AI Unified Service
  docker-ai-unified:
    build:
      context: ./services/docker-ai
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      - AI_ORCHESTRATOR_URL=http://ai-orchestrator-native:8000
      - MODEL_RUNNER_URL=http://model-runner:8080
      - REDIS_URL=redis://redis:6379/1
      - PORT=8090
    volumes:
      - ./services/docker-ai:/app
    depends_on:
      - redis
      - ai-orchestrator-native
      - model-runner
    labels:
      - "docker.ai.component=unified-ai-service"
      - "docker.ai.capability=multi-service-ai-processing"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Infrastructure (existing)
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: bcm_platform
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    labels:
      - "docker.ai.infrastructure=database"

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    labels:
      - "docker.ai.infrastructure=cache"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: bcm
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    labels:
      - "docker.ai.infrastructure=message-queue"

  # Keycloak for authentication
  keycloak:
    image: quay.io/keycloak/keycloak:23.0.0
    command: start-dev
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD:-keycloak123}
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin123}
      - KC_HTTP_ENABLED=true
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    labels:
      - "docker.ai.infrastructure=authentication"

  # Odoo BCM Platform
  odoo:
    image: maxde4/seh-foundation-iso-22301:latest
    depends_on:
      - postgres
      - redis
      - keycloak
    ports:
      - "8069:8069"
    environment:
      - DB_HOST=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_URL=redis://redis:6379/0

      # Docker AI Integration
      - AI_ORCHESTRATOR_URL=http://ai-orchestrator-native:8000
      - MODEL_RUNNER_URL=http://model-runner:8080
      - MCP_GATEWAY_URL=http://mcp-gateway:8080
    volumes:
      - ./core/odoo-18.0/addons:/mnt/extra-addons:rw
      - odoo_data:/var/lib/odoo
    labels:
      - "docker.ai.platform=bcm-core"

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  odoo_data:
  model_cache:
  mcp_tools:
  agent_memory:
  bia_models:
  bia_cache:

networks:
  docker-ai:
    driver: bridge
    labels:
      - "docker.ai.network=bcm-platform"