# Site configuration for GitHub Pages
title: ISO 22301 BCM Platform
description: >-
  Enterprise Business Continuity Management Platform built on ISO 22301:2019 standards 
  with AI-powered intelligence for next-generation organizational resilience.

url: "https://seh-foundation.github.io"
baseurl: "/ISO-22301"

# Build settings
markdown: kramdown
highlighter: rouge
theme: minima

# GitHub Pages configuration
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Navigation - optimized proportional layout
# Core technical pages first, then business/support pages
header_pages:
  - index.md
  - architecture.md
  - modules.md
  - interfaces.md
  - dataflows.md
  - scenarios.md
  - technology-leadership.md
  - roadmap.md
  - success-stories.md
  - market-analysis.md
  - navigation.md
  - support.md

# SEO
author: SEH Foundation
social_links:
  - https://github.com/SEH-foundation

# Content settings
show_excerpts: true
paginate: 10

# Exclude from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Collections
collections:
  modules:
    output: true
    permalink: /:collection/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "SEH Foundation"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "modules"
    values:
      layout: "module"