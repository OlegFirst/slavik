# Pre-commit hooks configuration for AI-Platform-ISO
# Install: pip install pre-commit && pre-commit install

repos:
  # Project Agent - Automated Analysis
  - repo: local
    hooks:
      # Generate tests for new/modified Python files
      - id: project-agent-test-generation
        name: Project Agent - Auto Generate Tests
        entry: python -m agent.test_generator
        language: system
        files: \.(py)$
        exclude: ^tests/
        pass_filenames: true
        args: [--file]
        stages: [commit]

      # Security check for Python files
      - id: project-agent-security
        name: Project Agent - Security Check
        entry: python -m agent.security
        language: system
        files: \.(py)$
        pass_filenames: true
        args: [--file]
        stages: [commit]

      # Quality check for Python files (optional - can be slow)
      - id: project-agent-quality
        name: Project Agent - Quality Check
        entry: python -m agent.quality
        language: system
        files: \.(py)$
        pass_filenames: true
        args: [--file]
        stages: [manual]  # Run manually with: pre-commit run project-agent-quality --all-files

  # Standard Python linting and formatting
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of files
      - id: check-yaml
        name: Check YAML syntax
        args: [--safe]
      - id: check-json
        name: Check JSON syntax
      - id: check-added-large-files
        name: Check for large files
        args: [--maxkb=500]
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: debug-statements
        name: Check for debug statements
      - id: mixed-line-ending
        name: Check line endings

  # Black - Python code formatter
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        name: Format Python code with Black
        language_version: python3.11
        args: [--line-length=100]

  # isort - Import sorting
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: Sort Python imports
        args: [--profile=black, --line-length=100]

  # Flake8 - Python linting
  - repo: https://github.com/PyCQA/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        name: Lint Python code with Flake8
        args: [--max-line-length=100, --extend-ignore=E203,W503]

  # MyPy - Static type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        name: Type check Python code
        additional_dependencies: [types-all]
        args: [--ignore-missing-imports, --no-strict-optional]
        exclude: ^tests/

  # Bandit - Security linting
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        name: Security check with Bandit
        args: [-c, .bandit, -r, .]
        exclude: ^tests/

  # Prettier - Format JSON, YAML, Markdown
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        name: Format JSON/YAML/Markdown with Prettier
        types_or: [json, yaml, markdown]

  # Dockerfile linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        name: Lint Dockerfiles

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        name: Lint shell scripts

  # Detect secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        name: Detect hardcoded secrets
        args: [--baseline, .secrets.baseline]
        exclude: package-lock.json

# Global configuration
default_language_version:
  python: python3.11

# Skip hooks for certain files
exclude: |
  (?x)^(
    \.git/|
    __pycache__/|
    \.pytest_cache/|
    node_modules/|
    venv/|
    \.venv/|
    tests/generated/|
    .*\.pyc
  )$

# CI configuration
ci:
  autofix_commit_msg: '🤖 [pre-commit.ci] Auto fixes from hooks'
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '⬆️ [pre-commit.ci] Pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip:
    - project-agent-test-generation  # Skip test generation in CI (done in GitHub Actions)
    - project-agent-security
    - project-agent-quality
